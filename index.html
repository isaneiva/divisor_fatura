document.addEventListener("click", ev => {
  const box = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, i = el.dataset.i, v = el.dataset.v, pid = el.dataset.p, g = el.dataset.g;
  if (act === "fechar"){
    // o fundo escuro só fecha se for tocado nele mesmo; cliques dentro da folha não fecham
    if (el.classList.contains("sheet") && ev.target !== el) return;
    UI.sheet = null; UI.tmp = null; UI.voltar = UI.voltarTmp = null; return render();
  }

  switch(act){
    case "nav": UI.view = v; UI.editando = UI.editandoItem = null; window.scrollTo(0,0); return render();
    case "classificar": UI.view = "lista"; UI.soPend = true; UI.filtroP = null;
      window.scrollTo(0,0); return render();
    case "vertudocat": UI.verTudoCat = !UI.verTudoCat; return render();
    case "vertudofora": UI.verTudoFora = !UI.verTudoFora; return render();
    case "fonteOrc": S.fonteOrc = v; salvar(); window.scrollTo(0,0); return render();
    case "orbase": UI.tmp.f.base = v; return render();
    case "orsalvar": {
      const f = UI.tmp.f;
      const tot = num(String(f.total).replace(/[R$\s]/g,""));
      const lim = {};
      Object.entries(f.limites).forEach(([c, s]) => {
        const v2 = num(String(s == null ? "" : s).replace(/[R$\s]/g,""));
        if (!isNaN(v2) && v2 > 0) lim[c] = v2;
      });
      S.orcamento = {total: isNaN(tot) ? 0 : tot, base: f.base, limites: lim};
      salvar(); UI.sheet = null; UI.tmp = null; UI.view = "orcamento"; return render();
    }
    case "mesResumo": S.mesContas = mesSoma(S.mesContas, +v);
      if (S.faturas.some(f=>f.comp===S.mesContas)) S.rotuloAtivo = compLabel(S.mesContas);
      salvar(); window.scrollTo(0,0); return render();
    case "verpessoa": UI.sheet = "verPessoa"; UI.tmp = {p: pid}; return render();
    case "acerto": {
      const k = el.dataset.k;
      if (S.acertos[k]){ delete S.acertos[k]; salvar(); return render(); }
      const linha = acertoMes(S.mesContas).linhas.find(l => l.chave === k);
      if (!linha) return;
      UI.sheet = "acertar";
      UI.tmp = {chave:k, v:linha.v, recebe:linha.recebe, quem:linha.txt};
      return render();
    }
    case "acok": {
      const t = UI.tmp;
      const v2 = num(String(t.valor).replace(/[R$\s]/g,""));
      S.acertos[t.chave] = {pago:true, valor: isNaN(v2) ? t.v : v2, quando: t.quando};
      salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "togglefat": {
      if (S.fatPagas[i]){ delete S.fatPagas[i]; salvar(); return render(); }
      UI.sheet = "pagarFatura"; UI.tmp = {id:i}; return render();
    }
    case "fatok": {
      const t = UI.tmp, f = S.faturas.find(x=>x.id===t.id); if (!f) return;
      const v2 = num(String(t.valor).replace(/[R$\s]/g,""));
      S.fatPagas[f.id] = {pago:true, valor: isNaN(v2) ? f.lanc.reduce((a,l)=>a+l.v,0) : v2, quando:t.quando};
      salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "abrirfat": {
      const f = S.faturas.find(x=>x.id===i); if (!f) return;
      S.ativa = f.id; S.cartaoAtivo = f.cartaoId; S.rotuloAtivo = f.rotulo;
      UI.view = "lista"; salvar(); window.scrollTo(0,0); return render();
    }
    case "tudoest": UI.tmp.tudoEst = true; return render();
    case "dica": return;
    case "vercatmes": UI.sheet = "verCat"; UI.tmp = {cat: el.dataset.c, escopo:"mes"}; return render();
    case "filtrarpessoa": UI.view = "lista"; UI.filtroP = pid; UI.soPend = false;
      UI.sheet = null; UI.tmp = null; window.scrollTo(0,0); return render();
    case "sheet":
      UI.sheet = v; UI.tmp = null;
      if (v === "novaFatura" && el.dataset.c) UI.tmp = {cartao: el.dataset.c, rotulo: ""};
      if (v === "mudarMes") UI.tmp = {fid: el.dataset.f};
      if (v === "editarConta") UI.tmp = el.dataset.i ? {id: el.dataset.i} : {};
      return render();
    case "vercat": UI.sheet = "verCat"; UI.tmp = {cat: el.dataset.c, escopo: "atual"}; return render();
    case "catcriar": {
      const nome = ((UI.tmp&&UI.tmp.q)||"").trim(); if (!nome) return;
      if (S.cats.some(c=>semAcento(c)===semAcento(nome))) return alert("Essa categoria já existe.");
      S.cats.push(nome); salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "mmSalvar": {
      const t = UI.tmp, f = S.faturas.find(x=>x.id===t.fid);
      if (!f) return;
      const hoje = new Date();
      const [ca, cm] = (f.comp || (hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0"))).split("-").map(Number);
      const comp = (t.ano||ca) + "-" + String(t.mes||cm).padStart(2,"0");
      const antes = f.comp;
      const tinhaAuto = S.faturas.some(x=>x.cartaoId===f.cartaoId && x.lanc.some(l=>l.auto));
      if (antes !== comp) limparAuto(f.cartaoId, f.id);
      const outra = S.faturas.find(x=>x.id!==f.id && x.cartaoId===f.cartaoId && x.comp===comp);
      if (outra){
        if (faturaReal(outra)){ if (antes !== comp && tinhaAuto) propagarTudo(f.cartaoId); salvar();
          return alert("Já existe uma fatura desse mês nesse cartão."); }
        S.faturas = S.faturas.filter(x=>x.id!==outra.id);
      }
      f.comp = comp; f.rotulo = compLabel(comp);
      const n = (antes !== comp && tinhaAuto) ? propagarTudo(f.cartaoId) : 0;
      S.cartaoAtivo = f.cartaoId; S.rotuloAtivo = f.rotulo; S.ativa = f.id;
      salvar(); UI.sheet = null; UI.tmp = null; render();
      return alert("Fatura agora é " + f.rotulo + "." + (n ? "\n" + n + " parcelas futuras refeitas." : ""));
    }
    case "colar": S.ativa = i; UI.sheet = "importar"; UI.tmp = null; return render();
    case "delc": {
      const n = S.faturas.filter(f=>f.cartaoId===i).length;
      if (!confirm(n ? `Apagar esse cartão e suas ${n} fatura(s)?` : "Apagar esse cartão?")) return;
      S.faturas.filter(f=>f.cartaoId===i).forEach(f=>f.lanc.forEach(l=>delete S.aloc[l.id]));
      S.faturas = S.faturas.filter(f=>f.cartaoId!==i);
      S.cartoes = S.cartoes.filter(c=>c.id!==i);
      if (S.cartaoAtivo===i) S.cartaoAtivo = S.cartoes[0]?S.cartoes[0].id:"todos";
      if (!rotulos().includes(S.rotuloAtivo)) S.rotuloAtivo = rotulos()[0]||"";
      salvar(); return render();
    }
    case "modo": UI.modo = v; UI.aberto = null; UI.editando = null; return render();
    case "filtroP": UI.filtroP = v || null; window.scrollTo(0,0); return render();
    case "exp": UI.aberto = (UI.aberto === g) ? null : g; return render();

    case "editar": UI.editando = g; UI.buffer = g; return render();
    case "salvarnome": renomearGrupo(g, UI.buffer); UI.editando = null; return render();
    case "abrirlanc": UI.sheet = "editarLanc"; UI.tmp = {id:i}; return render();
    case "elsalvar": {
      const t = UI.tmp; let alvo = null;
      S.faturas.forEach(f => f.lanc.forEach(l => { if (l.id === t.id) alvo = l; }));
      if (!alvo) return;
      const nome = (t.f.g||"").trim();
      const v2 = num(String(t.f.valor).replace(/[R$\s]/g,""));
      if (nome) { alvo.g = nome; alvo.r = alvo.r || nome; }
      if (!isNaN(v2)) alvo.v = v2;
      alvo.cat = t.f.cat;
      salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "elapagar": {
      if (!confirm("Apagar este lançamento?")) return;
      apagarLanc([UI.tmp.id]);
      UI.sheet=null; UI.tmp=null; return render();
    }
    case "elapagarserie": {
      let alvo = null;
      S.faturas.forEach(f => f.lanc.forEach(l => { if (l.id === UI.tmp.id) alvo = l; }));
      if (!alvo || !alvo.serie) return;
      const ids = S.faturas.flatMap(f=>f.lanc).filter(y=>y.serie===alvo.serie).map(y=>y.id);
      if (!confirm("Apagar as " + ids.length + " parcelas desta compra?")) return;
      apagarLanc(ids);
      UI.sheet=null; UI.tmp=null; return render();
    }
    case "vercatlanc": {
      UI.voltar = "editarLanc"; UI.voltarTmp = UI.tmp;
      UI.sheet = "escolherCat";
      UI.tmp = {alvo:"form", nome: UI.voltarTmp.f.g, atual: UI.voltarTmp.f.cat, q:""};
      return render();
    }
    case "editaritem": UI.editandoItem = i; UI.buffer = ""; return render();
    case "salvaritem": renomearItem(i, UI.buffer); UI.editandoItem = null; return render();

    case "tg": {
      const L = visiveis();
      const ids = (el.dataset.tipo === "cat")
        ? L.filter(l=>(l.cat||"Outros")===g).map(l=>l.id)
        : L.filter(l=>l.g===g).map(l=>l.id);
      return togglePessoa(ids, pid, el.dataset.tipo === "cat" ? null : g);
    }
    case "tgi": return togglePessoa(irmaosSerie(i), pid, null);

    case "addp": { const n = prompt("Nome da pessoa:"); if (!n) return;
      S.pessoas.push({id:uid("p"),nome:n.trim(),cor:S.pessoas.length}); salvar(); return render(); }
    case "delp": {
      if (!confirm("Remover essa pessoa? As atribuições dela serão desfeitas.")) return;
      S.pessoas = S.pessoas.filter(p=>p.id!==i);
      Object.keys(S.aloc).forEach(k=>{ S.aloc[k]=S.aloc[k].filter(x=>x!==i); if(!S.aloc[k].length) delete S.aloc[k]; });
      Object.keys(S.regras).forEach(k=>{ S.regras[k]=S.regras[k].filter(x=>x!==i); if(!S.regras[k].length) delete S.regras[k]; });
      S.cartoes.forEach(c=>{ if(c.pagador===i) c.pagador=S.pessoas[0].id; });
      if (S.euId===i) S.euId = S.pessoas[0].id;
      if (UI.filtroP===i) UI.filtroP = null;
      salvar(); return render();
    }
    case "soueu": S.euId = i; salvar(); return render();
    case "addc": { const n = prompt("Nome do cartão:"); if (!n) return;
      S.cartoes.push({id:uid("c"),nome:n.trim(),pagador:S.pessoas[0].id}); salvar(); return render(); }
    case "abrir": {
      const f = S.faturas.find(x=>x.id===i); if (!f) return;
      S.ativa = i; S.cartaoAtivo = f.cartaoId; S.rotuloAtivo = f.rotulo;
      UI.view = "inicio"; salvar(); window.scrollTo(0,0); return render();
    }
    case "delf": {
      if (!confirm("Apagar essa fatura e seus lançamentos?")) return;
      const f = S.faturas.find(x=>x.id===i);
      if (f) f.lanc.forEach(l=>delete S.aloc[l.id]);
      S.faturas = S.faturas.filter(x=>x.id!==i);
      if (S.ativa===i) S.ativa = S.faturas[0]?S.faturas[0].id:null;
      if (!rotulos().includes(S.rotuloAtivo)) S.rotuloAtivo = rotulos()[0]||"";
      salvar(); return render();
    }
    case "addcat": {
      const n = prompt("Nome da categoria:"); if (!n || !n.trim()) return;
      const nome = n.trim();
      if (S.cats.includes(nome)) return alert("Essa categoria já existe.");
      S.cats.push(nome); salvar(); return render();
    }
    case "delcat": {
      const n = S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.cat===i).length,0);
      if (!confirm(n ? `Apagar "${i}"? Os ${n} lançamentos vão para Outros.` : `Apagar "${i}"?`)) return;
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if (l.cat===i) l.cat = "Outros"; }));
      Object.keys(S.regrasCat).forEach(k=>{ if (S.regrasCat[k]===i) delete S.regrasCat[k]; });
      S.cats = S.cats.filter(c=>c!==i);
      if (!S.cats.includes("Outros")) S.cats.push("Outros");
      salvar(); return render();
    }
    case "gerarparc": {
      const n = gerarTodasParcelas();
      render(); return alert(n + " parcelas futuras criadas.");
    }
    case "limparauto": {
      const n = S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.auto).length,0);
      if (!n) return alert("Não há parcelas previstas para apagar.");
      if (!confirm(`Apagar as ${n} parcelas previstas? As parcelas que vieram da fatura de verdade continuam.`)) return;
      S.faturas.forEach(f=>{ f.lanc.filter(l=>l.auto).forEach(l=>delete S.aloc[l.id]);
                             f.lanc = f.lanc.filter(l=>!l.auto); });
      S.faturas = S.faturas.filter(f=>f.lanc.length || !f.comp || f.comp===compAtual(S.cartoes.find(c=>c.id===f.cartaoId)));
      if (!rotulos().includes(S.rotuloAtivo)) S.rotuloAtivo = rotulos()[0]||"";
      salvar(); return render();
    }
    case "apagarestorno": {
      const r = estornosPendentes()[+i]; if (!r) return;
      if (!confirm("Apagar as " + r.futuras.length + " parcelas previstas de " + r.nome + "?")) return;
      apagarLanc(r.futuras.map(x => x.l.id));
      return render();
    }
    case "limparRegras":
      if (!confirm("Apagar todas as regras de dono e categoria?")) return;
      S.regras = {}; S.regrasCat = {}; salvar(); return render();
    case "tema": S.tema = v; salvar(); return render();

    case "vercatgrupo": {
      const g = el.dataset.g;
      const at = [...new Set(lancAtivos().filter(l=>l.g===g).map(l=>l.cat||"Outros"))];
      UI.voltar = UI.sheet; UI.voltarTmp = UI.tmp;
      UI.sheet = "escolherCat"; UI.tmp = {alvo:"grupo", id:g, nome:g, atual: at.length===1?at[0]:null, q:""};
      return render();
    }
    case "vercatitem": {
      const l = S.faturas.flatMap(f=>f.lanc).find(x=>x.id===i); if (!l) return;
      UI.sheet = "escolherCat"; UI.tmp = {alvo:"item", id:i, nome:l.g, atual:l.cat||"Outros", q:""};
      return render();
    }
    case "vercatconta": {
      const c = S.contas.find(x=>x.id===i); if (!c) return;
      UI.sheet = "escolherCat"; UI.tmp = {alvo:"conta", id:i, nome:c.nome, atual:c.cat||"Boletos", q:""};
      return render();
    }
    case "vercatform": {
      UI.voltar = "editarConta"; UI.voltarTmp = UI.tmp;
      UI.sheet = "escolherCat";
      UI.tmp = {alvo:"form", nome: UI.voltarTmp.f.nome || "Nova conta", atual: UI.voltarTmp.f.cat, q:""};
      return render();
    }
    case "eccriar": {
      const nome = ((UI.tmp&&UI.tmp.q)||"").trim(); if (!nome) return;
      if (S.cats.some(c=>semAcento(c)===semAcento(nome))) return alert("Essa categoria já existe.");
      S.cats.push(nome); salvar();
      return aplicarCat(nome);
    }
    case "ecusar": return aplicarCat(el.dataset.c);
    case "mesConta": S.mesContas = mesSoma(S.mesContas, +v); salvar(); window.scrollTo(0,0); return render();
    case "togglepago": {
      const k = chavePg(i, S.mesContas);
      if (S.pagos[k] && S.pagos[k].pago){ delete S.pagos[k]; salvar(); return render(); }
      UI.sheet = "pagarConta"; UI.tmp = {id:i}; return render();
    }
    case "pgok": {
      const t = UI.tmp, c = S.contas.find(x=>x.id===t.id);
      if (!c) return;
      const v2 = num(String(t.valor).replace(/[R$\s]/g,""));
      S.pagos[chavePg(c.id, S.mesContas)] = {pago:true, valor: isNaN(v2)?c.valor:v2, quando:t.quando};
      salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "cftipo": UI.tmp.f.tipo = v; return render();
    case "cfpessoa": {
      const f = UI.tmp.f, s = new Set(f.pessoas||[]);
      if (s.has(pid)) s.delete(pid); else s.add(pid);
      f.pessoas = [...s]; return render();
    }
    case "cfsalvar": {
      const f = UI.tmp.f;
      if (!f.nome.trim()) return alert("Dê um nome à conta.");
      const v2 = num(String(f.valor).replace(/[R$\s]/g,""));
      const obj = {nome:f.nome.trim(), valor: isNaN(v2)?0:v2, dia:+f.dia||1, tipo:f.tipo,
                   data:f.data, cat:f.cat, pagador:f.pagador, pessoas:f.pessoas||[],
                   desde:f.desde || S.mesContas, ate:f.ate||null};
      if (UI.tmp.id){ Object.assign(S.contas.find(x=>x.id===UI.tmp.id), obj); }
      else S.contas.push(Object.assign({id:uid("ct")}, obj));
      salvar(); UI.sheet=null; UI.tmp=null; UI.view="contas"; return render();
    }
    case "cfapagar": {
      const id = UI.tmp.id;
      if (!confirm("Apagar essa conta e todo o histórico de pagamento dela?")) return;
      S.contas = S.contas.filter(x=>x.id!==id);
      Object.keys(S.pagos).forEach(k=>{ if (k.split(":")[0]===id) delete S.pagos[k]; });
      salvar(); UI.sheet=null; UI.tmp=null; return render();
    }
    case "backup": baixar(nomeBackup(), JSON.stringify(S), "application/json"); return;
    case "compartilharbackup": {
      const nome = nomeBackup();
      const file = new File([JSON.stringify(S)], nome, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]}))
        navigator.share({files:[file], title:nome}).catch(()=>{});
      else { baixar(nome, JSON.stringify(S), "application/json");
             alert("Este navegador não abre o compartilhamento. Baixei o arquivo na pasta Downloads."); }
      return;
    }
    case "apagartudo": {
      if (!confirm("Apagar TUDO: lançamentos, faturas, cartões, pessoas, categorias e regras?")) return;
      if (!confirm("Isso não tem volta. Você baixou um backup? Toque em OK só se tiver certeza.")) return;
      const tema = S.tema;
      S = inicial(); S.tema = tema; S.faturas = []; S.cartoes = []; S.ativa = null;
      S.cartaoAtivo = "todos"; S.rotuloAtivo = "";
      salvar(); UI = {view:"config", modo:"grupo", soPend:false, filtroP:null, aberto:null,
                      sheet:null, tmp:null, editando:null, editandoItem:null, buffer:""};
      window.scrollTo(0,0); return render();
    }
    case "restaurar": return document.getElementById("filein").click();

    case "nfcriar": {
      const t = UI.tmp || {};
      const cid = t.cartao||S.cartoes[0].id;
      const comp = compDeRotulo((t.rotulo||"").trim());
      if (comp && S.faturas.some(f=>f.cartaoId===cid && f.comp===comp))
        return alert("Já existe uma fatura desse mês nesse cartão.");
      const nova = {id:uid("f"), cartaoId:cid, comp:comp||null,
                    rotulo: comp ? compLabel(comp) : ((t.rotulo||"").trim()||"Nova fatura"), lanc:[]};
      S.faturas.unshift(nova); S.ativa = nova.id;
      S.cartaoAtivo = nova.cartaoId; S.rotuloAtivo = nova.rotulo; salvar();
      UI.sheet = "importar"; UI.tmp = null; return render();
    }
    case "impler": {
      const prev = lerColado((UI.tmp&&UI.tmp.txt)||"");
      if (!prev.length) return alert("Não identifiquei lançamentos nesse texto.");
      const f = S.faturas.find(x=>x.id===S.ativa) || fatura();
      prev.forEach(x=>{
        const parc = (x.p||"").trim();
        x.dup = !!(f && parc && f.lanc.some(l => l.p===parc && semAcento(l.g)===semAcento(x.g) && !l.auto));
      });
      UI.tmp.prev = prev; return render();
    }
    case "pvdup": UI.tmp.prev[+i].dup = !UI.tmp.prev[+i].dup; return render();
    case "enviararq": { const sel = document.getElementById("filefatura"); if (sel) sel.click(); return; }
    case "impvoltar": UI.tmp.prev = null; UI.tmp.arquivos = null; return render();
    case "pvdel": UI.tmp.prev.splice(+i,1); return render();
    case "impconfirma": {
      const f = S.faturas.find(x=>x.id===S.ativa) || fatura(); let n = 0;
      let ign = 0, ger = 0;
      UI.tmp.prev.forEach(x=>{
        const val = num(String(x.v).replace(/[R$\s]/g,""));
        if (!x.g || isNaN(val)) return;
        if (x.dup){ ign++; return; }
        const parc = (x.p||"").trim()||null;
        // se já existe uma parcela prevista igual, ela vira a real em vez de duplicar
        const prev = parc && f.lanc.find(l=>l.auto && l.p===parc && semAcento(l.g)===semAcento(x.g));
        if (prev){ prev.auto = false; prev.v = val; if (x.d) prev.d = x.d; n++; return; }
        const id = uid("l");
        const novo = {id, d:x.d||"", r:x.g, g:x.g, v:val, p:parc,
                      cat:S.regrasCat[x.g] || categorizar(x.g)};
        f.lanc.push(novo);
        if (S.regras[x.g]) S.aloc[id] = S.regras[x.g].slice();
        ger += propagar(novo, f);
        n++;
      });
      S.cartaoAtivo = f.cartaoId; S.rotuloAtivo = f.rotulo;
      salvar(); UI.sheet=null; UI.tmp=null; UI.view="lista"; UI.soPend=false; window.scrollTo(0,0); render();
      return alert(n + " lançamentos importados." +
        (ger ? "\n" + ger + " parcelas futuras criadas." : "") +
        (ign ? "\n" + ign + " ignorados por já estarem previstos." : ""));
    }

    case "xcsv": { const t=UI.tmp; if(!valida(t))return; baixar(nomeArquivo(t,"csv"), gerarCSV(t), "text/csv;charset=utf-8"); UI.sheet=null; return render(); }
    case "xsheets": { const t=UI.tmp; if(!valida(t))return;
      return copiar(gerarTSV(t), "Copiado. Abra o Google Sheets, toque numa célula e cole — vai separar em colunas sozinho."); }
    case "xtexto": { const t=UI.tmp; if(!valida(t))return; return copiar(gerarTexto(t), "Resumo copiado."); }
    case "xshare": {
      const t = UI.tmp; if (!valida(t)) return;
      const nome = nomeArquivo(t,"csv");
      const file = new File([gerarCSV(t)], nome, {type:"text/csv"});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:nome})
          .then(()=>{ UI.sheet=null; UI.tmp=null; render(); })
          .catch(()=>{});
      } else {
        baixar(nome, gerarCSV(t), "text/csv;charset=utf-8");
        alert("Este navegador não abre o compartilhamento. Baixei o arquivo — envie para o Drive pela pasta Downloads.");
      }
      return;
    }
  }
});
function aplicarCat(cat){
  const t = UI.tmp;
  if (t.alvo === "grupo"){
    S.faturas.forEach(f => f.lanc.forEach(l => { if (l.g === t.id) l.cat = cat; }));
    S.regrasCat[t.id] = cat;
  } else if (t.alvo === "item"){
    const l = S.faturas.flatMap(f=>f.lanc).find(x=>x.id===t.id);
    if (l) l.cat = cat;
  } else if (t.alvo === "conta"){
    const c = S.contas.find(x=>x.id===t.id);
    if (c) c.cat = cat;
  } else if (t.alvo === "form"){
    UI.sheet = UI.voltar; UI.tmp = UI.voltarTmp; UI.voltar = UI.voltarTmp = null;
    if (UI.tmp && UI.tmp.f) UI.tmp.f.cat = cat;
    return render();
  }
  salvar();
  UI.sheet = UI.voltar || null; UI.tmp = UI.voltarTmp || null;
  UI.voltar = UI.voltarTmp = null;
  return render();
}

function valida(t){
  if (!t.sel.length && !t.pend){ alert("Escolha pelo menos uma pessoa."); return false; }
  return true;
}

document.addEventListener("change", ev => {
  if (ev.target.id === "filefatura"){
    const arq = ev.target.files;
    if (arq && arq.length) lerArquivos(arq);
    ev.target.value = "";
    return;
  }
  if (ev.target.id === "filein"){
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try {
      const d = JSON.parse(r.result);
      if (!d.pessoas || !d.faturas) throw 0;
      const temaAtual = S.tema;
      S = d; S.regrasCat = S.regrasCat||{}; S.cats = (d.cats&&d.cats.length)?d.cats:DEFAULT_CATS.slice();
      if (!S.tema) S.tema = temaAtual;
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if(!l.cat) l.cat = categorizar(l.g);
        if(!S.cats.includes(l.cat)) S.cats.push(l.cat); }));
      salvar(); render(); alert("Backup restaurado.");
    } catch(e){ alert("Esse arquivo não é um backup válido."); } };
    return r.readAsText(file);
  }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  switch(act){
    case "cartao": {
      S.cartaoAtivo = el.value;
      const rs = rotulos();
      if (!rs.includes(S.rotuloAtivo)) S.rotuloAtivo = rs[0]||"";
      UI.aberto=null; salvar(); window.scrollTo(0,0); return render();
    }
    case "rotulo": S.rotuloAtivo = el.value; UI.aberto=null; salvar(); window.scrollTo(0,0); return render();
    case "vcescopo": UI.tmp.escopo = el.value; return render();
    case "mmMes": UI.tmp.mes = +el.value; return render();
    case "mmAno": UI.tmp.ano = +el.value; return render();
    case "sopend": UI.soPend = el.checked; return render();
    case "ordem": UI.ordem = el.value; return render();
    case "cat": return mudarCategoria(el.dataset.g, el.value);
    case "cfcat": UI.tmp.f.cat = el.value; return render();
    case "pagador": { const c=S.cartoes.find(x=>x.id===i); if(c) c.pagador=el.value; salvar(); return render(); }
    case "renome": { const p=pessoa(i); if(p&&el.value.trim()) p.nome=el.value.trim(); salvar(); return render(); }
    case "fechamento": case "vencimento": {
      const c = S.cartoes.find(x=>x.id===i); if (!c) return;
      const v = parseInt(el.value,10);
      c[act] = (v>=1 && v<=31) ? v : null;
      if (act==="fechamento" && c.fechamento){
        const comp = compAtual(c);
        if (!S.faturas.some(f=>f.cartaoId===c.id && f.comp===comp)) garantirFatura(c.id, comp);
      }
      salvar(); return render();
    }
    case "renomecat": {
      const novo = el.value.trim(); if (!novo || novo === i) return;
      if (S.cats.includes(novo)) { el.value = i; return alert("Já existe uma categoria com esse nome."); }
      S.cats = S.cats.map(c => c===i ? novo : c);
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if (l.cat===i) l.cat = novo; }));
      Object.keys(S.regrasCat).forEach(k=>{ if (S.regrasCat[k]===i) S.regrasCat[k] = novo; });
      salvar(); return render();
    }
    case "renomec": { const c=S.cartoes.find(x=>x.id===i); if(c&&el.value.trim()) c.nome=el.value.trim(); salvar(); return render(); }
    case "xsel": { const t=UI.tmp; t.sel = el.checked ? [...new Set([...t.sel,i])] : t.sel.filter(x=>x!==i); return; }
    case "xpend": UI.tmp.pend = el.checked; return;
    case "xcontas": UI.tmp.contas = el.checked; return;
    case "xescopo": UI.tmp.escopo = el.value; return;
    case "nfcartao": UI.tmp.cartao = el.value; return;
    case "cf": UI.tmp.f[el.dataset.k] = el.value; return render();
    case "acq": UI.tmp.quando = el.value; return;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "bufnome"){ UI.buffer = el.value; return; }
  if (a === "catq"){ UI.tmp = UI.tmp||{}; UI.tmp.q = el.value; render(); return; }
  if (a === "imptxt"){ UI.tmp = UI.tmp||{}; UI.tmp.txt = el.value; return; }
  if (a === "nfrotulo"){ UI.tmp = UI.tmp||{}; UI.tmp.rotulo = el.value; return; }
  if (a === "pv"){ UI.tmp.prev[+el.dataset.i][el.dataset.k] = el.value; return; }
  if (a === "orf"){ UI.tmp.f.total = el.value; previa("previaOrc", el.value); return; }
  if (a === "orlim"){ UI.tmp.f.limites[el.dataset.c] = el.value; return; }
  if (a === "orq"){ UI.tmp.q = el.value; render(); return; }
  if (a === "elf"){
    UI.tmp.f[el.dataset.k] = el.value;
    if (el.dataset.k === "valor") previa("previaLanc", el.value);
    return;
  }
  if (a === "cf"){
    UI.tmp.f[el.dataset.k] = el.value;
    if (el.dataset.k === "valor") previa("previaValor", el.value);
    return;
  }
  if (a === "ecq"){ UI.tmp.q = el.value; render(); return; }
  if (a === "pgv"){ UI.tmp.valor = el.value; previa("previaPago", el.value); return; }
  if (a === "acv"){ UI.tmp.valor = el.value; previa("previaAcerto", el.value); return; }
  if (a === "acq"){ UI.tmp.quando = el.value; return; }
  if (a === "pgq"){ UI.tmp.quando = el.value; return; }
});

document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const el = ev.target.closest("[data-act='bufnome']"); if (!el) return;
  ev.preventDefault();
  if (UI.editando){ renomearGrupo(UI.editando, UI.buffer); UI.editando = null; }
  else if (UI.editandoItem){ renomearItem(UI.editandoItem, UI.buffer); UI.editandoItem = null; }
  render();
});

migrar();
aplicarTema();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => { if (!S.tema || S.tema==="auto") aplicarTema(); });
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
