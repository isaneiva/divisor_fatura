sheets.escolherCat = () => {
  const t = UI.tmp || (UI.tmp = {});
  const q = (t.q || "").trim();
  const norm = s => semAcento(s).trim();
  const achados = S.cats.filter(c => !q || norm(c).includes(norm(q)));
  const existe = S.cats.some(c => norm(c) === norm(q));
  const conta = c => S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.cat===c).length,0)
                   + S.contas.filter(x=>(x.cat||"Boletos")===c).length;
  const titulo = {grupo:"Categoria do estabelecimento", item:"Categoria do lançamento", conta:"Categoria da conta"}[t.alvo] || "Categoria";
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <h3>${titulo}</h3>
    <p style="font-size:14px;color:var(--mute);margin:0 0 6px">${esc(t.nome||"")}</p>
    ${t.nome && t.alvo!=="form" ? blocoMarca(t.nome) : ""}
    ${t.alvo==="grupo" ? `<p style="font-size:12.5px;color:var(--mute);margin:0 0 12px">
      Vale para todos os lançamentos deste estabelecimento e vira regra para as próximas faturas.</p>`
     : (t.alvo==="item" ? `<p style="font-size:12.5px;color:var(--mute);margin:0 0 12px">
      Muda só este lançamento. O estabelecimento continua na categoria dele.</p>` : `<div style="height:8px"></div>`)}
    <div class="srch"><input data-act="ecq" data-foco value="${esc(t.q||"")}" placeholder="Buscar categoria"></div>
    ${q && !existe ? `<button class="btn pri" data-act="eccriar">Criar "${esc(q)}" e usar</button>` : ""}
    <div class="row">${achados.length ? achados.map(c=>`
      <button class="catopt" data-act="ecusar" data-c="${esc(c)}">
        <div class="badge" style="--c:${corCat(c)};width:36px;height:36px;border-radius:11px;font-size:14px">${esc(inicialCat(c))}</div>
        <b>${esc(c)}</b>
        ${c===t.atual?`<span class="pill pg-paga">atual</span>`:`<span class="tag">${conta(c)}</span>`}
      </button>`).join("") : `<div class="empty" style="padding:22px">Nenhuma categoria com esse nome.</div>`}</div>
    <button class="btn" data-act="fechar">Fechar</button>
  </div></div>`;
};

sheets.editarConta = () => {
  const t = UI.tmp || (UI.tmp = {});
  const nova = !t.id;
  const c = nova ? null : S.contas.find(x => x.id === t.id);
  if (t.f === undefined){
    t.f = c ? JSON.parse(JSON.stringify(c))
            : {nome:"", valor:"", dia:10, tipo:"mensal", data:hojeISO(), cat:"Boletos",
               pagador:S.euId, pessoas:[S.euId], desde:S.mesContas};
    if (c) t.f.valor = paraCampo(c.valor);
  }

/* ================= leitura de prints e PDFs ================= */
const PDFJS_SRC    = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
const TESS_SRC     = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const TESS_LANG    = "https://tessdata.projectnaptha.com/4.0.0_fast";
let workerOCR = null;

function carregarScript(src){
  return new Promise((ok, erro) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return ok();
    const s = document.createElement("script");
    s.src = src; s.dataset.src = src;
    s.onload = () => ok();
    s.onerror = () => erro(new Error("sem conexão para baixar o leitor"));
    document.head.appendChild(s);
  });
}

async function textoDoPDF(file, aviso){
  await carregarScript(PDFJS_SRC);
  const lib = window.pdfjsLib;
  if (!lib) throw new Error("leitor de PDF não carregou");
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let txt = "";
  for (let i = 1; i <= doc.numPages; i++){
    aviso("página " + i + "/" + doc.numPages);
    const pg = await doc.getPage(i), c = await pg.getTextContent();
    let ly = null, linha = [];
    c.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      if (ly !== null && Math.abs(y - ly) > 3){ txt += linha.join(" ") + "\n"; linha = []; }
      ly = y; linha.push(it.str);
    });
    txt += linha.join(" ") + "\n";
  }
  return txt;
}

async function textoDaImagem(file, aviso){
  await carregarScript(TESS_SRC);
  if (!window.Tesseract) throw new Error("leitor de imagem não carregou");
  if (!workerOCR){
    aviso("preparando o leitor…");
    workerOCR = await window.Tesseract.createWorker("por", 1, {langPath: TESS_LANG});
  }
  aviso("lendo…");
  const { data } = await workerOCR.recognize(file);
  return data.text;
}

async function lerArquivos(lista){
  const arqs = [...lista].sort((a,b) => a.name.localeCompare(b.name, "pt-BR", {numeric:true}));
  UI.tmp = UI.tmp || {};
  UI.tmp.arquivos = arqs.map(f => ({nome:f.name, estado:"na fila"}));
  UI.tmp.lendo = true;
  render();
  const aviso = i => msg => { const el = document.getElementById("arq" + i); if (el) el.textContent = msg; };
  let juntos = "";
  for (let i = 0; i < arqs.length; i++){
    const f = arqs[i];
    try {
      aviso(i)("abrindo…");
      const t = (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name))
        ? await textoDoPDF(f, aviso(i)) : await textoDaImagem(f, aviso(i));
      juntos += t + "\n";
      UI.tmp.arquivos[i].estado = "✓ lido";
      aviso(i)("✓ lido");
    } catch(e){
      UI.tmp.arquivos[i].estado = "✕ " + (e.message || "não consegui ler");
      aviso(i)(UI.tmp.arquivos[i].estado);
    }
  }
  if (workerOCR){ try { await workerOCR.terminate(); } catch(e){} workerOCR = null; }
  UI.tmp.lendo = false;
  UI.tmp.txt = ((UI.tmp.txt || "") + "\n" + juntos).trim();
  const prev = lerColado(UI.tmp.txt);
  if (!prev.length){ render(); return alert("Li os arquivos, mas não identifiquei lançamentos. Confira o texto na caixa abaixo."); }
  const fat = S.faturas.find(x => x.id === S.ativa) || fatura();
  prev.forEach(x => { const parc = (x.p||"").trim();
    const val0 = num(String(x.v).replace(/[R$\s]/g,""));
    x.dup = !!(fat && parc && fat.lanc.some(l => !l.auto && mesmaParcela(l, {g:x.g, p:parc, d:x.d, v:val0}))); });
  UI.tmp.prev = prev;
  render();
}

/* ================= leitor ================= */
const MESES = {janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const RUIDO = /^(cart[aã]o virtual adicional|carteiras digitais adicional|adicional|image labels.*|[<>»«\-–—]+)$/i;
const RE_VAL = /(-|−)?\s*R\$\s*([\d.]+,\d{2})/;
const RE_PARC1 = /parcela\s+(\d+)\s+de\s+(\d+)/i;
const RE_PARC2 = /(\d{2})\s*\/\s*(\d{2})\s*$/;
function num(s){
  const x = String(s == null ? "" : s).trim().replace(/[^\d.,\-]/g, "");
  if (!x || x === "-") return NaN;
  const sep = Math.max(x.lastIndexOf(","), x.lastIndexOf("."));
  if (sep < 0) return parseFloat(x);
  const dec = x.slice(sep + 1);
  // 1 ou 2 dígitos depois do último separador = casa decimal; o resto é separador de milhar
  if (/^\d{1,2}$/.test(dec))
    return parseFloat(x.slice(0, sep).replace(/[.,]/g, "") + "." + dec);
  return parseFloat(x.replace(/[.,]/g, ""));
}
function previa(id, txt){
  const el = document.getElementById(id); if (!el) return;
  const n2 = num(String(txt).replace(/[R$\s]/g, ""));
  el.textContent = isNaN(n2) ? "digite o valor" : brl(n2);
  el.style.color = isNaN(n2) ? "var(--mute)" : "#0A8A6E";
}
const paraCampo = v => (v == null || v === "" || isNaN(v)) ? "" : Number(v).toFixed(2).replace(".", ",");
const parcNoNome = s => { const m = s.match(RE_PARC2); return m ? +m[1]+"/"+ +m[2] : ""; };
const limpaNome = s => s.replace(RE_PARC2,"").replace(/[>›»<‹«]/g,"").replace(/\s{2,}/g," ").trim();

/* num campo separado por | reconhecemos o pedaço pelo formato, não pela posição.
   Assim valem tanto "data | estabelecimento | valor | parcela" quanto
   "data | estabelecimento | descrição | valor" — e as duas juntas. */
const RE_SO_PARC = /^\d{1,3}\s*\/\s*\d{1,3}$/;
const RE_SO_VALOR = /^[-−(]?\s*R?\$?\s*\d{1,3}([.\s]\d{3})*([.,]\d{1,2})?\s*\)?$/;
const ehValor = s => RE_SO_VALOR.test(String(s).trim()) && /\d/.test(s);
function lerLinhaPipe(l){
  const c = l.split(/[|;\t]/).map(s=>s.trim());
  const o = {d:c[0]||"", g:c[1]||"", v:"", p:"", desc:""};
  const sobra = [];
  for (let i = 2; i < c.length; i++){
    const x = c[i]; if (!x) continue;
    if (!o.p && RE_SO_PARC.test(x)){ o.p = x.replace(/\s/g,""); continue; }
    if (ehValor(x)){
      const neg = /^\(.*\)$/.test(x) || /^[-−]/.test(x);      // (R$ 0,15) = estorno
      o.v = (neg?"-":"") + x.replace(/[R$()\s−-]/g,"");
      continue;
    }
    sobra.push(x);
  }
  o.desc = sobra.join(" · ");
  return o;
}
function lerColado(txt){
  const linhas = txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s && !RUIDO.test(s));
  if (linhas.filter(l=>/[|;]/.test(l)).length > linhas.length*0.5){
    return linhas.map(lerLinhaPipe).filter(x=>x.g && !/^(data|dt)$/i.test(x.d));
  }
  let dataAtual = ""; const nomes = [], valores = [];
  for (const l of linhas){
    let m = l.match(/^(\d{1,2})\s+de\s+([a-zç]+)/i);
    if (m && MESES[m[2].toLowerCase()]){ dataAtual = String(m[1]).padStart(2,"0")+"/"+String(MESES[m[2].toLowerCase()]).padStart(2,"0"); continue; }
    m = l.match(/^(\d{1,2})\/(\d{1,2})(\/\d{2,4})?$/);
    if (m){ dataAtual = m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"); continue; }
    const v = l.match(RE_VAL);
    const resto = v ? l.replace(RE_VAL,"").replace(RE_PARC1,"").replace(/[>›»]/g,"").trim() : "";
    const pm = l.match(RE_PARC1);
    if (v && resto.length > 2){
      nomes.push({d:dataAtual, g:limpaNome(resto), p:pm?pm[1]+"/"+pm[2]:parcNoNome(resto)});
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else if (v){
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else {
      if (pm && valores.length){ valores[valores.length-1].p = pm[1]+"/"+pm[2]; continue; }
      nomes.push({d:dataAtual, g:limpaNome(l), p:parcNoNome(l)});
    }
  }
  return nomes.map((n,i)=>({d:n.d, g:n.g, v:valores[i]?valores[i].v:"", p:n.p || (valores[i]?valores[i].p:"") || ""}));
}

/* ================= exportação ================= */
function linhasExport(t){
  const fs = t.escopo==="todas" ? S.faturas : faturasAtivas();
  const out = [];
  fs.forEach(f=>{
    const c = cartaoDe(f);
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id));
      if (!a.length){
        if (t.pend) out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:1,quem:"(sem dono)",val:l.v});
        return;
      }
      a.forEach(id=>{ if (t.sel.includes(id))
        out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:a.length,quem:pessoa(id).nome,val:l.v/a.length}); });
    });
  });
  return out;
}
const CAB = ["fatura","cartao","data","estabelecimento","categoria","parcela","valor_total","dividido_entre","pessoa","valor_da_pessoa"];
function linhasContas(t){

                quem:pessoa(id).nome, val:x.valor/a.length}); });

}
const campos = o => [o.f,o.c,o.d,o.g,o.cat,o.p,o.tot.toFixed(2).replace(".",","),o.div,o.quem,o.val.toFixed(2).replace(".",",")];

const todasLinhas = t => linhasExport(t).concat(linhasContas(t));
const saidaCSV = t => (t.formato!=="tabela") ? "\uFEFF"+gerarPlanilha(t,";") : gerarCSV(t);
const saidaTSV = t => (t.formato!=="tabela") ? gerarPlanilha(t,"\t") : gerarTSV(t);

/* ---------- planilha por pessoa, no formato de repasse ----------
   Um bloco por pessoa e por cartão: título, vencimento, tabela e TOTAL.
   O valor da linha é sempre a parte daquela pessoa; quando a compra foi
   dividida, a descrição registra o ÷N para a conta bater com a fatura. */
const CAB_PLANILHA = ["Data","Estabelecimento","Descrição","Categoria","Parcela","Quem paga","Valor (R$)"];
const brlCel = v => (v < 0 ? "(R$ " + brl(Math.abs(v)).replace("R$ ","") + ")" : brl(v));
function somaDias(iso, n){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso||"")) return null;
  const d = new Date(iso + "T12:00");
  d.setDate(d.getDate() + n);
  const p = x => String(x).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
const brDia = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso||"") ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";

function blocosPlanilha(t){
  const fs = t.escopo === "todas" ? S.faturas : faturasAtivas();
  const alvos = S.pessoas.filter(p => t.sel.includes(p.id));
  if (t.pend) alvos.push({id:"__sem", nome:"Sem dono", cor:0});
  const blocos = [];

  alvos.forEach(p => {
    fs.forEach(f => {
      const c = cartaoDe(f);
      const itens = f.lanc.filter(l => {
        const a = alocDe(l.id).filter(id => pessoa(id));
        return p.id === "__sem" ? !a.length : a.includes(p.id);
      });
      if (!itens.length) return;
      const pagador = c && c.pagador ? (pessoa(c.pagador)||{}).nome : "";
      const linhas = ordenarPorData(itens.map(l => Object.assign({_f:f}, l))).map(l => {
        const a = alocDe(l.id).filter(id => pessoa(id));
        const div = a.length || 1;
        const desc = (l.desc||"") + (div > 1 ? (l.desc?" · ":"") + "÷"+div : "");
        return [dataLonga(l), l.g, desc, l.cat||"Outros",
                l.p && l.p !== "estorno" ? l.p : (l.p==="estorno"?"estorno":""),
                pagador || "", brlCel(l.v/div)];
      });
      const total = itens.reduce((s,l) => {
        const div = (alocDe(l.id).filter(id=>pessoa(id)).length) || 1;
        return s + l.v/div; }, 0);
      const venc = dataVenc(c, f.comp);
      const rotuloTotal = p.id === S.euId ? "TOTAL A PAGAR" : "TOTAL A RECEBER";
      blocos.push({
        titulo: "Compras " + (p.id==="__sem" ? "sem dono" : "de " + p.nome) + " — Fatura " + (c?c.nome:"cartão"),
        sub: (venc ? "Vencimento da fatura: " + brDia(venc) : "Fatura " + f.rotulo)
           + (venc && p.id!=="__sem" ? " · " + p.nome + " repassa em " + brDia(somaDias(venc,-2)) : ""),
        linhas, total, rotuloTotal
      });
    });

    if (t.contas && p.id !== "__sem"){
      const cs = contasDoMes(S.mesContas).filter(x => (x.c.pessoas||[]).includes(p.id));
      if (cs.length){
        const linhas = cs.map(x => {
          const div = ((x.c.pessoas||[]).filter(id=>pessoa(id)).length) || 1;
          return [brDia(x.venc)||dia(x.venc), x.c.nome,
                  (x.pago?"paga":"em aberto") + (div>1?" · ÷"+div:""),
                  x.c.cat||"Boletos", "", "", brlCel(x.valor/div)];
        });
        blocos.push({titulo:"Contas de " + p.nome + " — " + compLabel(S.mesContas), sub:"",
          linhas, total: linhas.reduce((s,_,i)=>{
            const x = cs[i], div = ((x.c.pessoas||[]).filter(id=>pessoa(id)).length)||1;
            return s + x.valor/div; }, 0),
          rotuloTotal: p.id === S.euId ? "TOTAL A PAGAR" : "TOTAL A RECEBER"});
      }
    }
  });
  return blocos;
}
const ordenarPorData = L => [...L].sort((a,b)=>{ const x=chaveData(a), y=chaveData(b);
  return x<y?-1:(x>y?1:0); });

function gerarPlanilha(t, sep){
  const s = sep || ";";
  const cel = x => { const v = String(x == null ? "" : x).replace(/[\r\n]+/g," ");
    if (s === "\t") return v.replace(/\t/g," ");          // colar no Sheets: sem aspas
    return (v.includes(s) || v.includes('"')) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const out = [];
  const blocos = blocosPlanilha(t);
  if (!blocos.length) return "Nada para exportar com essas opções.";
  blocos.forEach((b, i) => {
    if (i) out.push("", "");
    out.push([b.titulo].map(cel).join(s));
    if (b.sub) out.push([b.sub].map(cel).join(s));
    out.push("");
    out.push(CAB_PLANILHA.map(cel).join(s));
    b.linhas.forEach(l => out.push(l.map(cel).join(s)));
    out.push(["","","","","",b.rotuloTotal, brlCel(b.total)].map(cel).join(s));
  });
  out.push("", "Notas:");
  out.push(cel("· Coluna Parcela = parcela atual / total de parcelas."));
  out.push(cel("· Valores entre parênteses são estornos."));
  out.push(cel("· ÷N na descrição significa compra dividida — o valor já é a parte da pessoa."));
  out.push(cel("· Última data de atualização: " + brDia(hojeISO())));
  return out.join("\n");
}
function gerarCSV(t){
  return "\uFEFF" + CAB.join(";") + "\n" +
    todasLinhas(t).map(o=>campos(o).map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");
}
function gerarTSV(t){
  return CAB.join("\t") + "\n" + todasLinhas(t).map(o=>campos(o).join("\t")).join("\n");
}
function gerarTexto(t){
  const L = todasLinhas(t), out = [];
  out.push(t.escopo==="todas" ? "Todas as faturas"
    : (S.rotuloAtivo + (S.cartaoAtivo==="todos" ? " · todos os cartões" : " · " + (S.cartoes.find(c=>c.id===S.cartaoAtivo)||{}).nome)), "");
  [...new Set(L.map(o=>o.quem))].forEach(nome=>{
    const meus = L.filter(o=>o.quem===nome), porCat = {};
    meus.forEach(o=>{ porCat[o.cat] = (porCat[o.cat]||0) + o.val; });
    out.push(nome.toUpperCase());
    Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([c,v])=>out.push("  "+c+" — "+brl(v)));
    out.push("  total: " + brl(meus.reduce((a,o)=>a+o.val,0)), "");
  });
  if (t.escopo==="atual"){
    const tt = totais(), ac = acerto();
    out.push("Fatura: " + brl(tt.total));
    ac.linhas.forEach(l=>out.push("  " + l.txt + ": " + brl(l.v)));
  }
  return out.join("\n");
}
function nomeArquivo(t, ext){
  const base = t.escopo==="todas" ? "todas" : (S.rotuloAtivo.replace(/\W+/g,"-").toLowerCase());
  return "gastos-" + base + "." + ext;
}
function nomeBackup(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return "divisor-backup-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".json";
}
function baixar(nome, conteudo, tipo){
  const u = URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 800);
}
async function copiar(txt, msg){
  try { await navigator.clipboard.writeText(txt); alert(msg); }
  catch(e){ prompt("Copie o conteúdo:", txt); }
}

        const prev = parc && f.lanc.find(l => l.auto && mesmaParcela(l, {g:x.g, p:parc, d:x.d, v:val}));

function aplicarCat(cat){
  const t = UI.tmp;
  if (t.alvo === "grupo"){
    S.faturas.forEach(f => f.lanc.forEach(l => { if (l.g === t.id) l.cat = cat; }));
    S.regrasCat[t.id] = cat;
  } else if (t.alvo === "item"){
    const l = S.faturas.flatMap(f=>f.lanc).find(x=>x.id===t.id);
    if (l) l.cat = cat;
  } else if (t.alvo === "conta"){
    const c = S.contas.find(x=>x.id===t.id);
    if (c) c.cat = cat;
  } else if (t.alvo === "form"){
    UI.sheet = UI.voltar; UI.tmp = UI.voltarTmp; UI.voltar = UI.voltarTmp = null;
    if (UI.tmp && UI.tmp.f) UI.tmp.f.cat = cat;
    return render();
  }
  salvar();
  UI.sheet = UI.voltar || null; UI.tmp = UI.voltarTmp || null;
  UI.voltar = UI.voltarTmp = null;
  return render();
}

function valida(t){
  if (!t.sel.length && !t.pend){ alert("Escolha pelo menos uma pessoa."); return false; }
  return true;
}

document.addEventListener("change", ev => {
  if (ev.target.id === "filefatura"){
    const arq = ev.target.files;
    if (arq && arq.length) lerArquivos(arq);
    ev.target.value = "";
    return;
  }
  if (ev.target.id === "filein"){
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try {
      const d = JSON.parse(r.result);
      if (!d.pessoas || !d.faturas) throw 0;
      const temaAtual = S.tema;
      S = d; S.regrasCat = S.regrasCat||{}; S.cats = (d.cats&&d.cats.length)?d.cats:DEFAULT_CATS.slice();
      if (!S.tema) S.tema = temaAtual;
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if(!l.cat) l.cat = categorizar(l.g);
        if(!S.cats.includes(l.cat)) S.cats.push(l.cat); }));
      salvar(); render(); alert("Backup restaurado.");
    } catch(e){ alert("Esse arquivo não é um backup válido."); } };
    return r.readAsText(file);
  }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  switch(act){
    case "cartao": {
      S.cartaoAtivo = el.value;
      const rs = rotulos();
      if (!rs.includes(S.rotuloAtivo)) S.rotuloAtivo = rs[0]||"";
      UI.aberto=null; salvar(); window.scrollTo(0,0); return render();
    }
    case "rotulo": S.rotuloAtivo = el.value; UI.aberto=null; salvar(); window.scrollTo(0,0); return render();
    case "vcescopo": UI.tmp.escopo = el.value; return render();
    case "mmMes": UI.tmp.mes = +el.value; return render();
    case "mmAno": UI.tmp.ano = +el.value; return render();
    case "sopend": UI.soPend = el.checked; return render();
    case "ordem": UI.ordem = el.value; return render();
    case "cat": return mudarCategoria(el.dataset.g, el.value);
    case "cfcat": UI.tmp.f.cat = el.value; return render();
    case "pagador": { const c=S.cartoes.find(x=>x.id===i); if(c) c.pagador=el.value; salvar(); return render(); }
    case "renome": { const p=pessoa(i); if(p&&el.value.trim()) p.nome=el.value.trim(); salvar(); return render(); }
    case "fechamento": case "vencimento": {
      const c = S.cartoes.find(x=>x.id===i); if (!c) return;
      const v = parseInt(el.value,10);
      c[act] = (v>=1 && v<=31) ? v : null;
      if (act==="fechamento" && c.fechamento){
        const comp = compAtual(c);
        if (!S.faturas.some(f=>f.cartaoId===c.id && f.comp===comp)) garantirFatura(c.id, comp);
      }
      salvar(); return render();
    }
    case "renomecat": {
      const novo = el.value.trim(); if (!novo || novo === i) return;
      if (S.cats.includes(novo)) { el.value = i; return alert("Já existe uma categoria com esse nome."); }
      S.cats = S.cats.map(c => c===i ? novo : c);
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if (l.cat===i) l.cat = novo; }));
      Object.keys(S.regrasCat).forEach(k=>{ if (S.regrasCat[k]===i) S.regrasCat[k] = novo; });
      salvar(); return render();
    }
    case "renomec": { const c=S.cartoes.find(x=>x.id===i); if(c&&el.value.trim()) c.nome=el.value.trim(); salvar(); return render(); }
    case "xsel": { const t=UI.tmp; t.sel = el.checked ? [...new Set([...t.sel,i])] : t.sel.filter(x=>x!==i); return; }
    case "xpend": UI.tmp.pend = el.checked; return;
    case "xcontas": UI.tmp.contas = el.checked; return;
    case "xescopo": UI.tmp.escopo = el.value; return;
    case "xrelp": UI.tmp.relp = el.value; return;
    case "nfcartao": UI.tmp.cartao = el.value; return;
    case "orfonte": UI.tmp.fonte = el.value; return render();
    case "cf": UI.tmp.f[el.dataset.k] = el.value; return render();
    case "acq": UI.tmp.quando = el.value; return;
  }
});

  if (a === "catq"){ UI.tmp = UI.tmp||{}; UI.tmp.q = el.value; render(); return; }
  if (a === "imptxt"){ UI.tmp = UI.tmp||{}; UI.tmp.txt = el.value; return; }
  if (a === "nfrotulo"){ UI.tmp = UI.tmp||{}; UI.tmp.rotulo = el.value; return; }
  if (a === "pv"){ UI.tmp.prev[+el.dataset.i][el.dataset.k] = el.value; return; }
  if (a === "orf"){ UI.tmp.f.total = el.value; previa("previaOrc", el.value); return; }
  if (a === "orlim"){ UI.tmp.f.limites[el.dataset.c] = el.value; return; }
  if (a === "orq"){ UI.tmp.q = el.value; render(); return; }
  if (a === "elf"){
    UI.tmp.f[el.dataset.k] = el.value;
    if (el.dataset.k === "valor") previa("previaLanc", el.value);
    return;
  }
  if (a === "cf"){
    UI.tmp.f[el.dataset.k] = el.value;
    if (el.dataset.k === "valor") previa("previaValor", el.value);
    return;
  }
  if (a === "ecq"){ UI.tmp.q = el.value; render(); return; }
  if (a === "pgv"){ UI.tmp.valor = el.value; previa("previaPago", el.value); return; }
  if (a === "acv"){ UI.tmp.valor = el.value; previa("previaAcerto", el.value); return; }
  if (a === "acq"){ UI.tmp.quando = el.value; return; }
  if (a === "pgq"){ UI.tmp.quando = el.value; return; }
});

document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const el = ev.target.closest("[data-act='bufnome']"); if (!el) return;
  ev.preventDefault();
  if (UI.editando){ renomearGrupo(UI.editando, UI.buffer); UI.editando = null; }
  else if (UI.editandoItem){ renomearItem(UI.editandoItem, UI.buffer); UI.editandoItem = null; }
  render();
});

/* ============================================================
   v4 — atalhos de teclado (só no layout de PC)
   Trabalha direto no DOM: não muda o pipeline de render.
   ============================================================ */
let SEL = -1;
const itensNaTela = () => Array.from(document.querySelectorAll("#app .it"));
function pintarSel(){
  const its = itensNaTela();
  its.forEach(el => el.removeAttribute("data-sel"));
  if (SEL >= 0 && its[SEL]){
    its[SEL].setAttribute("data-sel","1");
    its[SEL].scrollIntoView({block:"nearest"});
  }
}
const _render = render;
render = function(){ _render(); if (SEL >= 0) pintarSel(); };

document.addEventListener("keydown", e => {
  if (window.innerWidth < 1024) return;
  const alvo = e.target;
  const digitando = alvo && /^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName || "");
  if (e.key === "Escape"){
    if (UI.rel){ fecharRelatorio(); render(); }
    else if (UI.sheet){ UI.sheet = null; render(); }
    else if (digitando) alvo.blur();
    return;
  }
  if (digitando || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/"){
    const b = document.querySelector("#app .srch input, #app input[type='search']");
    if (b){ e.preventDefault(); b.focus(); }
    return;
  }
  const its = itensNaTela();
  if (e.key === "j" || e.key === "J" || e.key === "ArrowDown"){
    if (!its.length) return;
    e.preventDefault(); SEL = Math.min(its.length - 1, SEL + 1); pintarSel(); return;
  }
  if (e.key === "k" || e.key === "K" || e.key === "ArrowUp"){
    if (!its.length) return;
    e.preventDefault(); SEL = SEL < 0 ? 0 : Math.max(0, SEL - 1); pintarSel(); return;
  }
  if (SEL < 0 || !its[SEL]) return;
  if (e.key === "e" || e.key === "E"){
    const b = its[SEL].querySelector("[data-act='abrirlanc']");
    if (b){ e.preventDefault(); b.click(); }
    return;
  }
  if (/^[1-9]$/.test(e.key)){
    const b = its[SEL].querySelectorAll(".mini button")[parseInt(e.key,10) - 1];
    if (b){ e.preventDefault(); b.click(); }
  }
});

document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_REL + "</style>");
migrar();
aplicarTema();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => { if (!S.tema || S.tema==="auto") aplicarTema(); });
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
