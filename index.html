<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Divisor de Fatura</title>
<style>
:root{
  --paper:#EBEDF1; --card:#fff; --ink:#14161C; --mute:#6B6F79; --line:#D8DBE2; --pend:#C4C8D1;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.num{font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;font-size:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6A34C9;outline-offset:2px}

/* ---------- cabeçalho ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.hdtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:700;color:#9BA1AE;text-transform:uppercase}
.hd select{background:#262A33;color:#fff;border:1px solid #3A3F4B;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;max-width:58%}
.sml{font-size:14px;color:#A7ACB8}
.big{font-size:44px;font-weight:700;line-height:1.02;letter-spacing:-.03em;margin:3px 0 0}
.bar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:#3A3E48;margin-top:14px}
.bar>span{transition:width .3s cubic-bezier(.4,0,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:13px;color:#A7ACB8}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
.status{margin-top:10px;font-size:13px}

/* ---------- filtros ---------- */
.fscroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.fchip[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.body{padding:12px 12px 0}
.tog{display:flex;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:12px}
.tog button{flex:1;border:0;background:transparent;padding:12px 2px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute)}
.tog button[data-on="1"]{background:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--mute);margin-bottom:14px;padding:4px 2px}
.check input{width:22px;height:22px;margin:0;accent-color:#6A34C9}

/* ---------- linhas ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:9px}
.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm{font-weight:600;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;color:inherit;width:100%}
.val{font-weight:700;font-size:18px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.lnk{border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--mute);font-weight:600}
.tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:#E7E9ED;color:var(--mute);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:14px 10px;font-size:15px;font-weight:600;color:var(--mute);flex:1 1 0;min-width:82px;min-height:50px}
.chip[data-on="1"]{color:#fff}
.editwrap{display:flex;gap:8px;align-items:center}
.editwrap input{flex:1;font-size:17px;font-weight:600;padding:10px;border:2px solid #6A34C9;border-radius:10px}
.ok{background:#6A34C9;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}

.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.catsel{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.catsel span{font-size:13px;color:var(--mute);font-weight:600;flex:0 0 auto}
.catsel select{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .t{flex:1;min-width:0}
.it .t button{display:block;font-size:15px;font-weight:500;background:none;border:0;padding:0;text-align:left;color:inherit;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t i{font-style:normal;font-size:12.5px;color:var(--mute)}
.mini{display:flex;gap:5px;flex-shrink:0}
.mini button{min-width:46px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--mute);font-size:12px;font-weight:700;padding:0 4px;overflow:hidden}
.mini button[data-on="1"]{color:#fff}

/* ---------- rodapé ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:12px calc(12px) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.foot button{flex:1;border-radius:13px;padding:17px 6px;font-size:16px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.foot button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}

h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;font-weight:700}
h2:first-child{margin-top:6px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:14px}
.btn{width:100%;padding:17px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:600;margin-top:10px;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dgr{color:#B0234A;border-color:#F0C9D3}
.mini2{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--mute)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,17,22,.6);display:flex;align-items:flex-end}
.sheetbox{background:var(--paper);width:100%;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.sheetbox h3{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}
.warn{background:#FFF4D6;border:1px solid #E8CE86;border-radius:12px;padding:13px;font-size:14px;margin-bottom:12px;white-space:pre-wrap}
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:78px 1fr 92px 58px 40px;gap:6px;align-items:center}
.pv input{padding:9px;font-size:14px;border-radius:8px}
.empty{text-align:center;color:var(--mute);font-size:15px;padding:44px 18px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
"use strict";
const SEED = [];

/* ================= armazenamento ================= */
let MEM = null, AVISO_STORAGE = "";
const DB = {
  read(){
    if (MEM) return MEM;
    try { const s = localStorage.getItem("divisor:v1"); return s ? JSON.parse(s) : null; }
    catch(e){ AVISO_STORAGE = "Este navegador bloqueou o armazenamento. Instale o app para que as marcações fiquem salvas."; return MEM; }
  },
  write(s){
    MEM = s;
    try { localStorage.setItem("divisor:v1", JSON.stringify(s)); }
    catch(e){ AVISO_STORAGE = "Não consegui salvar no aparelho. Use Configurar › Backup."; }
  }
};

/* ================= categorias ================= */
const DEFAULT_CATS = ["Alimentação/bebidas","Mercado","Saúde","Cuidados pessoais","Transporte",
  "Boletos","Streamings","Assinaturas","Compras online","Entretenimento","Lazer","Pets",
  "Pix parcelado","Presentes","Taxas","Outros"];

const semAcento = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const REGRAS_CAT = [
  [/caesb|\bceb\b|neoenergia|flexpag|neobsb|picpay credi|boleto|iptu|ipva|condominio/i, "Boletos"],
  [/\bsky\b|netflix|spotify|disney|prime canais|amazon music|globoplay|\bhbo\b|paramount|deezer|youtube premium|telecine/i, "Streamings"],
  [/picpay|\bpix\b/i, "Pix parcelado"],
  [/petz|pet ?supermark|gold ?dog|petcare|veterinar|racao/i, "Pets"],
  [/drogar|drogasil|rd ?saude|rdsaude|farmac|plano de saude|life plano|clinic|consulta|exame|laborator|hospital|dentist|psicolog/i, "Saúde"],
  [/esmalteria|que beleza|wow ?fio|wowfio|salao|cabelo|barbear|manicure|depilac|estetica|spa\b/i, "Cuidados pessoais"],
  [/auto posto|posto |estacionamento|sem parar|uber|99 ?pop|combust|gasolina|taxi|metro|onibus|pedagio/i, "Transporte"],
  [/ingresso|ticket|entretenimento|cinema|show|teatro|estadio|futebol|\btks\b/i, "Entretenimento"],
  [/hotel|pousada|decolar|airbnb|booking|resort|viagem|bar da|\bbar\b|vale da lua|balneario|parque/i, "Lazer"],
  [/microsoft|google|gamma|anthropic|claude|eduzz|escola do|as manhas|openai|adobe|canva|notion|figma|ifood club|icloud|dropbox/i, "Assinaturas"],
  [/amazon|shopee|centauro|nike|trussardi|zerezes|mercado ?livre|magalu|aliexpress|shein|renner|riachuelo|fotop|asaas/i, "Compras online"],
  [/^iof|iof |juros|anuidade|tarifa|multa|encargo|fapetec|inscricao|taxa/i, "Taxas"],
  [/superquadra|baratao|viva convenien|supermerc|hortifruti|acougue|quitanda|atacad|mercado/i, "Mercado"],
  [/ifd|ifood|restaurant|pizza|massa|padaria|panificad|lanch|burger|mc ?donald|arcos dourados|subway|estrogonof|parmegiana|potiguar|capelletto|cozin|china|foods|dona |giu medeiros|marice|panelinhas|pamonha|sandri|aricine|\bdvf\b|cb lago|ls dias|jnrt|unique|rozostolato|g cnb|cantina|vinny|fatima|jonatan|casa do|balcao|cafe|doceria|sorvet|hot m|comercio|conveni/i, "Alimentação/bebidas"],
];

function categorizar(nome){
  const n = semAcento(nome);
  for (const [re, cat] of REGRAS_CAT) if (re.test(n)) return cat;
  return "Outros";
}

/* ================= estado ================= */
const CORES = ["#6A34C9","#0A7568","#AC5F08","#B0234A","#1E5FB4","#4E7A0C","#8A3FA0","#0F6E8C"];
const CORESBG = ["#EFE8FC","#DDF1ED","#FBEDDB","#FCE6EB","#E5EEFB","#ECF3E0","#F7E9FB","#E2EFF5"];
const uid = p => p + Math.random().toString(36).slice(2,8);

function inicial(){
  return {
    pessoas:[{id:"p1",nome:"Eu",cor:0},{id:"p2",nome:"Ele",cor:1}], euId:"p1",
    cartoes:[{id:"c1",nome:"Personnalité",pagador:"p2"}],
    faturas:[{id:"f1",cartaoId:"c1",rotulo:"Julho/26",lanc:SEED.map((x,i)=>({id:"s"+i,d:x.d,r:x.r,g:x.g,v:x.v,p:x.p||null}))}],
    regras:{}, regrasCat:{}, aloc:{}, ativa:"f1", cats:DEFAULT_CATS.slice(), catv:2
  };
}
let S = DB.read() || inicial();

/* migração: garante campos novos sem perder nada do que já existe */
(function migrar(){
  S.regrasCat = S.regrasCat || {};
  S.regras = S.regras || {};
  S.aloc = S.aloc || {};
  if (!S.cats || !S.cats.length) S.cats = DEFAULT_CATS.slice();
  let mudou = false;
  // taxonomia nova: recategoriza tudo, menos o que foi ajustado à mão
  if (S.catv !== 2){
    (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
      l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||""));
    }));
    S.catv = 2; mudou = true;
  }
  (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
    if (!l.cat){ l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||"")); mudou = true; }
    if (!S.cats.includes(l.cat)){ S.cats.push(l.cat); mudou = true; }
  }));
  if (mudou || !DB.read()) DB.write(S);
})();

let UI = {view:"lista", modo:"grupo", soPend:false, filtroP:null, aberto:null,
          sheet:null, tmp:null, editando:null, editandoItem:null, buffer:""};

/* ================= utilidades ================= */
const brl = n => (n<0?"−R$ ":"R$ ") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dia = s => /^\d{4}-/.test(s) ? s.slice(8,10)+"/"+s.slice(5,7) : s;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pessoa = id => S.pessoas.find(p=>p.id===id);
const fatura = () => S.faturas.find(f=>f.id===S.ativa) || S.faturas[0];
const cartaoDe = f => S.cartoes.find(c=>c.id===f.cartaoId) || S.cartoes[0];
const alocDe = id => S.aloc[id] || [];
const salvar = () => DB.write(S);
const curto = n => n.length>6 ? n.slice(0,5)+"." : n;

function totais(f){
  const t = {porPessoa:{}, total:0, pend:0, nPend:0};
  S.pessoas.forEach(p=>t.porPessoa[p.id]=0);
  (f?f.lanc:[]).forEach(l=>{
    t.total += l.v;
    const a = alocDe(l.id).filter(id=>pessoa(id));
    if (!a.length){ t.pend += l.v; t.nPend++; return; }
    a.forEach(id => t.porPessoa[id] += l.v/a.length);
  });
  return t;
}
function visiveis(){
  const f = fatura(); if (!f) return [];
  let L = f.lanc;
  if (UI.filtroP === "sem") L = L.filter(l=>!alocDe(l.id).length);
  else if (UI.filtroP) L = L.filter(l=>alocDe(l.id).includes(UI.filtroP));
  if (UI.soPend) L = L.filter(l=>!alocDe(l.id).length);
  return L;
}

/* ================= alocação ================= */
function togglePessoa(ids, pid, chaveRegra){
  const ligar = ids.some(id=>!alocDe(id).includes(pid));
  ids.forEach(id=>{
    const a = new Set(alocDe(id));
    if (ligar) a.add(pid); else a.delete(pid);
    const arr = [...a];
    if (arr.length) S.aloc[id] = arr; else delete S.aloc[id];
  });
  if (chaveRegra){
    const a = alocDe(ids[0]);
    if (a.length) S.regras[chaveRegra] = a; else delete S.regras[chaveRegra];
  }
  salvar(); render();
}

/* ================= renomear ================= */
function renomearGrupo(velho, novo){
  novo = (novo||"").trim();
  if (!novo || novo === velho) return;
  const f = fatura();
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === velho) l.g = novo; }));
  if (S.regras[velho]){ S.regras[novo] = S.regras[velho]; delete S.regras[velho]; }
  if (S.regrasCat[velho]){ S.regrasCat[novo] = S.regrasCat[velho]; delete S.regrasCat[velho]; }
  if (UI.aberto === velho) UI.aberto = novo;
  salvar();
}
function renomearItem(id, novo){
  novo = (novo||"").trim(); if (!novo) return;
  const f = fatura();
  const l = f.lanc.find(x=>x.id===id);
  if (!l) return;
  l.g = novo;
  if (S.regrasCat[novo]) l.cat = S.regrasCat[novo];
  salvar();
}
function mudarCategoria(grupo, cat){
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === grupo) l.cat = cat; }));
  S.regrasCat[grupo] = cat;
  salvar(); render();
}

/* ================= render ================= */
function render(){
  const y = window.scrollY;
  document.getElementById("app").innerHTML = UI.view==="config" ? viewConfig() : viewLista();
  document.getElementById("modal").innerHTML = UI.sheet ? sheets[UI.sheet]() : "";
  document.body.style.overflow = UI.sheet ? "hidden" : "";
  window.scrollTo(0,y);
  const inp = document.querySelector("[data-foco]");
  if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function header(){
  const f = fatura();
  if (!f) return `<div class="hd"><div class="eyebrow">Divisor de fatura</div><div class="sml" style="margin-top:10px">Nenhuma fatura cadastrada.</div></div>`;
  const c = cartaoDe(f), t = totais(f), pag = pessoa(c.pagador), eu = pessoa(S.euId);
  let titulo, valor;
  if (pag && eu && pag.id !== eu.id){ titulo = "Você transfere para " + pag.nome; valor = t.porPessoa[eu.id] || 0; }
  else { titulo = "Você tem a receber";
         valor = S.pessoas.filter(p=>!pag||p.id!==pag.id).reduce((a,p)=>a+(t.porPessoa[p.id]||0),0); }
  const larg = v => t.total ? Math.max(0, Math.abs(v)/Math.abs(t.total)*100) : 0;
  return `<div class="hd">
    <div class="hdtop">
      <div class="eyebrow">${esc(c?c.nome:"")}</div>
      <select data-act="fatura">${S.faturas.map(x=>`<option value="${x.id}"${x.id===f.id?" selected":""}>${esc(x.rotulo)}</option>`).join("")}</select>
    </div>
    <div class="sml" style="margin-top:11px">${esc(titulo)}</div>
    <div class="big num">${brl(valor)}</div>
    <div class="bar">${S.pessoas.map(p=>`<span style="width:${larg(t.porPessoa[p.id])}%;background:${CORES[p.cor%8]}"></span>`).join("")}</div>
    <div class="legend">${S.pessoas.map(p=>`<span><i class="dot" style="background:${CORES[p.cor%8]}"></i>${esc(p.nome)} <b class="num">${brl(t.porPessoa[p.id]||0)}</b></span>`).join("")}</div>
    <div class="status" style="color:${t.nPend?"#FFC46B":"#7FE0C6"}">
      ${t.nPend ? t.nPend+" sem dono · fatura "+brl(t.total) : "Tudo classificado · fatura "+brl(t.total)}
    </div>
  </div>`;
}

function filtroPessoas(){
  const op = [{k:null,n:"Todos"}, ...S.pessoas.map(p=>({k:p.id,n:p.nome,c:CORES[p.cor%8]})), {k:"sem",n:"Sem dono"}];
  return `<div class="fscroll">${op.map(o=>{
    const on = UI.filtroP === o.k;
    return `<button class="fchip" data-on="${on?1:0}" data-act="filtroP" data-v="${o.k==null?"":o.k}"
      style="${on&&o.c?`background:${o.c};border-color:${o.c}`:""}">${o.c?`<i class="dot" style="background:${on?"#fff":o.c}"></i>`:""}${esc(o.n)}</button>`;
  }).join("")}</div>`;
}

function chipsHTML(aloc, attrs){
  return `<div class="chips">${S.pessoas.map(p=>{
    const on = aloc.includes(p.id);
    return `<button class="chip" data-on="${on?1:0}" ${attrs(p.id)}
      style="${on?`background:${CORES[p.cor%8]};border-color:${CORES[p.cor%8]}`:""}">${esc(p.nome)}</button>`;
  }).join("")}</div>`;
}

function agrupar(L, chave){
  const m = {};
  L.forEach(l=>{ const k = chave(l); (m[k] = m[k] || {k, itens:[], total:0}); m[k].itens.push(l); m[k].total += l.v; });
  return Object.values(m).map(g=>{
    const set = new Set(g.itens.map(i=>JSON.stringify([...alocDe(i.id)].sort())));
    g.misto = set.size > 1;
    g.aloc = g.misto ? [] : alocDe(g.itens[0].id);
    return g;
  }).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
}

function cardGrupo(g, tipo){
  const cor = g.aloc.length===1 ? CORES[pessoa(g.aloc[0]).cor%8] : null;
  const bg  = g.aloc.length===1 ? CORESBG[pessoa(g.aloc[0]).cor%8] : null;
  const exp = UI.aberto === g.k;
  const editando = UI.editando === g.k && tipo === "grupo";
  const cat = tipo === "grupo" ? (g.itens[0].cat || "Outros") : null;

/* ================= leitor ================= */
const MESES = {janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const RUIDO = /^(cart[aã]o virtual adicional|carteiras digitais adicional|adicional|image labels.*|[<>»«\-–—]+)$/i;
const RE_VAL = /(-|−)?\s*R\$\s*([\d.]+,\d{2})/;
const RE_PARC1 = /parcela\s+(\d+)\s+de\s+(\d+)/i;
const RE_PARC2 = /(\d{2})\s*\/\s*(\d{2})\s*$/;
const num = s => parseFloat(String(s).replace(/\./g,"").replace(",","."));
const parcNoNome = s => { const m = s.match(RE_PARC2); return m ? +m[1]+"/"+ +m[2] : ""; };
const limpaNome = s => s.replace(RE_PARC2,"").replace(/[>›»<‹«]/g,"").replace(/\s{2,}/g," ").trim();

function lerColado(txt){
  const linhas = txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s && !RUIDO.test(s));
  if (linhas.filter(l=>/[|;]/.test(l)).length > linhas.length*0.5){
    return linhas.map(l=>{
      const c = l.split(/[|;]/).map(s=>s.trim());
      return {d:c[0]||"", g:c[1]||"", v:(c[2]||"").replace(/R\$\s*/,""), p:c[3]||""};
    }).filter(x=>x.g);
  }
  let dataAtual = ""; const nomes = [], valores = [];
  for (const l of linhas){
    let m = l.match(/^(\d{1,2})\s+de\s+([a-zç]+)/i);
    if (m && MESES[m[2].toLowerCase()]){ dataAtual = String(m[1]).padStart(2,"0")+"/"+String(MESES[m[2].toLowerCase()]).padStart(2,"0"); continue; }
    m = l.match(/^(\d{1,2})\/(\d{1,2})(\/\d{2,4})?$/);
    if (m){ dataAtual = m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"); continue; }
    const v = l.match(RE_VAL);
    const resto = v ? l.replace(RE_VAL,"").replace(RE_PARC1,"").replace(/[>›»]/g,"").trim() : "";
    const pm = l.match(RE_PARC1);
    if (v && resto.length > 2){
      nomes.push({d:dataAtual, g:limpaNome(resto), p:pm?pm[1]+"/"+pm[2]:parcNoNome(resto)});
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else if (v){
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else {
      if (pm && valores.length){ valores[valores.length-1].p = pm[1]+"/"+pm[2]; continue; }
      nomes.push({d:dataAtual, g:limpaNome(l), p:parcNoNome(l)});
    }
  }
  return nomes.map((n,i)=>({d:n.d, g:n.g, v:valores[i]?valores[i].v:"", p:n.p || (valores[i]?valores[i].p:"") || ""}));
}

/* ================= exportação ================= */
function linhasExport(t){
  const fs = t.escopo==="todas" ? S.faturas : [fatura()].filter(Boolean);
  const out = [];
  fs.forEach(f=>{
    const c = cartaoDe(f);
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id));
      if (!a.length){
        if (t.pend) out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:1,quem:"(sem dono)",val:l.v});
        return;
      }
      a.forEach(id=>{ if (t.sel.includes(id))
        out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:a.length,quem:pessoa(id).nome,val:l.v/a.length}); });
    });
  });
  return out;
}
const CAB = ["fatura","cartao","data","estabelecimento","categoria","parcela","valor_total","dividido_entre","pessoa","valor_da_pessoa"];
const campos = o => [o.f,o.c,o.d,o.g,o.cat,o.p,o.tot.toFixed(2).replace(".",","),o.div,o.quem,o.val.toFixed(2).replace(".",",")];

function gerarCSV(t){
  return "\uFEFF" + CAB.join(";") + "\n" +
    linhasExport(t).map(o=>campos(o).map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");
}
function gerarTSV(t){
  return CAB.join("\t") + "\n" + linhasExport(t).map(o=>campos(o).join("\t")).join("\n");
}
function gerarTexto(t){
  const L = linhasExport(t), out = [];
  out.push(t.escopo==="todas" ? "Todas as faturas" : fatura().rotulo, "");
  [...new Set(L.map(o=>o.quem))].forEach(nome=>{
    const meus = L.filter(o=>o.quem===nome), porCat = {};
    meus.forEach(o=>{ porCat[o.cat] = (porCat[o.cat]||0) + o.val; });
    out.push(nome.toUpperCase());
    Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([c,v])=>out.push("  "+c+" — "+brl(v)));
    out.push("  total: " + brl(meus.reduce((a,o)=>a+o.val,0)), "");
  });
  const f = fatura(), c = f?cartaoDe(f):null, pag = c?pessoa(c.pagador):null;
  if (pag && t.escopo==="atual"){
    const tt = totais(f);
    out.push("Fatura: " + brl(tt.total));
    S.pessoas.filter(p=>p.id!==pag.id).forEach(p=>out.push(p.nome+" transfere para "+pag.nome+": "+brl(tt.porPessoa[p.id]||0)));
  }
  return out.join("\n");
}
function nomeArquivo(t, ext){
  const base = t.escopo==="todas" ? "todas" : (fatura().rotulo.replace(/\W+/g,"-").toLowerCase());
  return "gastos-" + base + "." + ext;
}
function baixar(nome, conteudo, tipo){
  const u = URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 800);
}
async function copiar(txt, msg){
  try { await navigator.clipboard.writeText(txt); alert(msg); }
  catch(e){ prompt("Copie o conteúdo:", txt); }
}

document.addEventListener("click", ev => {
  const box = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, i = el.dataset.i, v = el.dataset.v, pid = el.dataset.p, g = el.dataset.g;
  if (act === "fechar"){ UI.sheet = null; UI.tmp = null; return render(); }

  switch(act){
    case "ir": UI.view = v; UI.editando = UI.editandoItem = null; window.scrollTo(0,0); return render();
    case "sheet": UI.sheet = v; UI.tmp = null; return render();
    case "modo": UI.modo = v; UI.aberto = null; UI.editando = null; return render();
    case "filtroP": UI.filtroP = v || null; window.scrollTo(0,0); return render();
    case "exp": UI.aberto = (UI.aberto === g) ? null : g; return render();

    case "editar": UI.editando = g; UI.buffer = g; return render();
    case "salvarnome": renomearGrupo(g, UI.buffer); UI.editando = null; return render();
    case "editaritem": UI.editandoItem = i; UI.buffer = ""; return render();
    case "salvaritem": renomearItem(i, UI.buffer); UI.editandoItem = null; return render();

    case "tg": {
      const L = visiveis();
      const ids = (el.dataset.tipo === "cat")
        ? L.filter(l=>(l.cat||"Outros")===g).map(l=>l.id)
        : L.filter(l=>l.g===g).map(l=>l.id);
      return togglePessoa(ids, pid, el.dataset.tipo === "cat" ? null : g);
    }
    case "tgi": return togglePessoa([i], pid, null);

    case "addp": { const n = prompt("Nome da pessoa:"); if (!n) return;
      S.pessoas.push({id:uid("p"),nome:n.trim(),cor:S.pessoas.length}); salvar(); return render(); }
    case "delp": {
      if (!confirm("Remover essa pessoa? As atribuições dela serão desfeitas.")) return;
      S.pessoas = S.pessoas.filter(p=>p.id!==i);
      Object.keys(S.aloc).forEach(k=>{ S.aloc[k]=S.aloc[k].filter(x=>x!==i); if(!S.aloc[k].length) delete S.aloc[k]; });
      Object.keys(S.regras).forEach(k=>{ S.regras[k]=S.regras[k].filter(x=>x!==i); if(!S.regras[k].length) delete S.regras[k]; });
      S.cartoes.forEach(c=>{ if(c.pagador===i) c.pagador=S.pessoas[0].id; });
      if (S.euId===i) S.euId = S.pessoas[0].id;
      if (UI.filtroP===i) UI.filtroP = null;
      salvar(); return render();
    }
    case "soueu": S.euId = i; salvar(); return render();
    case "addc": { const n = prompt("Nome do cartão:"); if (!n) return;
      S.cartoes.push({id:uid("c"),nome:n.trim(),pagador:S.pessoas[0].id}); salvar(); return render(); }
    case "abrir": S.ativa = i; UI.view="lista"; salvar(); window.scrollTo(0,0); return render();
    case "delf": {
      if (!confirm("Apagar essa fatura e seus lançamentos?")) return;
      const f = S.faturas.find(x=>x.id===i);
      if (f) f.lanc.forEach(l=>delete S.aloc[l.id]);
      S.faturas = S.faturas.filter(x=>x.id!==i);
      if (S.ativa===i) S.ativa = S.faturas[0]?S.faturas[0].id:null;
      salvar(); return render();
    }
    case "addcat": {
      const n = prompt("Nome da categoria:"); if (!n || !n.trim()) return;
      const nome = n.trim();
      if (S.cats.includes(nome)) return alert("Essa categoria já existe.");
      S.cats.push(nome); salvar(); return render();
    }
    case "delcat": {
      const n = S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.cat===i).length,0);
      if (!confirm(n ? `Apagar "${i}"? Os ${n} lançamentos vão para Outros.` : `Apagar "${i}"?`)) return;
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if (l.cat===i) l.cat = "Outros"; }));
      Object.keys(S.regrasCat).forEach(k=>{ if (S.regrasCat[k]===i) delete S.regrasCat[k]; });
      S.cats = S.cats.filter(c=>c!==i);
      if (!S.cats.includes("Outros")) S.cats.push("Outros");
      salvar(); return render();
    }
    case "limparRegras":
      if (!confirm("Apagar todas as regras de dono e categoria?")) return;
      S.regras = {}; S.regrasCat = {}; salvar(); return render();
    case "backup": baixar("divisor-backup-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S), "application/json"); return;
    case "restaurar": return document.getElementById("filein").click();

    case "nfcriar": {
      const t = UI.tmp || {};
      const nova = {id:uid("f"), cartaoId:t.cartao||S.cartoes[0].id, rotulo:(t.rotulo||"").trim()||"Nova fatura", lanc:[]};
      S.faturas.unshift(nova); S.ativa = nova.id; salvar();
      UI.sheet = "importar"; UI.tmp = null; return render();
    }
    case "impler": {
      const prev = lerColado((UI.tmp&&UI.tmp.txt)||"");
      if (!prev.length) return alert("Não identifiquei lançamentos nesse texto.");
      UI.tmp.prev = prev; return render();
    }
    case "impvoltar": UI.tmp.prev = null; return render();
    case "pvdel": UI.tmp.prev.splice(+i,1); return render();
    case "impconfirma": {
      const f = fatura(); let n = 0;
      UI.tmp.prev.forEach(x=>{
        const val = num(String(x.v).replace(/[R$\s]/g,""));
        if (!x.g || isNaN(val)) return;
        const id = uid("l");
        f.lanc.push({id, d:x.d||"", r:x.g, g:x.g, v:val, p:(x.p||"").trim()||null,
                     cat:S.regrasCat[x.g] || categorizar(x.g)});
        if (S.regras[x.g]) S.aloc[id] = S.regras[x.g].slice();
        n++;
      });
      salvar(); UI.sheet=null; UI.tmp=null; UI.view="lista"; window.scrollTo(0,0); render();
      return alert(n + " lançamentos importados.");
    }

    case "xcsv": { const t=UI.tmp; if(!valida(t))return; baixar(nomeArquivo(t,"csv"), gerarCSV(t), "text/csv;charset=utf-8"); UI.sheet=null; return render(); }
    case "xsheets": { const t=UI.tmp; if(!valida(t))return;
      return copiar(gerarTSV(t), "Copiado. Abra o Google Sheets, toque numa célula e cole — vai separar em colunas sozinho."); }
    case "xtexto": { const t=UI.tmp; if(!valida(t))return; return copiar(gerarTexto(t), "Resumo copiado."); }
    case "xshare": {
      const t = UI.tmp; if (!valida(t)) return;
      const nome = nomeArquivo(t,"csv");
      const file = new File([gerarCSV(t)], nome, {type:"text/csv"});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:nome})
          .then(()=>{ UI.sheet=null; UI.tmp=null; render(); })
          .catch(()=>{});
      } else {
        baixar(nome, gerarCSV(t), "text/csv;charset=utf-8");
        alert("Este navegador não abre o compartilhamento. Baixei o arquivo — envie para o Drive pela pasta Downloads.");
      }
      return;
    }
  }
});
function valida(t){
  if (!t.sel.length && !t.pend){ alert("Escolha pelo menos uma pessoa."); return false; }
  return true;
}

document.addEventListener("change", ev => {
  if (ev.target.id === "filein"){
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try {
      const d = JSON.parse(r.result);
      if (!d.pessoas || !d.faturas) throw 0;
      S = d; S.regrasCat = S.regrasCat||{}; S.cats = (d.cats&&d.cats.length)?d.cats:DEFAULT_CATS.slice();
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if(!l.cat) l.cat = categorizar(l.g);
        if(!S.cats.includes(l.cat)) S.cats.push(l.cat); }));
      salvar(); render(); alert("Backup restaurado.");
    } catch(e){ alert("Esse arquivo não é um backup válido."); } };
    return r.readAsText(file);
  }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  switch(act){
    case "fatura": S.ativa = el.value; UI.aberto=null; salvar(); window.scrollTo(0,0); return render();
    case "sopend": UI.soPend = el.checked; return render();
    case "cat": return mudarCategoria(el.dataset.g, el.value);
    case "pagador": { const c=S.cartoes.find(x=>x.id===i); if(c) c.pagador=el.value; salvar(); return render(); }
    case "renome": { const p=pessoa(i); if(p&&el.value.trim()) p.nome=el.value.trim(); salvar(); return render(); }
    case "renomecat": {
      const novo = el.value.trim(); if (!novo || novo === i) return;
      if (S.cats.includes(novo)) { el.value = i; return alert("Já existe uma categoria com esse nome."); }
      S.cats = S.cats.map(c => c===i ? novo : c);
      S.faturas.forEach(f=>f.lanc.forEach(l=>{ if (l.cat===i) l.cat = novo; }));
      Object.keys(S.regrasCat).forEach(k=>{ if (S.regrasCat[k]===i) S.regrasCat[k] = novo; });
      salvar(); return render();
    }
    case "renomec": { const c=S.cartoes.find(x=>x.id===i); if(c&&el.value.trim()) c.nome=el.value.trim(); salvar(); return render(); }
    case "xsel": { const t=UI.tmp; t.sel = el.checked ? [...new Set([...t.sel,i])] : t.sel.filter(x=>x!==i); return; }
    case "xpend": UI.tmp.pend = el.checked; return;
    case "xescopo": UI.tmp.escopo = el.value; return;
    case "nfcartao": UI.tmp.cartao = el.value; return;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "bufnome"){ UI.buffer = el.value; return; }
  if (a === "imptxt"){ UI.tmp = UI.tmp||{}; UI.tmp.txt = el.value; return; }
  if (a === "nfrotulo"){ UI.tmp = UI.tmp||{}; UI.tmp.rotulo = el.value; return; }
  if (a === "pv"){ UI.tmp.prev[+el.dataset.i][el.dataset.k] = el.value; return; }
});

document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const el = ev.target.closest("[data-act='bufnome']"); if (!el) return;
  ev.preventDefault();
  if (UI.editando){ renomearGrupo(UI.editando, UI.buffer); UI.editando = null; }
  else if (UI.editandoItem){ renomearItem(UI.editandoItem, UI.buffer); UI.editandoItem = null; }
  render();
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
