<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Divisor de Fatura</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#F0F1F6; --card:#FFF; --ink:#15161C; --mute:#71757F; --line:#E5E7ED; --soft:#F5F6FA;
  --hero1:#6A34C9; --hero2:#3F1F8C; --heroink:#fff; --heromute:#C9C2EA;
  --r:22px; --r2:16px;
  --sh:0 1px 2px rgba(20,22,28,.04), 0 8px 24px -12px rgba(20,22,28,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#262624; --card:#30302E; --ink:#F2F0EA; --mute:#9C9A93; --line:#403F3B; --soft:#3A3A37;
         --sh:0 1px 2px rgba(0,0,0,.18), 0 8px 22px -14px rgba(0,0,0,.45); }
}
html[data-tema="claro"]{ --bg:#F0F1F6; --card:#FFF; --ink:#15161C; --mute:#71757F; --line:#E5E7ED; --soft:#F5F6FA;
  --sh:0 1px 2px rgba(20,22,28,.04), 0 8px 24px -12px rgba(20,22,28,.10); }
html[data-tema="escuro"]{ --bg:#0D0E13; --card:#181A21; --ink:#F1F2F6; --mute:#8B8F9A; --line:#262933; --soft:#20232C;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7); }
html[data-tema="quente"]{ --bg:#262624; --card:#30302E; --ink:#F2F0EA; --mute:#9C9A93; --line:#403F3B; --soft:#3A3A37;
  --sh:0 1px 2px rgba(0,0,0,.18), 0 8px 22px -14px rgba(0,0,0,.45); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.42;-webkit-text-size-adjust:100%;
  padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.disp,.big,.nm,h2,h3,.stat b,.badge,.tog button,.foot button,.btn{
  font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-optical-sizing:auto}
button{font-family:inherit;cursor:pointer;font-size:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hero1);outline-offset:2px}

/* ---------- topo ---------- */
.top{padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.selrow{display:flex;gap:8px}
.selrow select{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:99px;padding:12px 16px;font-size:14.5px;font-weight:600;box-shadow:var(--sh);
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}

/* ---------- cartão-herói ---------- */
.hero{margin:12px 14px 0;border-radius:var(--r);padding:20px 20px 18px;color:var(--heroink);
  background:radial-gradient(120% 130% at 88% 8%, #8B5CF6 0%, var(--hero1) 38%, var(--hero2) 100%);
  box-shadow:0 12px 30px -16px rgba(74,32,150,.6);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%)}
.hero .lbl{font-size:13px;color:var(--heromute);position:relative}
.hero .big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.045em;margin-top:5px;position:relative}
.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18);margin-top:15px;position:relative}
.bar>span{transition:width .35s cubic-bezier(.4,0,.2,1)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:13px;font-size:13.5px;color:var(--heromute);position:relative}
.legend span{display:flex;align-items:center;gap:7px;min-width:0}
.legend em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{color:#fff;font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 auto}
.acerto{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);font-size:13px;color:var(--heromute);position:relative}
.acerto div{margin-top:5px}
.acerto b{color:#fff}
.selos{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;position:relative}
.selo{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}

/* ---------- faixa de números ---------- */
.stats{display:flex;gap:9px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 15px;box-shadow:var(--sh);min-width:104px}
.stat b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.035em}
.stat i{font-style:normal;font-size:11.5px;color:var(--mute)}

/* ---------- filtros e abas ---------- */
.fscroll{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 15px;
  font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}
.fchip[data-on="1"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stick{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px 14px 8px;
  box-shadow:0 10px 12px -10px rgba(0,0,0,.10)}
.tog{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--sh)}
.tog button{flex:1;border:0;background:transparent;padding:11px 2px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--mute)}
.tog button[data-on="1"]{background:var(--ink);color:var(--bg)}
.check{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--mute);margin:12px 2px 14px;padding:0 2px}
.check input{width:21px;height:21px;margin:0;accent-color:var(--hero1)}

.body{padding:0 14px}
/* ---------- linhas ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:9px;box-shadow:var(--sh)}
.rowtop{display:flex;gap:12px;align-items:flex-start}
.badge{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em}
.nm{font-weight:600;font-size:16.5px;letter-spacing:-.025em;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;width:100%}
.val{font-weight:700;font-size:17px;white-space:nowrap;margin-left:auto}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.lnk{border:1px solid var(--line);background:var(--soft);padding:5px 11px;border-radius:99px;font-size:12px;color:var(--mute);font-weight:600}
.tag{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap;border:0}
.cardtag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.hero .cardtag{background:rgba(255,255,255,.14);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:99px;padding:12px 8px;font-size:14px;
  font-weight:600;color:var(--mute);flex:1 1 0;min-width:74px;min-height:46px}
.chip[data-on="1"]{color:#fff;border-color:transparent}
.editwrap{display:flex;gap:8px;align-items:center}
.editwrap input{flex:1;font-size:16px;font-weight:600;padding:11px;border:2px solid var(--hero1);border-radius:12px}
.ok{background:var(--hero1);color:#fff;border:0;border-radius:12px;padding:13px 17px;font-weight:700}

.sub{border-top:1px solid var(--line);margin-top:14px;padding-top:11px}
.catsel{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.catsel span{font-size:12.5px;color:var(--mute);font-weight:600;flex:0 0 auto}
.catsel select{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;background:var(--soft);color:var(--ink)}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it2{display:block}
.itop{display:flex;align-items:center;gap:10px}
.it .t{flex:1;min-width:0}
.it .t button{display:block;font-size:14.5px;font-weight:550;background:none;border:0;padding:0;text-align:left;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t i{font-style:normal;font-size:12px;color:var(--mute)}
.pin{width:28px;height:28px;border-radius:9px;flex:0 0 auto;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;
  font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
.catbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);
  border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600}
.catbtn i{width:13px;height:13px;border-radius:5px;display:inline-block}
.catopt{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.catopt+.catopt{border-top:1px solid var(--line)}
.catopt b{flex:1;font-size:15px;font-weight:600}
.mini{display:flex;gap:5px;flex-shrink:0}
.mini-full{margin-top:10px}
.mini button{min-width:46px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--soft);
  color:var(--mute);font-size:12px;font-weight:700;padding:0 4px;overflow:hidden}
.mini-full button{flex:1;min-width:0}
.mini button[data-on="1"]{color:#fff;border-color:transparent}
.pct{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;margin:11px 0 6px}
.pct>span{display:block;height:100%;background:var(--hero1);border-radius:99px}

/* ---------- barra de navegação ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:4px;
  background:color-mix(in srgb, var(--card) 88%, transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line)}
.navb{flex:1;border:0;background:transparent;border-radius:16px;padding:9px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:10.5px;font-weight:600}
.navb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navb[data-on="1"]{color:var(--ink);background:var(--soft)}
.navb[data-on="1"] svg{stroke-width:2.3}

/* ---------- orçamento ---------- */
.lim{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 0;text-align:left}
.lim+.lim{border-top:1px solid var(--line)}
.lim .t{flex:1;min-width:0}
.lim .t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;
  font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
.lim .t i{font-style:normal;font-size:12.5px;color:var(--mute)}
.lim .track{height:9px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden;position:relative}
.lim .track span{display:block;height:100%;border-radius:99px;transition:width .3s}
.lim .v{text-align:right;flex:0 0 auto}
.lim .v b{display:block;font-size:14.5px;font-weight:700;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.lim .v i{font-style:normal;font-size:11.5px}
.orow{display:grid;grid-template-columns:38px 1fr 108px;gap:10px;align-items:center;padding:9px 0}
.orow+.orow{border-top:1px solid var(--line)}
.orow .n{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .g{font-size:11.5px;color:var(--mute)}
.orow input{padding:10px;font-size:14.5px;border-radius:10px;text-align:right;background:var(--soft)}

/* ---------- contas ---------- */
.mesnav{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:5px;box-shadow:var(--sh)}
.mesnav button{border:0;background:var(--soft);border-radius:99px;width:40px;height:40px;font-size:18px;color:var(--mute)}
.mesnav .m{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.02em;
  font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
.conta{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 0;text-align:left}
.conta+.conta{border-top:1px solid var(--line)}
.conta .t{flex:1;min-width:0}
.conta .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25;
  font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
.conta .t i{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta .v{text-align:right;flex:0 0 auto}
.conta .v b{display:block;font-size:15.5px;font-weight:700;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mk{border:1.5px solid var(--line);background:var(--soft);border-radius:99px;width:34px;height:34px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute)}
.mk[data-pago="1"]{background:#0A8A6E;border-color:#0A8A6E;color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:7px}
.pg-vencida{background:#FDE4E4;color:#A32A3C} .pg-perto{background:#FDF0DC;color:#8A5A0C}
.pg-paga{background:#DCF0E9;color:#0A6B55}
html[data-tema="escuro"] .pg-vencida,html[data-tema="quente"] .pg-vencida{background:#4A2226;color:#FFB6BE}
html[data-tema="escuro"] .pg-perto,html[data-tema="quente"] .pg-perto{background:#463619;color:#F5CE86}
html[data-tema="escuro"] .pg-paga,html[data-tema="quente"] .pg-paga{background:#1E4038;color:#8FE0C6}
@media (prefers-color-scheme: dark){
  .pg-vencida{background:#4A2226;color:#FFB6BE} .pg-perto{background:#463619;color:#F5CE86}
  .pg-paga{background:#1E4038;color:#8FE0C6}
}

/* ---------- página inicial ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec h2{margin:0}
.sec button{border:0;background:none;font-size:13px;font-weight:600;color:var(--hero1)}
.cbar{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.cbar+.cbar{border-top:1px solid var(--line)}
.cbar .t{flex:1;min-width:0}
.cbar .t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cbar .track{height:7px;border-radius:99px;background:var(--soft);margin-top:7px;overflow:hidden}
.cbar .track span{display:block;height:100%;border-radius:99px}
.cbar .v{text-align:right;flex:0 0 auto}
.cbar .v b{display:block;font-size:14.5px;font-weight:700}
.cbar .v i{font-style:normal;font-size:11.5px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;box-shadow:var(--sh)}
.pcard .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mute)}
.pcard .v{font-size:19px;font-weight:700;letter-spacing:-.035em;margin-top:8px}
.pcard .p{font-size:11.5px;color:var(--mute);margin-top:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .m{flex:1;font-size:14.5px;font-weight:600}
.mrow .c{font-size:12px;color:var(--mute)}
.cta{display:flex;gap:9px;margin-top:16px}
.cta button{flex:1;border-radius:99px;padding:16px 8px;font-size:15px;font-weight:700;
  border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.cta button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}

h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;font-weight:700}
h2:first-child{margin-top:8px}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font-size:16px;
  font-family:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:14px}
.btn{width:100%;padding:16px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:15.5px;font-weight:650;margin-top:10px;box-shadow:var(--sh)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dgr{color:#D2475F;border-color:transparent;background:var(--soft);box-shadow:none}
.mini2{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--mute)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,9,13,.6);display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.sheetbox{background:var(--bg);width:100%;max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheetbox::before{content:"";display:block;width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheetbox h3{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.04em}
.warn{background:#FFF4D6;border:1px solid #E8CE86;color:#4A3A10;border-radius:14px;padding:13px;font-size:13.5px;margin-bottom:12px;white-space:pre-wrap}
@media (prefers-color-scheme: dark){ .warn{background:#3B3524;border-color:#5A5236;color:#EFE3BE} }
html[data-tema="claro"] .warn{background:#FFF4D6;border-color:#E8CE86;color:#4A3A10}
html[data-tema="escuro"] .warn{background:#33290D;border-color:#5C4A17;color:#F0DFB4}
html[data-tema="quente"] .warn{background:#3B3524;border-color:#5A5236;color:#EFE3BE}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:6px}
.seg button{flex:1 1 44%;border:1px solid transparent;background:transparent;border-radius:15px;padding:13px 8px;
  font-size:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:9px;justify-content:flex-start}
.seg button[data-on="1"]{background:var(--card);color:var(--ink);box-shadow:var(--sh);border-color:var(--line)}
.sw{width:19px;height:19px;border-radius:7px;flex:0 0 auto;border:1.5px solid rgba(128,128,128,.4)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--mute)}
.kv b{font-weight:600}
.pv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;
  display:grid;grid-template-columns:76px 1fr 90px 56px 40px;gap:6px;align-items:center}
.pv input{padding:9px;font-size:13.5px;border-radius:9px;background:var(--soft)}

<body>
<div id="app"></div>
<div id="modal"></div>

<script>
"use strict";
const SEED = [];

/* ================= armazenamento ================= */
let MEM = null, AVISO_STORAGE = "";
const DB = {
  read(){
    if (MEM) return MEM;
    try { const s = localStorage.getItem("divisor:v1"); return s ? JSON.parse(s) : null; }
    catch(e){ AVISO_STORAGE = "Este navegador bloqueou o armazenamento. Instale o app para que as marcações fiquem salvas."; return MEM; }
  },
  write(s){
    MEM = s;
    try { localStorage.setItem("divisor:v1", JSON.stringify(s)); }
    catch(e){ AVISO_STORAGE = "Não consegui salvar no aparelho. Use Configurar › Backup."; }
  }
};

/* ================= categorias ================= */
const DEFAULT_CATS = ["Alimentação/bebidas","Mercado","Saúde","Cuidados pessoais","Transporte",
  "Boletos","Streamings","Assinaturas","Compras online","Entretenimento","Lazer","Pets",
  "Pix parcelado","Presentes","Taxas","Outros"];

const semAcento = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const REGRAS_CAT = [
  [/caesb|\bceb\b|neoenergia|flexpag|neobsb|picpay credi|boleto|iptu|ipva|condominio/i, "Boletos"],
  [/\bsky\b|netflix|spotify|disney|prime canais|amazon music|globoplay|\bhbo\b|paramount|deezer|youtube premium|telecine/i, "Streamings"],
  [/picpay|\bpix\b/i, "Pix parcelado"],
  [/petz|pet ?supermark|gold ?dog|petcare|veterinar|racao/i, "Pets"],
  [/drogar|drogasil|rd ?saude|rdsaude|farmac|plano de saude|life plano|clinic|consulta|exame|laborator|hospital|dentist|psicolog/i, "Saúde"],
  [/esmalteria|que beleza|wow ?fio|wowfio|salao|cabelo|barbear|manicure|depilac|estetica|spa\b/i, "Cuidados pessoais"],
  [/auto posto|posto |estacionamento|sem parar|uber|99 ?pop|combust|gasolina|taxi|metro|onibus|pedagio/i, "Transporte"],
  [/ingresso|ticket|entretenimento|cinema|show|teatro|estadio|futebol|\btks\b/i, "Entretenimento"],
  [/hotel|pousada|decolar|airbnb|booking|resort|viagem|bar da|\bbar\b|vale da lua|balneario|parque/i, "Lazer"],
  [/microsoft|google|gamma|anthropic|claude|eduzz|escola do|as manhas|openai|adobe|canva|notion|figma|ifood club|icloud|dropbox/i, "Assinaturas"],
  [/amazon|shopee|centauro|nike|trussardi|zerezes|mercado ?livre|magalu|aliexpress|shein|renner|riachuelo|fotop|asaas/i, "Compras online"],
  [/^iof|iof |juros|anuidade|tarifa|multa|encargo|fapetec|inscricao|taxa/i, "Taxas"],
  [/superquadra|baratao|viva convenien|supermerc|hortifruti|acougue|quitanda|atacad|mercado/i, "Mercado"],
  [/ifd|ifood|restaurant|pizza|massa|padaria|panificad|lanch|burger|mc ?donald|arcos dourados|subway|estrogonof|parmegiana|potiguar|capelletto|cozin|china|foods|dona |giu medeiros|marice|panelinhas|pamonha|sandri|aricine|\bdvf\b|cb lago|ls dias|jnrt|unique|rozostolato|g cnb|cantina|vinny|fatima|jonatan|casa do|balcao|cafe|doceria|sorvet|hot m|comercio|conveni/i, "Alimentação/bebidas"],
];

function categorizar(nome){
  const n = semAcento(nome);
  for (const [re, cat] of REGRAS_CAT) if (re.test(n)) return cat;
  return "Outros";
}

/* ================= estado ================= */
const CORES = ["#6A34C9","#0A7568","#AC5F08","#B0234A","#1E5FB4","#4E7A0C","#8A3FA0","#0F6E8C"];
const CORCAT = {
  "Alimentação/bebidas":"#E0632B", "Mercado":"#1E7A3C", "Saúde":"#C0334D", "Cuidados pessoais":"#B0348A",
  "Transporte":"#1E5FB4", "Boletos":"#585D69", "Streamings":"#7B34C9", "Assinaturas":"#0F6E8C",
  "Compras online":"#A85C0A", "Entretenimento":"#C43D6B", "Lazer":"#0A8A6E", "Pets":"#6B7A0C",
  "Pix parcelado":"#2B6FA8", "Presentes":"#9A2FB0", "Taxas":"#8A6A1E", "Outros":"#6B6F79"
};
const PALETA = ["#E0632B","#1E7A3C","#C0334D","#B0348A","#1E5FB4","#7B34C9","#0F6E8C","#A85C0A","#0A8A6E","#6B7A0C"];
function corCat(c){
  if (CORCAT[c]) return CORCAT[c];
  let s = 0; for (const ch of String(c)) s = (s*31 + ch.charCodeAt(0)) >>> 0;
  return PALETA[s % PALETA.length];
}
const inicialCat = c => (String(c||"?").trim()[0]||"?").toUpperCase();

const CORESBG = ["#EFE8FC","#DDF1ED","#FBEDDB","#FCE6EB","#E5EEFB","#ECF3E0","#F7E9FB","#E2EFF5"];
const uid = p => p + Math.random().toString(36).slice(2,8);

function inicial(){
  return {
    pessoas:[{id:"p1",nome:"Eu",cor:0},{id:"p2",nome:"Ele",cor:1}], euId:"p1",
    cartoes:[{id:"c1",nome:"Personnalité",pagador:"p2"}],
    faturas:[{id:"f1",cartaoId:"c1",rotulo:"Julho/26",lanc:SEED.map((x,i)=>({id:"s"+i,d:x.d,r:x.r,g:x.g,v:x.v,p:x.p||null}))}],
    regras:{}, regrasCat:{}, aloc:{}, ativa:"f1", cartaoAtivo:"c1", rotuloAtivo:"Julho/26",
    contas:[], pagos:{}, fatPagas:{}, acertos:{}, orcamento:{total:0, base:"eu", limites:{}}, acertos:{},
    cats:DEFAULT_CATS.slice(), catv:2
  };
}
let S = DB.read() || inicial();

/* migração: garante campos novos sem perder nada do que já existe.
   Chamada no fim do arquivo, quando todos os utilitários já existem. */
function migrar(){
  let mudou = false, mudouEscopo = false;
  S.contas = S.contas || [];
  S.pagos = S.pagos || {};
  S.fatPagas = S.fatPagas || {};
  S.orcamento = S.orcamento || {total:0, base:"eu", limites:{}};
  S.acertos = S.acertos || {};
  S.acertos = S.acertos || {};
  if (!S.mesContas){ const d=new Date();
    S.mesContas = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); mudouEscopo = true; }
  S.regrasCat = S.regrasCat || {};
  S.regras = S.regras || {};
  S.aloc = S.aloc || {};
  if (!S.cats || !S.cats.length) S.cats = DEFAULT_CATS.slice();
  if (!S.rotuloAtivo || !S.cartaoAtivo){
    const f0 = S.faturas.find(f=>f.id===S.ativa) || S.faturas[0];
    S.rotuloAtivo = f0 ? f0.rotulo : "";
    S.cartaoAtivo = f0 ? f0.cartaoId : (S.cartoes[0]||{}).id;
    mudouEscopo = true;
  }
  // rótulos manuais viram competência ("Julho/26" -> "2026-07")
  (S.faturas||[]).forEach(f => {
    if (!f.comp){ const c = compDeRotulo(f.rotulo); if (c){ f.comp = c; mudouEscopo = true; } }
    if (f.comp) f.rotulo = compLabel(f.comp);
  });
  // cria a fatura do mês corrente para cada cartão que tem dia de fechamento
  (S.cartoes||[]).forEach(c => {
    if (!c.fechamento) return;
    const comp = compAtual(c);
    if (!S.faturas.some(f => f.cartaoId===c.id && f.comp===comp)){
      S.faturas.push({id:uid("f"), cartaoId:c.id, comp, rotulo:compLabel(comp), lanc:[]});
      mudouEscopo = true;
    }
  });
  // taxonomia nova: recategoriza tudo, menos o que foi ajustado à mão
  if (S.catv !== 2){
    (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
      l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||""));
    }));
    S.catv = 2; mudou = true;
  }
  (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
    if (!l.cat){ l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||"")); mudou = true; }
    if (!S.cats.includes(l.cat)){ S.cats.push(l.cat); mudou = true; }
  }));
  if (mudou || mudouEscopo || !DB.read()) DB.write(S);
}

let UI = {view:"inicio", modo:"grupo", soPend:false, filtroP:null, aberto:null,
          sheet:null, tmp:null, editando:null, editandoItem:null, buffer:""};

/* ================= utilidades ================= */
const brl = n => (n<0?"−R$ ":"R$ ") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dia = s => /^\d{4}-/.test(s) ? s.slice(8,10)+"/"+s.slice(5,7) : s;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pessoa = id => S.pessoas.find(p=>p.id===id);
const MESES_NOME = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const diasNoMes = (a,m) => new Date(a, m, 0).getDate();
const compSoma = (comp, n) => {
  let [a,m] = comp.split("-").map(Number);
  const t = (a*12 + (m-1)) + n;
  return Math.floor(t/12) + "-" + String(t%12 + 1).padStart(2,"0");
};
const compLabel = comp => {
  const [a,m] = comp.split("-").map(Number);
  return MESES_NOME[m-1] + "/" + String(a).slice(2);
};
function compDeRotulo(r){
  const m = String(r||"").match(/^([a-zç]+)\s*\/\s*(\d{2,4})$/i);
  if (!m) return null;
  const i = MESES_NOME.findIndex(x => semAcento(x) === semAcento(m[1]));
  if (i < 0) return null;
  const a = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
  return a + "-" + String(i+1).padStart(2,"0");
}
function compAtual(c){
  const h = new Date();
  let a = h.getFullYear(), m = h.getMonth()+1;
  if (c && c.fechamento && h.getDate() > c.fechamento){ m++; if (m>12){ m=1; a++; } }
  return a + "-" + String(m).padStart(2,"0");
}
const fmtData = d => String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
function statusFatura(c, comp){
  if (!c || !c.fechamento || !comp) return null;
  const [a,m] = comp.split("-").map(Number);
  const fech = new Date(a, m-1, Math.min(c.fechamento, diasNoMes(a,m)));
  let venc = null;
  if (c.vencimento){
    let va=a, vm=m;
    if (c.vencimento <= c.fechamento){ vm++; if (vm>12){ vm=1; va++; } }
    venc = new Date(va, vm-1, Math.min(c.vencimento, diasNoMes(va,vm)));
  }
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (hoje < fech) return {e:"aberta", t:"em aberto · fecha " + fmtData(fech)};
  if (venc){
    const dias = Math.round((venc - hoje)/86400000);
    if (dias > 0) return {e:"fechada", t:"fechada · vence em " + dias + (dias===1?" dia":" dias")};
    if (dias === 0) return {e:"vence", t:"vence hoje"};
    return {e:"vencida", t:"venceu em " + fmtData(venc)};
  }
  return {e:"fechada", t:"fechada em " + fmtData(fech)};
}
const faturaPaga = f => !!(f && f.pgto && f.pgto.pago);
function totalFatura(f){ return f.lanc.reduce((a,l)=>a+l.v, 0); }

function garantirFatura(cartaoId, comp){
  let f = S.faturas.find(x => x.cartaoId===cartaoId && x.comp===comp);
  if (f) return f;
  f = {id:uid("f"), cartaoId, comp, rotulo:compLabel(comp), lanc:[]};
  S.faturas.push(f);
  return f;
}

const TITULOS = /^(tio|tia|sr|sra|dona|dom|dr|dra|vo|seu|prof|padrinho|madrinha)$/;
function curtoNome(n){
  const w = String(n||"").trim().split(/\s+/);
  if (w.length <= 1) return w[0] || "";
  return TITULOS.test(semAcento(w[0])) ? w[0] + " " + w[1] : w[0];
}
function sigla(n){
  const w = String(n||"").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "?";
  if (w.length === 1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0] + w[w.length-1][0]).toUpperCase();
}

const rotulos = () => [...new Set(S.faturas
  .filter(f => S.cartaoAtivo==="todos" || f.cartaoId===S.cartaoAtivo)
  .map(f => f.rotulo))];
function faturasAtivas(){
  return S.faturas.filter(f =>
    (S.cartaoAtivo==="todos" || f.cartaoId===S.cartaoAtivo) && f.rotulo===S.rotuloAtivo);
}
function lancAtivos(){
  const out = [];
  faturasAtivas().forEach(f => f.lanc.forEach(l => out.push(Object.assign({_f:f}, l))));
  return out;
}
const fatura = () => faturasAtivas()[0] || S.faturas.find(f=>f.id===S.ativa) || S.faturas[0];
const nomeCartao = f => { const c = S.cartoes.find(x=>x.id===f.cartaoId); return c?c.nome:"—"; };
const multiCartao = () => S.cartaoAtivo==="todos" && new Set(faturasAtivas().map(f=>f.cartaoId)).size>1;
const cartaoDe = f => S.cartoes.find(c=>c.id===f.cartaoId) || S.cartoes[0];
const alocDe = id => S.aloc[id] || [];
const salvar = () => DB.write(S);
const curto = n => n.length>6 ? n.slice(0,5)+"." : n;

function totais(){
  const t = {porPessoa:{}, total:0, pend:0, nPend:0};
  S.pessoas.forEach(p=>t.porPessoa[p.id]=0);
  lancAtivos().forEach(l=>{
    t.total += l.v;
    const a = alocDe(l.id).filter(id=>pessoa(id));
    if (!a.length){ t.pend += l.v; t.nPend++; return; }
    a.forEach(id => t.porPessoa[id] += l.v/a.length);
  });
  return t;
}
function visiveis(){
  let L = lancAtivos();
  if (UI.filtroP === "sem") L = L.filter(l=>!alocDe(l.id).length);
  else if (UI.filtroP) L = L.filter(l=>alocDe(l.id).includes(UI.filtroP));
  if (UI.soPend) L = L.filter(l=>!alocDe(l.id).length);
  return L;
}

// mês do resumo: segue o rótulo da fatura quando ele é um mês reconhecível
const mesResumo = () => compDeRotulo(S.rotuloAtivo) || S.mesContas;

function fecharAcerto(dev){
  const eu = S.euId; let pago = 0, receber = 0; const linhas = [];
  Object.entries(dev).forEach(([pag, quem])=>{
    if (pag === eu) Object.entries(quem).forEach(([id,v])=>{ receber += v;
      linhas.push({txt:(pessoa(id)?curtoNome(pessoa(id).nome):"?")+" te deve", v}); });
    else if (quem[eu]){ pago += quem[eu];
      linhas.push({txt:"você paga a "+(pessoa(pag)?curtoNome(pessoa(pag).nome):"?"), v:quem[eu]}); }
  });
  return {pago, receber, liquido: pago - receber, linhas};
}
function devDosCartoes(){
  const dev = {};
  faturasAtivas().forEach(f=>{
    const c = S.cartoes.find(x=>x.id===f.cartaoId); if (!c) return;
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id)); if (!a.length) return;
      a.forEach(id=>{ if (id===c.pagador) return;
        dev[c.pagador] = dev[c.pagador]||{};
        dev[c.pagador][id] = (dev[c.pagador][id]||0) + l.v/a.length; });
    });
  });
  return dev;
}
function devDasContas(m){
  const dev = {};
  contasDoMes(m).forEach(x=>{
    const a = (x.c.pessoas||[]).filter(id=>pessoa(id)); if (!a.length) return;
    a.forEach(id=>{ if (id===x.c.pagador || !x.c.pagador) return;
      dev[x.c.pagador] = dev[x.c.pagador]||{};
      dev[x.c.pagador][id] = (dev[x.c.pagador][id]||0) + x.valor/a.length; });
  });
  return dev;
}
function acertoGeral(){
  const dev = devDosCartoes();
  const dc = devDasContas(mesResumo());
  Object.entries(dc).forEach(([pag,quem])=>{ dev[pag]=dev[pag]||{};
    Object.entries(quem).forEach(([id,v])=>{ dev[pag][id]=(dev[pag][id]||0)+v; }); });
  return fecharAcerto(dev);
}

// para onde foi o dinheiro, por categoria — opcionalmente a fatia de uma pessoa
function gastosResumo(pid){
  const m = mesResumo(), out = {};
  let total = 0, nCart = 0, nCont = 0, semDono = 0;
  lancAtivos().forEach(l=>{
    const a = alocDe(l.id).filter(id=>pessoa(id));
    let v;
    if (pid){ if (!a.includes(pid)) return; v = l.v/a.length; }
    else { v = l.v; if (!a.length) semDono += l.v; }
    const c = l.cat||"Outros";
    out[c] = (out[c]||0)+v; total += v; nCart++;
  });
  contasDoMes(m).forEach(x=>{
    const a = (x.c.pessoas||[]).filter(id=>pessoa(id));
    let v;
    if (pid){ if (!a.includes(pid)) return; v = x.valor/a.length; }
    else { v = x.valor; if (!a.length) semDono += x.valor; }
    const c = x.c.cat||"Boletos";
    out[c] = (out[c]||0)+v; total += v; nCont++;
  });
  return {itens: Object.entries(out).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])),
          total, nCart, nCont, semDono};
}

function acerto(){
  const dev = {};   // dev[pagador][pessoa] = quanto pessoa deve ao pagador
  faturasAtivas().forEach(f=>{
    const c = S.cartoes.find(x=>x.id===f.cartaoId); if (!c) return;
    const pag = c.pagador;
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id));
      if (!a.length) return;
      a.forEach(id=>{
        if (id === pag) return;
        dev[pag] = dev[pag] || {};
        dev[pag][id] = (dev[pag][id]||0) + l.v/a.length;
      });
    });
  });
  return fecharAcerto(dev);
}

/* --------- parcelas futuras --------- */
function parcelaInfo(p){
  const m = String(p||"").match(/^(\d+)\s*\/\s*(\d+)$/);
  if (!m) return null;
  const k = +m[1], n = +m[2];
  return (n > 1 && k >= 1 && k <= n) ? {k, n} : null;
}
// gera as parcelas seguintes de um lançamento nas competências futuras do mesmo cartão
function propagar(l, f){
  const pi = parcelaInfo(l.p);
  if (!pi || !f.comp || pi.k >= pi.n) return 0;
  const serie = l.serie || uid("sr");
  l.serie = serie;
  let n = 0;
  for (let i = pi.k + 1; i <= pi.n; i++){
    const comp = compSoma(f.comp, i - pi.k);
    const alvo = garantirFatura(f.cartaoId, comp);
    const rot = i+"/"+pi.n;
    // já existe essa parcela desse estabelecimento em qualquer fatura do cartão?
    const jaTem = S.faturas.some(x => x.cartaoId === f.cartaoId &&
      x.lanc.some(y => y.p === rot && semAcento(y.g) === semAcento(l.g)));
    if (jaTem) continue;
    const id = uid("l");
    alvo.lanc.push({id, d:l.d, r:l.r, g:l.g, v:l.v, p:i+"/"+pi.n, cat:l.cat, serie, auto:true});
    const a = alocDe(l.id);
    if (a.length) S.aloc[id] = a.slice();
    else if (S.regras[l.g]) S.aloc[id] = S.regras[l.g].slice();
    n++;
  }
  return n;
}
function previsaoParcelas(){   // quantas seriam geradas, sem gerar
  let n = 0, v = 0;
  S.faturas.forEach(f => f.lanc.forEach(l => {
    const pi = parcelaInfo(l.p);
    if (!pi || !f.comp || l.auto) return;
    for (let i = pi.k+1; i <= pi.n; i++){
      const comp = compSoma(f.comp, i - pi.k);
      const alvo = S.faturas.find(x => x.cartaoId===f.cartaoId && x.comp===comp);
      if (alvo && alvo.lanc.some(x => x.serie && x.serie===l.serie && x.p === i+"/"+pi.n)) continue;
      n++; v += l.v;
    }
  }));
  return {n, v};
}
// remove as parcelas previstas de um cartão e as faturas que ficarem vazias
function limparAuto(cartaoId, manter){
  S.faturas.filter(f=>f.cartaoId===cartaoId).forEach(f=>{
    f.lanc.filter(l=>l.auto).forEach(l=>delete S.aloc[l.id]);
    f.lanc = f.lanc.filter(l=>!l.auto);
  });
  const c = S.cartoes.find(x=>x.id===cartaoId);
  const atual = c && c.fechamento ? compAtual(c) : null;
  S.faturas = S.faturas.filter(f =>
    f.cartaoId!==cartaoId || f.lanc.length || f.id===manter || f.comp===atual);
}
// compras estornadas que ainda têm parcelas previstas rodando
function estornosPendentes(){
  const res = [];
  S.faturas.forEach(f => f.lanc.forEach(l => {
    if (l.v >= 0) return;
    const chave = semAcento(l.g);
    const futuras = [];
    S.faturas.filter(x => x.cartaoId === f.cartaoId).forEach(x => x.lanc.forEach(y => {
      if (y.auto && semAcento(y.g) === chave) futuras.push({l:y, rot:x.rotulo, comp:x.comp||""});
    }));
    if (!futuras.length) return;
    const existe = res.find(r => r.chave === chave && r.cartaoId === f.cartaoId);
    if (existe){ existe.estorno += l.v; return; }
    res.push({chave, nome:l.g, cartaoId:f.cartaoId, cartao:nomeCartao(f), estorno:l.v,
              futuras: futuras.sort((a,b)=>a.comp<b.comp?-1:1)});
  }));
  res.forEach(r => r.somaFuturas = r.futuras.reduce((a,x)=>a+x.l.v, 0));
  return res;
}

function apagarLanc(ids){
  const set = new Set(ids);
  S.faturas.forEach(f => {
    f.lanc = f.lanc.filter(l => { if (set.has(l.id)){ delete S.aloc[l.id]; return false; } return true; });
  });
  salvar();
}

function propagarTudo(cartaoId){
  let n = 0;
  S.faturas.filter(f=>f.cartaoId===cartaoId).slice()
    .forEach(f => f.lanc.slice().forEach(l => { if (!l.auto) n += propagar(l, f); }));
  return n;
}
function refazerParcelas(cartaoId){ limparAuto(cartaoId); return propagarTudo(cartaoId); }
// uma fatura só "conflita" se tiver algum lançamento de verdade
const faturaReal = f => f.lanc.some(l => !l.auto);
function gerarTodasParcelas(){
  let n = 0;
  S.faturas.slice().forEach(f => f.lanc.slice().forEach(l => { if (!l.auto) n += propagar(l, f); }));
  salvar();
  return n;
}
const irmaosSerie = id => {
  const l = S.faturas.flatMap(f=>f.lanc).find(x=>x.id===id);
  if (!l || !l.serie) return [id];
  return S.faturas.flatMap(f=>f.lanc).filter(x=>x.serie===l.serie).map(x=>x.id);
};

/* --------- contas a pagar --------- */
const chavePg = (id, m) => id + ":" + m;
const hojeISO = () => { const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };

function vencDe(c, m){
  if (c.tipo === "avulsa") return c.data || (m + "-01");
  const [a, mm] = m.split("-").map(Number);
  return m + "-" + String(Math.min(c.dia || 1, diasNoMes(a, mm))).padStart(2, "0");
}
function contasDoMes(m){
  return S.contas.filter(c => {
    if (c.tipo === "avulsa") return String(c.data||"").slice(0,7) === m;
    if (c.desde && m < c.desde) return false;
    if (c.ate && m > c.ate) return false;
    return true;
  }).map(c => {
    const pg = S.pagos[chavePg(c.id, m)];
    const venc = vencDe(c, m);
    const hoje = hojeISO();
    const dias = Math.round((new Date(venc+"T00:00") - new Date(hoje+"T00:00")) / 86400000);
    return {c, venc, dias,
            valor: pg && pg.valor != null ? pg.valor : (c.valor || 0),
            pago: !!(pg && pg.pago), quando: pg ? pg.quando : null,
            estado: (pg && pg.pago) ? "paga" : (dias < 0 ? "vencida" : (dias <= 7 ? "perto" : "aberta"))};
  }).sort((a,b) => a.venc < b.venc ? -1 : (a.venc > b.venc ? 1 : 0));
}
function resumoContas(m){
  const L = contasDoMes(m);
  const r = {total:0, pago:0, aberto:0, nVencidas:0, porPessoa:{}, dev:{}};
  S.pessoas.forEach(p => r.porPessoa[p.id] = 0);
  L.forEach(x => {
    r.total += x.valor;
    if (x.pago) r.pago += x.valor; else { r.aberto += x.valor; if (x.estado==="vencida") r.nVencidas++; }
    const a = (x.c.pessoas || []).filter(id => pessoa(id));
    if (!a.length) return;
    a.forEach(id => {
      r.porPessoa[id] += x.valor / a.length;
      const pag = x.c.pagador;
      if (pag && id !== pag){ r.dev[pag] = r.dev[pag] || {};
        r.dev[pag][id] = (r.dev[pag][id] || 0) + x.valor / a.length; }
    });
  });
  const red = reduzirDev(r.dev, null);
  r.liquido = red.liquido; r.linhas = red.linhas; r.lista = L;
  return r;
}
const mesSoma = (m, n) => compSoma(m, n);

/* ================= alocação ================= */
function togglePessoa(ids, pid, chaveRegra){
  const ligar = ids.some(id=>!alocDe(id).includes(pid));
  ids.forEach(id=>{
    const a = new Set(alocDe(id));
    if (ligar) a.add(pid); else a.delete(pid);
    const arr = [...a];
    if (arr.length) S.aloc[id] = arr; else delete S.aloc[id];
  });
  if (chaveRegra){
    const a = alocDe(ids[0]);
    if (a.length) S.regras[chaveRegra] = a; else delete S.regras[chaveRegra];
  }
  salvar(); render();
}

function renomearGrupo(velho, novo){
  novo = (novo||"").trim();
  if (!novo || novo === velho) return;
  const f = fatura();
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === velho) l.g = novo; }));
  if (S.regras[velho]){ S.regras[novo] = S.regras[velho]; delete S.regras[velho]; }
  if (S.regrasCat[velho]){ S.regrasCat[novo] = S.regrasCat[velho]; delete S.regrasCat[velho]; }
  if (UI.aberto === velho) UI.aberto = novo;
  salvar();
}
function renomearItem(id, novo){
  novo = (novo||"").trim(); if (!novo) return;
  const f = fatura();
  const l = f.lanc.find(x=>x.id===id);
  if (!l) return;
  l.g = novo;
  if (S.regrasCat[novo]) l.cat = S.regrasCat[novo];
  salvar();
}
function mudarCategoria(grupo, cat){
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === grupo) l.cat = cat; }));
  S.regrasCat[grupo] = cat;
  salvar(); render();
}

function aplicarTema(){
  const t = (S && S.tema) || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", t);
  const sis = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const efetivo = t === "auto" ? (sis ? "quente" : "claro") : t;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", CORBARRA[efetivo] || "#F0F1F6");

function agrupar(L, chave){

    g.misto = set.size > 1;
    g.aloc = g.misto ? [] : alocDe(g.itens[0].id);

const ORDENS = [["data-desc","Mais recentes"],["data-asc","Mais antigos"],
                ["valor-desc","Maior valor"],["valor-asc","Menor valor"],
                ["nome","Nome A–Z"]];
function ordenar(L){
  const o = UI.ordem || "data-desc";
  const c = [...L];
  if (o === "data-asc")   c.sort((a,b)=> String(a.d)<String(b.d)?-1:(String(a.d)>String(b.d)?1:0));
  else if (o === "valor-desc") c.sort((a,b)=> Math.abs(b.v)-Math.abs(a.v));
  else if (o === "valor-asc")  c.sort((a,b)=> Math.abs(a.v)-Math.abs(b.v));
  else if (o === "nome")  c.sort((a,b)=> a.g.localeCompare(b.g, "pt-BR", {sensitivity:"base"}));
  else c.sort((a,b)=> String(a.d)<String(b.d)?1:(String(a.d)>String(b.d)?-1:0));
  return c;
}

/* --------- visão do mês: cartões + contas --------- */
function faturasDoMes(m){
  return S.faturas.filter(f => f.comp ? f.comp === m : f.rotulo === compLabel(m));
}
function itensDoMes(m){
  const out = [];
  faturasDoMes(m).forEach(f => f.lanc.forEach(l => out.push({
    id:l.id, g:l.g, cat:l.cat||"Outros", v:l.v, aloc:alocDe(l.id).filter(id=>pessoa(id)),
    fonte:"cartao", fonteId:f.cartaoId, onde:nomeCartao(f), d:l.d, p:l.p, auto:l.auto
  })));
  contasDoMes(m).forEach(x => out.push({
    id:x.c.id, g:x.c.nome, cat:x.c.cat||"Boletos", v:x.valor,
    aloc:(x.c.pessoas||[]).filter(id=>pessoa(id)),
    fonte:"conta", fonteId:"contas", onde:x.pago?"conta paga":"conta em aberto", d:x.venc, p:null, pago:x.pago
  }));
  return out;
}
const chaveAcerto = (m, devedor, credor) => m + ":" + devedor + ">" + credor;
const quitacao = (m, devedor, credor) => S.acertos[chaveAcerto(m, devedor, credor)] || null;

function reduzirDev(dev, m){
  const eu = S.euId; let pago = 0, receber = 0; const linhas = [];
  Object.entries(dev).forEach(([pag, quem]) => {
    Object.entries(quem).forEach(([id, v]) => {
      if (pag !== eu && id !== eu) return;              // só o que envolve você
      const q = m ? quitacao(m, id, pag) : null;
      const quitado = !!(q && q.pago);
      const recebe = pag === eu;
      if (!quitado){ if (recebe) receber += v; else pago += v; }
      linhas.push({
        txt: recebe ? (pessoa(id)?curtoNome(pessoa(id).nome):"?") + " te deve"
                    : "você paga a " + (pessoa(pag)?curtoNome(pessoa(pag).nome):"?"),
        v, quitado, quando: q ? q.quando : null, valorPago: q ? q.valor : null,
        chave: m ? chaveAcerto(m, id, pag) : null, recebe
      });
    });
  });
  linhas.sort((a,b)=> (a.quitado?1:0)-(b.quitado?1:0) || Math.abs(b.v)-Math.abs(a.v));
  const aberto = linhas.filter(l => !l.quitado);
  return {pago, receber, liquido: pago - receber, linhas,
          nAbertos: aberto.length,
          liquidoAberto: aberto.filter(l=>!l.recebe).reduce((a,l)=>a+l.v,0)
                       - aberto.filter(l=>l.recebe).reduce((a,l)=>a+l.v,0)};
}
function acertoMes(m){
  const dev = {};
  const somar = (pag, a, v) => { if (!pag || !a.length) return;
    a.forEach(id => { if (id === pag) return;
      dev[pag] = dev[pag] || {}; dev[pag][id] = (dev[pag][id]||0) + v/a.length; }); };
  faturasDoMes(m).forEach(f => {
    const c = S.cartoes.find(x => x.id === f.cartaoId); if (!c) return;
    f.lanc.forEach(l => somar(c.pagador, alocDe(l.id).filter(id=>pessoa(id)), l.v));
  });
  contasDoMes(m).forEach(x => somar(x.c.pagador, (x.c.pessoas||[]).filter(id=>pessoa(id)), x.valor));
  return reduzirDev(dev, m);
}
function totaisMes(m){
  const t = {porPessoa:{}, total:0, cartoes:0, contas:0, pend:0, nPend:0};
  S.pessoas.forEach(p => t.porPessoa[p.id] = 0);
  itensDoMes(m).forEach(it => {
    t.total += it.v;
    t[it.fonte === "conta" ? "contas" : "cartoes"] += it.v;
    if (!it.aloc.length){ t.pend += it.v; t.nPend++; return; }
    it.aloc.forEach(id => t.porPessoa[id] += it.v / it.aloc.length);
  });
  return t;
}

function dataVenc(c, comp){
  if (!c || !c.vencimento || !comp) return null;
  const [a, m] = comp.split("-").map(Number);
  let va = a, vm = m;
  if (c.fechamento && c.vencimento <= c.fechamento){ vm++; if (vm > 12){ vm = 1; va++; } }
  return va + "-" + String(vm).padStart(2,"0") + "-" + String(Math.min(c.vencimento, diasNoMes(va, vm))).padStart(2,"0");
}
function faturasAPagar(m){
  return faturasDoMes(m).filter(f => f.lanc.length).map(f => {
    const c = S.cartoes.find(x => x.id === f.cartaoId);
    const pg = S.fatPagas[f.id];
    const venc = dataVenc(c, f.comp);
    const dias = venc ? Math.round((new Date(venc+"T00:00") - new Date(hojeISO()+"T00:00"))/86400000) : null;
    const total = f.lanc.reduce((a,l)=>a+l.v, 0);
    return {f, c, venc, dias, total, valor: pg && pg.valor != null ? pg.valor : total,
            pago: !!(pg && pg.pago), quando: pg ? pg.quando : null,
            estado: (pg && pg.pago) ? "paga" : (dias == null ? "aberta" : (dias < 0 ? "vencida" : (dias <= 7 ? "perto" : "aberta")))};
  }).sort((a,b) => String(a.venc) < String(b.venc) ? -1 : 1);
}
function resumoPagar(m){
  const rc = resumoContas(m), fs = faturasAPagar(m);
  const fTot = fs.reduce((a,x)=>a+x.valor,0);
  const fPago = fs.filter(x=>x.pago).reduce((a,x)=>a+x.valor,0);
  return {contas:rc, faturas:fs,
          total: rc.total + fTot, pago: rc.pago + fPago, aberto: (rc.total - rc.pago) + (fTot - fPago),
          nVencidas: rc.nVencidas + fs.filter(x=>x.estado==="vencida").length,
          nItens: rc.lista.length + fs.length,
          nPagos: rc.lista.filter(x=>x.pago).length + fs.filter(x=>x.pago).length};
}

/* --------- orçamento --------- */
function gastoOrcamento(m){
  const o = S.orcamento, soMeu = o.base !== "tudo";
  const fonte = S.fonteOrc || "todos";
  const porCat = {}, porFonte = {}; let total = 0, semDono = 0, nSemDono = 0;
  itensDoMes(m).forEach(it => {
    if (fonte !== "todos" && it.fonteId !== fonte) return;
    let v;
    if (soMeu){
      if (!it.aloc.length){ semDono += it.v; nSemDono++; return; }
      if (!it.aloc.includes(S.euId)) return;
      v = it.v / it.aloc.length;
    } else v = it.v;
    porCat[it.cat] = (porCat[it.cat] || 0) + v;
    porFonte[it.onde] = (porFonte[it.onde] || 0) + v;
    total += v;
  });
  const limites = o.limites || {};
  const monitoradas = Object.keys(limites).filter(c => limites[c] > 0)
    .map(c => { const g = porCat[c] || 0, lim = limites[c];
      return {cat:c, gasto:g, limite:lim, sobra:lim - g, pct: lim ? g/lim*100 : 0}; })
    .sort((a,b) => b.pct - a.pct);
  const fora = Object.entries(porCat).filter(([c]) => !(limites[c] > 0))
    .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
  const somaLimites = monitoradas.reduce((a,x) => a + x.limite, 0);
  return {porCat, porFonte, fonte, total, semDono, nSemDono, monitoradas, fora, somaLimites,
          sobraTotal: (o.total || 0) - total,
          naoDistribuido: (o.total || 0) - somaLimites};
}

function viewInicio(){
  const m = S.mesContas;
  const t = totaisMes(m), ac = acertoMes(m), itens = itensDoMes(m);

  const porCat = {};
  itens.forEach(it => { porCat[it.cat] = (porCat[it.cat]||0) + it.v; });
  const cats = Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const topo = UI.verTudoCat ? cats : cats.slice(0,6);
  const maxCat = cats.length ? Math.abs(cats[0][1]) : 1;

  const meses = {};
  S.faturas.forEach(f => { const c = f.comp || ""; if (!c || c <= m) return;
    f.lanc.forEach(l => { if (!l.auto) return;
      meses[c] = meses[c] || {rot:f.rotulo, v:0, n:0}; meses[c].v += l.v; meses[c].n++; }); });
  const prox = Object.entries(meses).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,6).map(x=>x[1]);
  const rp = resumoPagar(m);
  const rc = rp.contas;
  const liq = ac.liquidoAberto;
  const nada = Math.abs(liq) < 0.005;
  const tudoAcertado = ac.linhas.length && !ac.nAbertos;

  return `<div class="top">

            style="width:28px;height:28px;font-size:13px"
            aria-label="${l.quitado?"Desfazer":"Marcar como acertado"}">${l.quitado?"✓":""}</button>
          <span style="flex:1;${l.quitado?"text-decoration:line-through":""}">${esc(l.txt)}</span>
          <b class="num">${brl(l.quitado && l.valorPago!=null ? l.valorPago : l.v)}</b>
        </div>`).join("")}</div>` : ""}
    </div>
    <div class="stats">
      <div class="stat"><b class="num">${brl(t.total)}</b><i>gasto no mês</i></div>
      <div class="stat"><b class="num">${brl(t.cartoes)}</b><i>cartões</i></div>
      <div class="stat"><b class="num">${brl(t.contas)}</b><i>contas</i></div>
      ${t.nPend?`<div class="stat"><b class="num">${t.nPend}</b><i>sem dono</i></div>`:""}
    </div>
    <div class="body">
      ${AVISO_STORAGE?`<div class="warn">${esc(AVISO_STORAGE)}</div>`:""}
      <div class="cta">
        ${t.nPend?`<button class="pri" data-act="classificar">Classificar ${t.nPend}</button>`:""}
        <button ${t.nPend?"":'class="pri"'} data-act="sheet" data-v="exportar">Exportar</button>
      </div>

      <div class="sec"><h2>Por pessoa</h2>
        <button data-act="dica">toque para abrir</button></div>
      <div class="pgrid">${S.pessoas.map(p=>{
        const v = t.porPessoa[p.id]||0;
        const pc = t.total ? Math.abs(v)/Math.abs(t.total)*100 : 0;
        return `<button class="pcard" data-act="verpessoa" data-p="${p.id}" style="text-align:left">
          <div class="h"><i class="dot" style="background:${CORES[p.cor%8]}"></i>${esc(curtoNome(p.nome))}
            <span style="margin-left:auto;opacity:.45">›</span></div>
          <div class="v num">${brl(v)}</div>
          <div class="p">${pc.toFixed(0)}% do mês</div></button>`;
      }).join("")}</div>

      <div class="sec"><h2>Por categoria</h2>
        ${cats.length>6?`<button data-act="vertudocat">${UI.verTudoCat?"ver menos":"ver todas"}</button>`:""}</div>
      <div class="row">${topo.length ? topo.map(([c,v])=>
        barraCat(c, v, t.total, maxCat, `data-act="vercatmes" data-c="${esc(c)}"`)).join("")
        : `<div class="empty" style="padding:22px">Nada lançado neste mês.</div>`}</div>

      ${rp.nItens ? `<div class="sec"><h2>A pagar em ${esc(compLabel(m))}</h2>
        <button data-act="nav" data-v="contas">abrir</button></div>
      <div class="row"><button class="cbar" data-act="nav" data-v="contas" style="padding-top:2px">
        <div class="t"><b>${rp.aberto>0.005 ? "Falta pagar" : "Tudo pago"}</b>
          <div class="track"><span style="width:${rp.total?Math.abs(rp.pago)/Math.abs(rp.total)*100:0}%;background:#0A8A6E"></span></div></div>
        <div class="v"><b class="num">${brl(rp.aberto)}</b><i>${rp.nPagos}/${rp.nItens} pagas</i></div>

        ${rp.nVencidas} vencida${rp.nVencidas===1?"":"s"}</div>`:""}</div>` : ""}

      ${(()=>{ const o = S.orcamento;
        if (!(o.total > 0)) return "";
        const g = gastoOrcamento(m);
        const pct = Math.abs(g.total)/o.total*100;
        return `<div class="sec"><h2>Orçamento</h2>
          <button data-act="nav" data-v="orcamento">abrir</button></div>
        <div class="row"><button class="cbar" data-act="nav" data-v="orcamento" style="padding-top:2px">
          <div class="t"><b>${g.sobraTotal>=0?"Ainda pode gastar":"Passou do que tinha"}</b>
            <div class="track"><span style="width:${Math.min(100,pct).toFixed(1)}%;background:${CORLIM(pct)}"></span></div></div>
          <div class="v"><b class="num" style="color:${CORLIM(pct)}">${brl(Math.abs(g.sobraTotal))}</b>
            <i>${pct.toFixed(0)}% de ${brl(o.total)}</i></div></button>
          ${g.monitoradas.filter(x=>x.pct>=100).length ? `<div style="font-size:13px;color:#C0334D;font-weight:600;padding-top:8px">
            ${g.monitoradas.filter(x=>x.pct>=100).map(x=>x.cat).join(", ")} estourou o teto</div>`:""}</div>`;
      })()}

      ${prox.length ? `<div class="sec"><h2>Já comprometido</h2></div>
      <div class="row">${prox.map(x=>`<div class="mrow">
        <div class="m">${esc(x.rot)}<div class="c">${x.n} parcelas</div></div>
        <div class="val num" style="font-size:15.5px">${brl(x.v)}</div></div>`).join("")}</div>` : ""}
    </div>` + navbar();
}

function barraCat(c, v, total, max, attrs){
  const pc = total ? Math.abs(v)/Math.abs(total)*100 : 0;
  return `<button class="cbar" ${attrs||""}>
    <div class="badge" style="background:${corCat(c)};width:38px;height:38px;border-radius:12px;font-size:15px">${esc(inicialCat(c))}</div>
    <div class="t"><b>${esc(c)}</b>
      <div class="track"><span style="width:${Math.max(2,Math.abs(v)/(max||1)*100).toFixed(1)}%;background:${corCat(c)}"></span></div></div>
    <div class="v"><b class="num">${brl(v)}</b><i>${pc.toFixed(0)}%</i></div>
  </button>`;
}

sheets.addCat = () => {
  const t = UI.tmp || (UI.tmp = {q:""});
  const q = (t.q||"").trim();
  const norm = s => semAcento(s).trim();
  const achados = S.cats.filter(c => !q || norm(c).includes(norm(q)));
  const existe = S.cats.some(c => norm(c) === norm(q));
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <h3>Adicionar categoria</h3>
    <p style="font-size:14px;color:var(--mute);margin:0 0 12px">Digite para ver se já existe algo parecido.</p>
    <div class="srch"><input data-act="catq" data-foco value="${esc(t.q||"")}" placeholder="Nome da categoria"></div>
    ${q ? (existe
      ? `<div class="warn">Já existe uma categoria chamada "${esc(q)}".</div>`
      : `<button class="btn pri" data-act="catcriar">Criar "${esc(q)}"</button>`) : ""}
    <label class="f">${q ? "Parecidas que já existem" : "Categorias atuais"}</label>
    ${achados.length ? achados.map(c=>{
      const n = S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.cat===c).length,0);
      return `<div class="row"><div class="rowtop"><div class="nm" style="font-size:15px">${esc(c)}</div>
        <span class="tag">${n}</span></div></div>`;
    }).join("") : `<div style="font-size:14px;color:var(--mute);padding:8px 2px">Nenhuma parecida.</div>`}

  </div></div>`;

sheets.verCat = () => {
  const t = UI.tmp || (UI.tmp = {cat:"", escopo:"atual"});
  let todos = [];
  if (t.escopo === "mes") todos = itensDoMes(S.mesContas);
  else {
    const fs = t.escopo==="todas" ? S.faturas : faturasAtivas();
    fs.forEach(f=>f.lanc.forEach(l=>todos.push(Object.assign({_f:f}, l))));
  }
  const daCat = todos.filter(l=>(l.cat||"Outros")===t.cat);
  const noMes = t.escopo === "mes";
  const totalGeral = todos.reduce((a,l)=>a+l.v,0);
  const totalCat = daCat.reduce((a,l)=>a+l.v,0);
  const pct = totalGeral ? Math.abs(totalCat)/Math.abs(totalGeral)*100 : 0;
  const porPessoa = {};
  daCat.forEach(l=>{
    const a = noMes ? (l.aloc||[]) : alocDe(l.id).filter(id=>pessoa(id));
    if (!a.length){ porPessoa["_"] = (porPessoa["_"]||0) + l.v; return; }
    a.forEach(id=>{ porPessoa[id] = (porPessoa[id]||0) + l.v/a.length; });
  });
  const porEstab = {};
  daCat.forEach(l=>{ porEstab[l.g] = (porEstab[l.g]||0) + l.v; });
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="badge" style="background:${corCat(t.cat)}">${esc(inicialCat(t.cat))}</div>
      <h3 style="margin:0">${esc(t.cat)}</h3></div>
    <select data-act="vcescopo" style="margin:10px 0 14px">

sheets.verPessoa = () => {
  const t = UI.tmp || {};
  const p = pessoa(t.p); if (!p) return "";
  const m = S.mesContas;
  const tot = totaisMes(m);
  const meus = itensDoMes(m).filter(it => it.aloc.includes(p.id))
    .map(it => Object.assign({}, it, {parte: it.v / it.aloc.length}));
  const soma = meus.reduce((a,x)=>a+x.parte, 0);
  const pcMes = tot.total ? Math.abs(soma)/Math.abs(tot.total)*100 : 0;
  const soDele = meus.filter(x=>x.aloc.length===1).reduce((a,x)=>a+x.parte,0);
  const dividido = soma - soDele;
  const emCartao = meus.filter(x=>x.fonte==="cartao").reduce((a,x)=>a+x.parte,0);
  const emConta = soma - emCartao;

  const porCat = {}; meus.forEach(x => porCat[x.cat] = (porCat[x.cat]||0) + x.parte);
  const cats = Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const maxc = cats.length ? Math.abs(cats[0][1]) : 1;
  const porEst = {}; meus.forEach(x => porEst[x.g] = (porEst[x.g]||0) + x.parte);
  const ests = Object.entries(porEst).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0, t.tudoEst ? 999 : 8);

  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <div class="badge" style="background:${CORES[p.cor%8]}">${esc(sigla(p.nome))}</div>
      <div><h3 style="margin:0">${esc(curtoNome(p.nome))}</h3>
        <div style="font-size:13px;color:var(--mute)">${esc(compLabel(m))}</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="rowtop"><div class="nm" style="font-size:15px">Parte no mês</div>
        <div class="val num">${brl(soma)}</div></div>
      <div class="pct"><span style="width:${Math.min(100,pcMes).toFixed(1)}%;background:${CORES[p.cor%8]}"></span></div>
      <div style="font-size:13.5px;color:var(--mute)">
        ${pcMes.toFixed(1).replace(".",",")}% de ${brl(tot.total)} gastos no mês · ${meus.length} itens</div>
    </div>
    <div class="stats" style="padding:2px 0 4px">
      <div class="stat"><b class="num">${brl(soDele)}</b><i>individuais</i></div>
      <div class="stat"><b class="num">${brl(dividido)}</b><i>em dividido</i></div>
      <div class="stat"><b class="num">${brl(emCartao)}</b><i>em cartões</i></div>
      <div class="stat"><b class="num">${brl(emConta)}</b><i>em contas</i></div>
    </div>
    <label class="f">Por categoria</label>
    <div class="row">${cats.length ? cats.map(([c,v]) =>
      barraCat(c, v, soma, maxc, `data-act="vercatmes" data-c="${esc(c)}"`)).join("")
      : `<div class="empty" style="padding:22px">Nada atribuído a ${esc(curtoNome(p.nome))} neste mês.</div>`}</div>
    ${ests.length ? `<label class="f">Maiores gastos</label>
    <div class="row">${ests.map(([g,v])=>`<div class="it">
      <div class="t"><b style="font-size:14.5px">${esc(g)}</b></div>
      <div class="val num" style="font-size:14.5px">${brl(v)}</div></div>`).join("")}
      ${Object.keys(porEst).length>8 && !t.tudoEst ? `<button class="lnk" data-act="tudoest" style="margin-top:10px">
        ver os ${Object.keys(porEst).length} estabelecimentos</button>` : ""}</div>` : ""}
    <button class="btn pri" data-act="filtrarpessoa" data-p="${p.id}">Ver lançamentos de ${esc(curtoNome(p.nome))}</button>
    <button class="btn" data-act="fechar">Fechar</button>
  </div></div>`;
};

        <div style="min-width:0"><div class="n">${esc(c)}</div>

    <div class="row" style="margin-top:12px">

  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">

sheets.escolherCat = () => {
  const t = UI.tmp || (UI.tmp = {});
  const q = (t.q || "").trim();
  const norm = s => semAcento(s).trim();
  const achados = S.cats.filter(c => !q || norm(c).includes(norm(q)));
  const existe = S.cats.some(c => norm(c) === norm(q));
  const conta = c => S.faturas.reduce((a,f)=>a+f.lanc.filter(l=>l.cat===c).length,0)
                   + S.contas.filter(x=>(x.cat||"Boletos")===c).length;
  const titulo = {grupo:"Categoria do estabelecimento", item:"Categoria do lançamento", conta:"Categoria da conta"}[t.alvo] || "Categoria";
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <h3>${titulo}</h3>
    <p style="font-size:14px;color:var(--mute);margin:0 0 6px">${esc(t.nome||"")}</p>
    ${t.alvo==="grupo" ? `<p style="font-size:12.5px;color:var(--mute);margin:0 0 12px">
      Vale para todos os lançamentos deste estabelecimento e vira regra para as próximas faturas.</p>`
     : (t.alvo==="item" ? `<p style="font-size:12.5px;color:var(--mute);margin:0 0 12px">
      Muda só este lançamento. O estabelecimento continua na categoria dele.</p>` : `<div style="height:8px"></div>`)}
    <div class="srch"><input data-act="ecq" data-foco value="${esc(t.q||"")}" placeholder="Buscar categoria"></div>
    ${q && !existe ? `<button class="btn pri" data-act="eccriar">Criar "${esc(q)}" e usar</button>` : ""}
    <div class="row">${achados.length ? achados.map(c=>`
      <button class="catopt" data-act="ecusar" data-c="${esc(c)}">
        <div class="badge" style="background:${corCat(c)};width:36px;height:36px;border-radius:11px;font-size:14px">${esc(inicialCat(c))}</div>
        <b>${esc(c)}</b>
        ${c===t.atual?`<span class="pill pg-paga">atual</span>`:`<span class="tag">${conta(c)}</span>`}
      </button>`).join("") : `<div class="empty" style="padding:22px">Nenhuma categoria com esse nome.</div>`}</div>
    <button class="btn" data-act="fechar">Fechar</button>
  </div></div>`;
};

/* ================= leitura de prints e PDFs ================= */
const PDFJS_SRC    = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
const TESS_SRC     = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const TESS_LANG    = "https://tessdata.projectnaptha.com/4.0.0_fast";
let workerOCR = null;

function carregarScript(src){
  return new Promise((ok, erro) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return ok();
    const s = document.createElement("script");
    s.src = src; s.dataset.src = src;
    s.onload = () => ok();
    s.onerror = () => erro(new Error("sem conexão para baixar o leitor"));
    document.head.appendChild(s);
  });
}

async function textoDoPDF(file, aviso){
  await carregarScript(PDFJS_SRC);
  const lib = window.pdfjsLib;
  if (!lib) throw new Error("leitor de PDF não carregou");
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let txt = "";
  for (let i = 1; i <= doc.numPages; i++){
    aviso("página " + i + "/" + doc.numPages);
    const pg = await doc.getPage(i), c = await pg.getTextContent();
    let ly = null, linha = [];
    c.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      if (ly !== null && Math.abs(y - ly) > 3){ txt += linha.join(" ") + "\n"; linha = []; }
      ly = y; linha.push(it.str);
    });
    txt += linha.join(" ") + "\n";
  }
  return txt;
}

async function textoDaImagem(file, aviso){
  await carregarScript(TESS_SRC);
  if (!window.Tesseract) throw new Error("leitor de imagem não carregou");
  if (!workerOCR){
    aviso("preparando o leitor…");
    workerOCR = await window.Tesseract.createWorker("por", 1, {langPath: TESS_LANG});
  }
  aviso("lendo…");
  const { data } = await workerOCR.recognize(file);
  return data.text;
}

async function lerArquivos(lista){
  const arqs = [...lista].sort((a,b) => a.name.localeCompare(b.name, "pt-BR", {numeric:true}));
  UI.tmp = UI.tmp || {};
  UI.tmp.arquivos = arqs.map(f => ({nome:f.name, estado:"na fila"}));
  UI.tmp.lendo = true;
  render();
  const aviso = i => msg => { const el = document.getElementById("arq" + i); if (el) el.textContent = msg; };
  let juntos = "";
  for (let i = 0; i < arqs.length; i++){
    const f = arqs[i];
    try {
      aviso(i)("abrindo…");
      const t = (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name))
        ? await textoDoPDF(f, aviso(i)) : await textoDaImagem(f, aviso(i));
      juntos += t + "\n";
      UI.tmp.arquivos[i].estado = "✓ lido";
      aviso(i)("✓ lido");
    } catch(e){
      UI.tmp.arquivos[i].estado = "✕ " + (e.message || "não consegui ler");
      aviso(i)(UI.tmp.arquivos[i].estado);
    }
  }
  if (workerOCR){ try { await workerOCR.terminate(); } catch(e){} workerOCR = null; }
  UI.tmp.lendo = false;
  UI.tmp.txt = ((UI.tmp.txt || "") + "\n" + juntos).trim();
  const prev = lerColado(UI.tmp.txt);
  if (!prev.length){ render(); return alert("Li os arquivos, mas não identifiquei lançamentos. Confira o texto na caixa abaixo."); }
  const fat = S.faturas.find(x => x.id === S.ativa) || fatura();
  prev.forEach(x => { const parc = (x.p||"").trim();
    x.dup = !!(fat && parc && fat.lanc.some(l => l.p===parc && semAcento(l.g)===semAcento(x.g) && !l.auto)); });
  UI.tmp.prev = prev;
  render();
}

/* ================= leitor ================= */
const MESES = {janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const RUIDO = /^(cart[aã]o virtual adicional|carteiras digitais adicional|adicional|image labels.*|[<>»«\-–—]+)$/i;
const RE_VAL = /(-|−)?\s*R\$\s*([\d.]+,\d{2})/;
const RE_PARC1 = /parcela\s+(\d+)\s+de\s+(\d+)/i;
const RE_PARC2 = /(\d{2})\s*\/\s*(\d{2})\s*$/;
function num(s){
  const x = String(s == null ? "" : s).trim().replace(/[^\d.,\-]/g, "");
  if (!x || x === "-") return NaN;
  const sep = Math.max(x.lastIndexOf(","), x.lastIndexOf("."));
  if (sep < 0) return parseFloat(x);
  const dec = x.slice(sep + 1);
  // 1 ou 2 dígitos depois do último separador = casa decimal; o resto é separador de milhar
  if (/^\d{1,2}$/.test(dec))
    return parseFloat(x.slice(0, sep).replace(/[.,]/g, "") + "." + dec);
  return parseFloat(x.replace(/[.,]/g, ""));
}
function previa(id, txt){
  const el = document.getElementById(id); if (!el) return;
  const n2 = num(String(txt).replace(/[R$\s]/g, ""));
  el.textContent = isNaN(n2) ? "digite o valor" : brl(n2);
  el.style.color = isNaN(n2) ? "var(--mute)" : "#0A8A6E";
}
const paraCampo = v => (v == null || v === "" || isNaN(v)) ? "" : Number(v).toFixed(2).replace(".", ",");
const parcNoNome = s => { const m = s.match(RE_PARC2); return m ? +m[1]+"/"+ +m[2] : ""; };
const limpaNome = s => s.replace(RE_PARC2,"").replace(/[>›»<‹«]/g,"").replace(/\s{2,}/g," ").trim();

function lerColado(txt){
  const linhas = txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s && !RUIDO.test(s));
  if (linhas.filter(l=>/[|;]/.test(l)).length > linhas.length*0.5){
    return linhas.map(l=>{
      const c = l.split(/[|;]/).map(s=>s.trim());
      return {d:c[0]||"", g:c[1]||"", v:(c[2]||"").replace(/R\$\s*/,""), p:c[3]||""};
    }).filter(x=>x.g);
  }
  let dataAtual = ""; const nomes = [], valores = [];
  for (const l of linhas){
    let m = l.match(/^(\d{1,2})\s+de\s+([a-zç]+)/i);
    if (m && MESES[m[2].toLowerCase()]){ dataAtual = String(m[1]).padStart(2,"0")+"/"+String(MESES[m[2].toLowerCase()]).padStart(2,"0"); continue; }
    m = l.match(/^(\d{1,2})\/(\d{1,2})(\/\d{2,4})?$/);
    if (m){ dataAtual = m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"); continue; }
    const v = l.match(RE_VAL);
    const resto = v ? l.replace(RE_VAL,"").replace(RE_PARC1,"").replace(/[>›»]/g,"").trim() : "";
    const pm = l.match(RE_PARC1);
    if (v && resto.length > 2){
      nomes.push({d:dataAtual, g:limpaNome(resto), p:pm?pm[1]+"/"+pm[2]:parcNoNome(resto)});
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else if (v){
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else {
      if (pm && valores.length){ valores[valores.length-1].p = pm[1]+"/"+pm[2]; continue; }
      nomes.push({d:dataAtual, g:limpaNome(l), p:parcNoNome(l)});
    }
  }
  return nomes.map((n,i)=>({d:n.d, g:n.g, v:valores[i]?valores[i].v:"", p:n.p || (valores[i]?valores[i].p:"") || ""}));
}

/* ================= exportação ================= */
function linhasExport(t){
  const fs = t.escopo==="todas" ? S.faturas : faturasAtivas();
  const out = [];
  fs.forEach(f=>{
    const c = cartaoDe(f);
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id));
      if (!a.length){
        if (t.pend) out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:1,quem:"(sem dono)",val:l.v});
        return;
      }
      a.forEach(id=>{ if (t.sel.includes(id))
        out.push({f:f.rotulo,c:c?c.nome:"",d:dia(l.d),g:l.g,cat:l.cat||"Outros",p:l.p||"",tot:l.v,div:a.length,quem:pessoa(id).nome,val:l.v/a.length}); });
    });
  });
  return out;
}
const CAB = ["fatura","cartao","data","estabelecimento","categoria","parcela","valor_total","dividido_entre","pessoa","valor_da_pessoa"];
function linhasContas(t){
  if (!t.contas) return [];
  const out = [];
  contasDoMes(S.mesContas).forEach(x=>{
    const a = (x.c.pessoas||[]).filter(id=>pessoa(id));
    if (!a.length) return;
    a.forEach(id=>{ if (!t.sel.includes(id)) return;
      out.push({f:compLabel(S.mesContas), c:"Conta"+(x.pago?" (paga)":" (em aberto)"), d:dia(x.venc),
                g:x.c.nome, cat:x.c.cat||"Boletos", p:"", tot:x.valor, div:a.length,
                quem:pessoa(id).nome, val:x.valor/a.length}); });
  });
  return out;
}
const campos = o => [o.f,o.c,o.d,o.g,o.cat,o.p,o.tot.toFixed(2).replace(".",","),o.div,o.quem,o.val.toFixed(2).replace(".",",")];

const todasLinhas = t => linhasExport(t).concat(linhasContas(t));
function gerarCSV(t){
  return "\uFEFF" + CAB.join(";") + "\n" +
    todasLinhas(t).map(o=>campos(o).map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");
}
function gerarTSV(t){
  return CAB.join("\t") + "\n" + todasLinhas(t).map(o=>campos(o).join("\t")).join("\n");
}
function gerarTexto(t){
  const L = todasLinhas(t), out = [];
  out.push(t.escopo==="todas" ? "Todas as faturas"
    : (S.rotuloAtivo + (S.cartaoAtivo==="todos" ? " · todos os cartões" : " · " + (S.cartoes.find(c=>c.id===S.cartaoAtivo)||{}).nome)), "");
  [...new Set(L.map(o=>o.quem))].forEach(nome=>{
    const meus = L.filter(o=>o.quem===nome), porCat = {};
    meus.forEach(o=>{ porCat[o.cat] = (porCat[o.cat]||0) + o.val; });
    out.push(nome.toUpperCase());
    Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([c,v])=>out.push("  "+c+" — "+brl(v)));
    out.push("  total: " + brl(meus.reduce((a,o)=>a+o.val,0)), "");
  });
  if (t.escopo==="atual"){
    const tt = totais(), ac = acerto();
    out.push("Fatura: " + brl(tt.total));
    ac.linhas.forEach(l=>out.push("  " + l.txt + ": " + brl(l.v)));
  }
  return out.join("\n");
}
function nomeArquivo(t, ext){
  const base = t.escopo==="todas" ? "todas" : (S.rotuloAtivo.replace(/\W+/g,"-").toLowerCase());
  return "gastos-" + base + "." + ext;
}
function nomeBackup(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return "divisor-backup-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".json";
}
function baixar(nome, conteudo, tipo){
  const u = URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 800);
}
async function copiar(txt, msg){
  try { await navigator.clipboard.writeText(txt); alert(msg); }
  catch(e){ prompt("Copie o conteúdo:", txt); }
}
