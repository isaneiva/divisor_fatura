<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Divisor de Fatura</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

/* ============================================================
   Sistema visual — "livro-caixa"
   Regras que valem para o app inteiro:
   1. Uma superfície só (--card) + um fio de contorno (--line).
      Sombra só no que realmente flutua: barra de abas e folha.
   2. Cor forte só responde "de quem é?" — pilulas de pessoa,
      barra do herói e o trilho lateral do grupo.
   3. Categoria e status entram como tinta clara (16% da cor).
   4. Pílula = filtro/etiqueta. Retângulo arredondado = controle.
   5. Dinheiro é sempre mono tabular; texto é sempre Jakarta.
   ============================================================ */

:root{
  --bg:#F2F3F7; --card:#FFF; --soft:#F1F2F6; --line:#E4E6EC;
  --ink:#14161B; --mute:#6B6F7A; --faint:#9AA0AC;
  --ac:#5B2CC4; --acsoft:#EDE7FB;
  --pos:#0A7A63; --atn:#A2680A; --neg:#BE3049;
  --tfg:#000;                       /* contraste da tinta de categoria */
  --heroA:#6C3AD8; --heroB:#3E1F8E;
  --r:16px; --rl:22px; --rs:12px; --pad:16px;
  --sh:0 1px 2px rgba(18,20,28,.05);
  --shf:0 -1px 0 var(--line), 0 -12px 28px -20px rgba(18,20,28,.28);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#232321; --card:#2E2E2C; --soft:#383836; --line:#403F3B;
         --ink:#F2F0EA; --mute:#A4A199; --faint:#87847C;
         --ac:#B79BFF; --acsoft:#3A3350; --tfg:#fff;
         --pos:#5FCFAF; --atn:#E8B863; --neg:#FF9AA6;
         --heroA:#5E33BE; --heroB:#33196F;
         --sh:0 1px 2px rgba(0,0,0,.22);
         --shf:0 -1px 0 var(--line), 0 -12px 28px -20px rgba(0,0,0,.6); }
}
html[data-tema="claro"]{ --bg:#F2F3F7; --card:#FFF; --soft:#F1F2F6; --line:#E4E6EC;
  --ink:#14161B; --mute:#6B6F7A; --faint:#9AA0AC; --ac:#5B2CC4; --acsoft:#EDE7FB;
  --pos:#0A7A63; --atn:#A2680A; --neg:#BE3049; --tfg:#000;
  --heroA:#6C3AD8; --heroB:#3E1F8E; --sh:0 1px 2px rgba(18,20,28,.05);
  --shf:0 -1px 0 var(--line), 0 -12px 28px -20px rgba(18,20,28,.28); }
html[data-tema="escuro"]{ --bg:#0E1014; --card:#171A20; --soft:#1F232B; --line:#262A33;
  --ink:#EFF1F5; --mute:#8D93A0; --faint:#6E7480; --ac:#B79BFF; --acsoft:#2A2544; --tfg:#fff;
  --pos:#5FCFAF; --atn:#E8B863; --neg:#FF9AA6;
  --heroA:#5A31B8; --heroB:#2C1663; --sh:0 1px 2px rgba(0,0,0,.4);
  --shf:0 -1px 0 var(--line), 0 -12px 28px -20px rgba(0,0,0,.8); }
html[data-tema="quente"]{ --bg:#232321; --card:#2E2E2C; --soft:#383836; --line:#403F3B;
  --ink:#F2F0EA; --mute:#A4A199; --faint:#87847C; --ac:#B79BFF; --acsoft:#3A3350; --tfg:#fff;
  --pos:#5FCFAF; --atn:#E8B863; --neg:#FF9AA6;
  --heroA:#5E33BE; --heroB:#33196F; --sh:0 1px 2px rgba(0,0,0,.22);
  --shf:0 -1px 0 var(--line), 0 -12px 28px -20px rgba(0,0,0,.6); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
button{font-family:inherit;cursor:pointer;font-size:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2.5px solid var(--ac);outline-offset:2px}

/* tinta de categoria: fundo com 16% da cor, letra com 60% */
.tinta{background:var(--soft);color:var(--ink);
       background:color-mix(in srgb, var(--c) 16%, var(--card));
       color:color-mix(in srgb, var(--c) 60%, var(--tfg))}

/* ---------- topo ---------- */
.top{padding:calc(10px + env(safe-area-inset-top)) var(--pad) 0}
.selrow{display:flex;gap:8px}
.selrow select{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--rs);padding:11px 34px 11px 13px;font-size:14.5px;font-weight:600;box-shadow:none;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.mesnav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rs);padding:4px}
.mesnav button{border:0;background:transparent;border-radius:9px;width:38px;height:38px;font-size:19px;color:var(--mute)}
.mesnav .m{flex:1;text-align:center;font-size:15.5px;font-weight:700;letter-spacing:-.02em}

/* ---------- herói: o único bloco com cor cheia ---------- */
.hero{margin:12px var(--pad) 0;border-radius:var(--rl);padding:20px;color:#fff;overflow:hidden;
  background:linear-gradient(158deg, var(--heroA) 0%, var(--heroB) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hero .lbl{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.66)}
.hero .big{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.05em;margin-top:6px}
.bar{display:flex;gap:3px;height:10px;margin-top:16px}
.bar>span{border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:13.5px;
  color:rgba(255,255,255,.66)}
.legend span{display:flex;align-items:center;gap:7px;min-width:0}
.legend em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{color:#fff;font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 auto}
.acerto{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);
  font-size:13.5px;color:rgba(255,255,255,.78)}
.acerto>div+div{margin-top:9px}
.acerto b{color:#fff}
.selos{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;
  border-radius:99px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.9);white-space:nowrap}
.hero .cardtag{background:rgba(255,255,255,.14);color:#fff}
.hero .mk{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}
.hero .mk[data-pago="1"]{background:rgba(255,255,255,.9);border-color:transparent;color:var(--heroB)}
/* rodapé de números do herói: substitui a faixa de cartõezinhos rolantes */
.hstats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px -20px -20px;
  border-top:1px solid rgba(255,255,255,.15)}
.hstats>div{padding:11px 8px 13px 14px;min-width:0}
.hstats>div+div{border-left:1px solid rgba(255,255,255,.15)}
.hstats b{display:block;font-size:15px;font-weight:700;letter-spacing:-.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstats i{font-style:normal;display:block;font-size:11.5px;margin-top:2px;color:rgba(255,255,255,.6);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* faixa de números fora do herói (usada nas folhas) */
.stats{display:flex;gap:8px;overflow-x:auto;padding:12px var(--pad) 2px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;background:var(--soft);border-radius:var(--rs);padding:10px 14px;min-width:100px}
.stat b{display:block;font-size:16px;font-weight:700;letter-spacing:-.04em}
.stat i{font-style:normal;font-size:11.5px;color:var(--mute)}

/* ---------- filtros e abas ---------- */
.fscroll{display:flex;gap:7px;overflow-x:auto;padding:12px var(--pad) 2px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:7px;
  min-height:38px}
.fchip[data-on="1"]{background:var(--acsoft);color:var(--ac);border-color:transparent;font-weight:700}
.fchip.tinta[data-on="1"]{background:var(--acsoft);color:var(--ac);border-color:transparent}
.fchip.tinta[data-on="1"]{background:color-mix(in srgb, var(--c) 20%, var(--card));
  color:color-mix(in srgb, var(--c) 62%, var(--tfg))}
.fchip select{border:0;background:transparent;padding:0;font:inherit;color:inherit;width:auto}
.stick{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px var(--pad) 8px;
  box-shadow:0 8px 10px -10px rgba(0,0,0,.14)}
.tog{display:flex;gap:2px;background:var(--soft);border-radius:14px;padding:3px}
.tog button{flex:1;border:0;background:transparent;padding:10px 2px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--mute)}
.tog button[data-on="1"]{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:700}
.check{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--mute);margin:12px 2px 14px}
.check input{width:21px;height:21px;margin:0;accent-color:var(--ac)}

.body{padding:0 var(--pad)}

/* ---------- painel: uma superfície agrupa uma lista ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:10px;box-shadow:none}
.rowtop{display:flex;gap:12px;align-items:flex-start}
.badge{width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:15.5px;font-weight:700;letter-spacing:-.02em;border:0;
  background:var(--soft);color:var(--ink);
  background:color-mix(in srgb, var(--c,#6B6F79) 16%, var(--card));
  color:color-mix(in srgb, var(--c,#6B6F79) 60%, var(--tfg))}
.nm{font-weight:600;font-size:16px;letter-spacing:-.02em;overflow-wrap:anywhere;background:none;border:0;
  padding:0;text-align:left;width:100%;line-height:1.3}
.val{font-weight:700;font-size:16px;white-space:nowrap;margin-left:auto;letter-spacing:-.04em}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.lnk{border:0;background:var(--soft);padding:5px 10px;border-radius:99px;font-size:12px;color:var(--mute);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 4px 5px 0;
  border-radius:99px;background:transparent;color:var(--mute);white-space:nowrap;border:0}
.cardtag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--soft);
  color:var(--mute);white-space:nowrap}

/* grupo de lançamentos: trilho colorido = de quem é */
.grp{position:relative;overflow:hidden;padding-left:17px}
.grp[data-exp="1"]{background:var(--soft);background:color-mix(in srgb, var(--soft) 60%, var(--card))}
.rail{position:absolute;left:0;top:0;bottom:0;width:4px;display:flex;flex-direction:column;gap:2px;padding:2px 0}
.rail span{flex:1;border-radius:99px}

/* pílulas de pessoa: cor cheia quando ligada — é a resposta do app */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:12px 8px;font-size:14px;
  font-weight:600;color:var(--mute);flex:1 1 0;min-width:74px;min-height:46px}
.chip[data-on="1"]{color:#fff;border-color:transparent;font-weight:700}
.editwrap{display:flex;gap:8px;align-items:center}
.editwrap input{flex:1;font-size:16px;font-weight:600;padding:11px;border:2px solid var(--ac);border-radius:var(--rs)}
.ok{background:var(--ac);color:#fff;border:0;border-radius:var(--rs);padding:13px 17px;font-weight:700}

.sub{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
.catsel{display:flex;align-items:center;gap:9px;margin:6px 0 4px}
.catsel span{font-size:12.5px;color:var(--mute);font-weight:600;flex:0 0 auto}
.catsel select{flex:1;padding:11px;border:1px solid var(--line);border-radius:var(--rs);font-size:14.5px;
  background:var(--soft);color:var(--ink)}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it2{display:block}
.itop{display:flex;align-items:center;gap:10px}
.it .t{flex:1;min-width:0}
.it .t button{display:block;font-size:14.5px;font-weight:600;background:none;border:0;padding:0;text-align:left;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t i{font-style:normal;font-size:12px;color:var(--mute)}
.it .t u{display:block;text-decoration:none;font-size:13px;color:var(--ink);opacity:.78;margin:1px 0 2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{width:30px;height:30px;border-radius:10px;flex:0 0 auto;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  background:var(--soft);color:var(--ink);
  background:color-mix(in srgb, var(--c,#6B6F79) 16%, var(--card));
  color:color-mix(in srgb, var(--c,#6B6F79) 60%, var(--tfg))}
.catbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;
  border-radius:99px;padding:9px 13px;font-size:13px;font-weight:600}
.catbtn i{width:11px;height:11px;border-radius:4px;display:inline-block;flex:0 0 auto}
.catopt{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.catopt+.catopt{border-top:1px solid var(--line)}
.catopt b{flex:1;font-size:15px;font-weight:600}
.mini{display:flex;gap:5px;flex-shrink:0}
.mini-full{margin-top:10px}
.mini button{min-width:46px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:transparent;
  color:var(--mute);font-size:12px;font-weight:700;padding:0 4px;overflow:hidden}
.mini-full button{flex:1;min-width:0}
.mini button[data-on="1"]{color:#fff;border-color:transparent}
.pct{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:11px 0 6px}
.pct>span{display:block;height:100%;background:var(--ac);border-radius:99px}

/* ---------- barra de abas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px;
  background:var(--card);background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(18px);box-shadow:var(--shf)}
.navb{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:11px;font-weight:600}
.navb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navb[data-on="1"]{color:var(--ac);font-weight:700}
.navb[data-on="1"] svg{stroke-width:2.2}

/* ---------- orçamento ---------- */
.lim{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 0;text-align:left}
.lim+.lim{border-top:1px solid var(--line)}
.lim .t{flex:1;min-width:0}
.lim .t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.lim .t i{font-style:normal;font-size:12.5px;color:var(--mute)}
.lim .track{height:8px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden;position:relative}
.lim .track span{display:block;height:100%;border-radius:99px;transition:width .3s}
.lim .v{text-align:right;flex:0 0 auto}
.lim .v b{display:block;font-size:14.5px;font-weight:700;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.lim .v i{font-style:normal;font-size:11.5px}
.orow{display:grid;grid-template-columns:38px 1fr 108px;gap:10px;align-items:center;padding:9px 0}
.orow+.orow{border-top:1px solid var(--line)}
.orow .n{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .g{font-size:11.5px;color:var(--mute)}
.orow input{padding:10px;font-size:14.5px;border-radius:10px;text-align:right;background:var(--soft)}

/* ---------- contas ---------- */
.conta{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 0;text-align:left}
.conta+.conta{border-top:1px solid var(--line)}
.conta .t{flex:1;min-width:0}
.conta .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.28}
.conta .t i{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta .v{text-align:right;flex:0 0 auto}
.conta .v b{display:block;font-size:15px;font-weight:700;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.mk{border:1.5px solid var(--line);background:transparent;border-radius:99px;width:34px;height:34px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute);padding:0}
.mk[data-pago="1"]{background:var(--pos);border-color:transparent;color:#fff}
html[data-tema="escuro"] .mk[data-pago="1"],html[data-tema="quente"] .mk[data-pago="1"]{color:#0E2A22}
@media (prefers-color-scheme: dark){ html:not([data-tema="claro"]) .mk[data-pago="1"]{color:#0E2A22} }
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:7px;
  vertical-align:1px}
.pg-vencida{background:#FCE4E7;color:#A32A3C} .pg-perto{background:#FBEEDA;color:#84570C}
.pg-paga{background:#DFF0EA;color:#0A6B55}
html[data-tema="escuro"] .pg-vencida,html[data-tema="quente"] .pg-vencida{background:#4A2226;color:#FFB6BE}
html[data-tema="escuro"] .pg-perto,html[data-tema="quente"] .pg-perto{background:#463619;color:#F5CE86}
html[data-tema="escuro"] .pg-paga,html[data-tema="quente"] .pg-paga{background:#1E4038;color:#8FE0C6}
@media (prefers-color-scheme: dark){
  html:not([data-tema="claro"]) .pg-vencida{background:#4A2226;color:#FFB6BE}
  html:not([data-tema="claro"]) .pg-perto{background:#463619;color:#F5CE86}
  html:not([data-tema="claro"]) .pg-paga{background:#1E4038;color:#8FE0C6}
}

/* ---------- resumo ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 9px}
.sec h2{margin:0}
.sec button{border:0;background:none;font-size:13px;font-weight:600;color:var(--ac);padding:4px 0}
.cbar{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.cbar+.cbar{border-top:1px solid var(--line)}
.cbar .t{flex:1;min-width:0}
.cbar .t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cbar .track{height:6px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden}
.cbar .track span{display:block;height:100%;border-radius:99px}
.cbar .v{text-align:right;flex:0 0 auto}
.cbar .v b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.04em}
.cbar .v i{font-style:normal;font-size:11.5px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pcard .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mute)}
.pcard .v{font-size:19px;font-weight:700;letter-spacing:-.045em;margin-top:8px}
.pcard .p{font-size:11.5px;color:var(--mute);margin-top:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .m{flex:1;font-size:14.5px;font-weight:600}
.mrow .c{font-size:12px;color:var(--mute);font-weight:500}
.cta{display:flex;gap:9px;margin-top:16px}
.cta button{flex:1;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:700;
  border:1px solid var(--line);background:var(--card)}
.cta button.pri{background:var(--ac);color:#fff;border-color:transparent}
html[data-tema="escuro"] .cta button.pri,html[data-tema="quente"] .cta button.pri{color:#1A1240}
@media (prefers-color-scheme: dark){ html:not([data-tema="claro"]) .cta button.pri{color:#1A1240} }

h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:24px 0 9px;font-weight:700}
h2:first-child{margin-top:8px}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--rs);font-size:16px;
  font-family:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:170px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;line-height:1.6}
.btn{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:15.5px;font-weight:700;margin-top:10px}
.btn.pri{background:var(--ac);color:#fff;border-color:transparent}
html[data-tema="escuro"] .btn.pri,html[data-tema="quente"] .btn.pri{color:#1A1240}
@media (prefers-color-scheme: dark){ html:not([data-tema="claro"]) .btn.pri{color:#1A1240} }
.btn.dgr{color:var(--neg);border-color:transparent;background:var(--soft)}
.mini2{border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 13px;font-size:12.5px;
  font-weight:600;color:var(--mute)}

/* ---------- folha ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,9,13,.55);display:flex;align-items:flex-end;
  backdrop-filter:blur(3px)}
.sheetbox{background:var(--bg);width:100%;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:10px var(--pad) calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px -30px rgba(0,0,0,.6)}
.sheetbox::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheetbox h3{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.035em}
.warn{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--atn);color:var(--ink);
  border-radius:var(--rs);padding:13px;font-size:13.5px;margin-bottom:12px;white-space:pre-wrap;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--soft);border-radius:18px;padding:5px}
.seg button{flex:1 1 44%;border:0;background:transparent;border-radius:14px;padding:13px 10px;
  font-size:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:9px;justify-content:flex-start}
.seg button[data-on="1"]{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:700}
.sw{width:19px;height:19px;border-radius:7px;flex:0 0 auto;border:1.5px solid rgba(128,128,128,.4)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--mute)}
.kv b{font-weight:700}
.pv{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px;margin-bottom:8px;
  display:grid;grid-template-columns:76px 1fr 90px 56px 40px;gap:6px;align-items:center}
.pv input{padding:9px;font-size:13.5px;border-radius:9px;background:var(--soft)}
.pv .desc{grid-column:1 / -1}
.empty{text-align:center;color:var(--mute);font-size:15px;padding:44px 18px;line-height:1.6}
.srch{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2}
.ajuda{font-size:13.5px;color:var(--mute);line-height:1.65;margin:14px 2px 4px}

/* ============================================================
   v4 — identidade de marca, parcelamento e layout de PC
   ============================================================ */

/* o .pin deixa de ser só a inicial da categoria: vira o avatar da marca.
   a categoria continua ali, como ponto de cor no canto — e o toque
   continua abrindo o seletor de categoria. */
.pin{position:relative;overflow:visible}
.pin svg{width:16px;height:16px;display:block;fill:currentColor;pointer-events:none}
/* MARCA: chip e glifo fixos. Nao acompanham tema claro/escuro —
   logo de marca que muda de cor deixa de ser logo de marca.
   O par foi escolhido por contraste: marca escura ganha chip branco;
   marca clara demais (amarelo do 99, verde do Spotify) inverte. */
.pin[data-mc]{background:var(--mc);color:var(--mg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
/* MONOGRAMA: nao e logo de ninguem, entao segue o tema e fica discreto */
.pin[data-mono]{background:color-mix(in srgb, var(--mn) 16%, var(--card));
                color:color-mix(in srgb, var(--mn) 62%, var(--tfg))}
.grp[data-exp="1"] .pin[data-mono]{background:color-mix(in srgb, var(--mn) 16%, var(--soft))}
.pin .cd{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:99px;
  background:var(--c,#6B6F7A);box-shadow:0 0 0 2px var(--card);pointer-events:none}
.grp[data-exp="1"] .pin .cd{box-shadow:0 0 0 2px color-mix(in srgb, var(--soft) 60%, var(--card))}

/* progresso do parcelamento */
.parc{display:flex;align-items:center;gap:7px;margin-top:5px}
.parc .tk{height:3px;width:56px;border-radius:99px;background:var(--soft);overflow:hidden;flex:0 0 auto}
.parc .tk i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .16s ease}
.parc em{font-style:normal;font-size:11px;color:var(--faint)}

/* movimento: 160ms, só em cor. nada de layout animado. */
.it,.card,.grp,.chip,.fchip,.navb,.pin,.mini button,.catopt{
  transition:background-color .16s ease,color .16s ease,border-color .16s ease}

/* foco de teclado (atalhos J/K no PC) */
.it[data-sel="1"]{background:var(--acsoft);border-radius:10px;
  box-shadow:0 0 0 2px var(--ac) inset;padding-left:8px;padding-right:8px}

/* ---------- layout de PC ---------- */
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:236px}
  #app{max-width:1060px;margin:0 auto;padding-bottom:72px}

  /* a barra de abas vira barra lateral */
  .nav{top:0;bottom:0;right:auto;width:236px;flex-direction:column;justify-content:flex-start;
    gap:3px;padding:22px 14px;background:var(--card);backdrop-filter:none;
    border-right:1px solid var(--line);box-shadow:none}
  .nav::before{content:"Divisor de Fatura";display:block;padding:0 10px 20px;
    font-size:15.5px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
  .navb{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;
    width:100%;padding:11px 10px;border-radius:11px;font-size:14.5px}
  .navb span{font-size:14.5px;font-weight:600}
  .navb:hover{background:var(--soft)}
  .navb[data-on="1"]{background:var(--acsoft)}

  /* mestre-detalhe: a folha encosta na direita em vez de subir de baixo */
  .sheet{align-items:stretch;justify-content:flex-end;background:rgba(8,9,13,.34)}
  .sheetbox{width:min(470px,44vw);height:100vh;max-height:100vh;border-radius:0;
    padding:26px 24px 44px;box-shadow:-24px 0 60px -42px rgba(0,0,0,.65)}
  .sheetbox::before{display:none}
  .sheetbox h3{font-size:23px}

  /* linhas mais densas: cabe mais fatura na tela */
  .it{padding:8px 0}
  .grp{padding-left:19px}
  .mini button{height:34px;min-width:42px}

  /* atalhos visíveis no rodapé da lateral */
  .nav::after{content:"J K mover · E editar · 1-9 pessoa · / buscar";
    margin-top:auto;padding:12px 10px 2px;font-size:11px;line-height:1.6;
    color:var(--faint);border-top:1px solid var(--line)}
}
@media (min-width:1024px) and (prefers-reduced-motion:no-preference){
  .sheetbox{animation:slidein .18s cubic-bezier(.4,0,.2,1)}
  @keyframes slidein{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
}

/* ---------- v4.8: calculadora de salário líquido ---------- */
.salgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.salgrid .um{grid-column:1 / -1}
/* largura fixa: sem isso a coluna de eventos engole as outras duas
   e o valor quebra em "R$" / "1.790,26" */
.saltab{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:4px}
.saltab th{font-size:10.5px;font-weight:600;color:var(--mute);text-align:right;
  padding:0 0 7px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em}
.saltab th:first-child{width:40%;text-align:left;padding-left:0}
.saltab th:nth-child(2),.saltab th:nth-child(3){width:30%}
.saltab td{padding:8px 0 8px 8px;border-bottom:1px solid var(--line);text-align:right;
  font-size:12.5px;white-space:nowrap}
.saltab td:first-child{text-align:left;padding-left:0;font-size:13.5px;white-space:normal}
.saltab td small{display:block;font-size:11px;color:var(--faint);margin-top:2px;white-space:normal}
.saltab tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.saltab td.zero{color:var(--faint)}
.salliq{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-top:14px;padding:13px;background:var(--acsoft);border-radius:var(--rs)}
.salliq span{font-size:14px;font-weight:700;min-width:0}
.salliq b{font-size:22px;letter-spacing:-.03em;white-space:nowrap}
.salnota{font-size:11.5px;color:var(--faint);margin:12px 2px 0;line-height:1.55}

/* ---------- v5: orçamento pessoal ---------- */
.segs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:0 var(--pad) 14px}
.segs button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-size:13.5px;
  font-weight:600;color:var(--mute);white-space:nowrap}
.segs button[data-on="1"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.fin{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.fin:last-child{border-bottom:0}
.fin .mk{flex:0 0 26px;width:26px;height:26px;border-radius:8px;font-size:13px}
.fin .c{flex:1;min-width:0}
.fin .c b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.fin .c i{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.fin .c u{display:block;text-decoration:none;font-size:11.5px;color:var(--faint);margin-top:3px}
.fin .v{flex:0 0 auto;text-align:right;font-size:14.5px;white-space:nowrap;padding-top:1px}
.fin.ok .c b,.fin.ok .v{text-decoration:line-through;opacity:.5}
.atraso{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;
  color:var(--rui);background:var(--ruisoft);border-radius:99px;padding:1px 7px;vertical-align:1px}
.linhas{margin:0 var(--pad)}
.linha{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.linha:last-child{border-bottom:0}
.linha span{font-size:14.5px;color:var(--mute)}
.linha b{font-size:15px;white-space:nowrap}
.linha.forte span{color:var(--ink);font-weight:600}
.pill{display:flex;align-items:center;gap:10px;width:100%;padding:12px 0;
  border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.pill:last-child{border-bottom:0}
.pill .n{flex:1;font-size:15px;font-weight:600}
.pill .a{font-size:15px;white-space:nowrap}
.pill .ch{color:var(--faint);font-size:18px;line-height:1}
.barra{margin-bottom:15px}
.barra:last-child{margin-bottom:0}
.barra .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.barra .h span{font-size:12.5px;color:var(--mute)}
.barra .h b{font-size:12.5px;white-space:nowrap}
.barra .t{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.barra .t i{display:block;height:100%;border-radius:99px;transition:width .25s ease,background-color .25s ease}
.barra .p{margin:6px 0 0;font-size:11.5px;color:var(--faint);line-height:1.45}
.linha small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px}

/* ============================================================
   Motor de identidade.
   REGRA DURA: nada aqui grava em l.g. As regras do usuário
   (S.regras / S.regrasCat) são indexadas pela string bruta —
   reescrevê-la deixaria todas elas órfãs. Nome limpo é derivado
   na hora de desenhar, e só quando uma marca casa de verdade.
   ============================================================ */
const ADQUIRENTE = /^(MP|MERPAGO|MERCPAGO|PAG|PAGS|PAGSEGURO|PP|EBW|EBANX|SUMUP|CIELO|STONE|GETNET|REDE|IUGU|ASAAS|ZOOP|VINDI|PJBANK|APPMAX|YAMPI|TON)\*+\s*/;
const MONO = ["#3F6DB5","#357A5B","#8A5A2B","#7A4A8C","#A34A4A","#2F7D86","#6B6F2B","#8C4A6B"];

function normMarca(s){
  return semAcento(String(s||"")).toUpperCase()
    .replace(/\s*\*\s*/g,"*").replace(/\s+/g," ").trim()
    .replace(/\s+(BR|BRA|BRASIL)$/,"").replace(/\s+\d{2,}$/,"");
}
function corMono(s){
  let h = 0; for (let k=0;k<s.length;k++) h = (h*31 + s.charCodeAt(k)) >>> 0;
  return MONO[h % MONO.length];
}
function iniciaisMarca(s){
  const w = String(s||"").trim().split(/\s+/).filter(x=>x.length>1);
  if (!w.length) return String(s||"?").slice(0,2).toUpperCase();
  return (w.length===1 ? w[0].slice(0,2) : w[0][0]+w[1][0]).toUpperCase();
}
function marcaDe(bruto){
  const chave = normMarca(bruto);
  const man = (S.marcas||{})[chave];
  if (man) return {nome:man.n, chip:man.b||"#FFFFFF", glifo:man.c||corMono(chave),
                   ic:man.i||null, via:null, chave, manual:true};
  let n = chave, via = null;
  let hit = MARCAS.find(([re]) => re.test(n));
  if (!hit){
    const m = n.match(ADQUIRENTE);
    if (m){ via = m[1]; n = n.slice(m[0].length).trim(); hit = MARCAS.find(([re]) => re.test(n)); }
  }
  if (hit) return {nome:hit[1], chip:hit[2], glifo:hit[3], ic:hit[4], via, chave, manual:false};
  return {nome:null, cru:n, via, chave, manual:false};
}
/* rotulo null = não mexe no nome que já está lá (respeita renomeações manuais)
   marca=true  -> chip e glifo FIXOS, iguais nos quatro temas
   marca=false -> monograma neutro, que acompanha o tema (não é logo de ninguém) */
function marcaVis(bruto){
  const m = marcaDe(bruto);
  const ic = m.ic && MARCA_SVG[m.ic] ? MARCA_SVG[m.ic] : null;
  if (m.nome) return {rotulo:m.nome, marca:true, chip:m.chip, glifo:m.glifo, svg:ic,
                      txt: ic ? null : iniciaisMarca(m.nome),
                      via:m.via, chave:m.chave, manual:m.manual};
  return {rotulo:null, marca:false, mono:corMono(m.chave), svg:null,
          txt:iniciaisMarca(m.cru||bruto), via:m.via, chave:m.chave, manual:false};
}
function estiloMarca(mv){
  return mv.marca ? `--mc:${mv.chip};--mg:${mv.glifo};` : `--mn:${mv.mono};`;
}
function avatarMarca(mv, cls){
  return `<span class="pin" data-${mv.marca?"mc":"mono"}="1" style="${estiloMarca(mv)}${cls||""}">${
    mv.svg ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${mv.svg}"/></svg>` : esc(mv.txt)}</span>`;
}
function blocoMarca(bruto){
  const mv = marcaVis(bruto);
  const nota = mv.manual ? "marca definida por você"
             : mv.rotulo ? "marca reconhecida automaticamente" : "sem marca — usando as iniciais";
  return `<div style="display:flex;align-items:center;gap:11px;background:var(--soft);
      border-radius:var(--rs);padding:11px;margin:0 0 12px">
    ${avatarMarca(mv,"width:34px;height:34px;font-size:13px")}
    <div style="flex:1;min-width:0">
      <b style="display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(mv.rotulo||bruto)}</b>
      <i style="font-style:normal;font-size:11.5px;color:var(--mute)">${nota}${mv.via?" · via "+mv.via:""}</i>
    </div>
    ${mv.manual ? `<button class="mini2" data-act="marcareset">Desfazer</button>`
                : `<button class="mini2" data-act="marcadef">Definir</button>`}
  </div>`;
}

/* "DD/MM" sem ano ordena errado como texto. Resolve o ano pela competência
   da fatura: mês maior que o da competência veio do ano anterior. */
function chaveDataRel(l, f){
  const s = String(l.d || "");
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{2})\/(\d{2})/);
  if (m && f && f.comp){
    const [ay, am] = f.comp.split("-").map(Number);
    const ano = Number(m[2]) > am ? ay - 1 : ay;
    return ano + "-" + m[2] + "-" + m[1];
  }
  return s;
}

function dadosRelatorio(pid, escopo){
  const fs = escopo === "todas" ? S.faturas : faturasAtivas();
  const blocos = []; let total = 0, n = 0;
  fs.forEach(f => {
    const itens = [];
    (f.lanc || []).forEach(l => {
      const a = alocDe(l.id).filter(id => pessoa(id));
      if (!a.includes(pid)) return;
      itens.push({l, v: l.v / a.length, div: a.length, k: chaveDataRel(l, f)});
    });
    if (!itens.length) return;
    itens.sort((x,y) => x.k < y.k ? -1 : x.k > y.k ? 1 : 0);
    const sub = itens.reduce((s,x) => s + x.v, 0);
    total += sub; n += itens.length;
    blocos.push({f, c: cartaoDe(f), itens, sub});
  });
  return {blocos, total, n};
}

function linhaRel(x){
  const l = x.l, mv = marcaVis(l.g);
  const parc = (l.p && l.p !== "estorno") ? l.p : "";
  const desc = [l.desc, x.div > 1 ? "dividido por " + x.div : ""].filter(Boolean).join(" · ");
  return '<div class="rel-l">' + avatarMarca(mv, "")
    + '<span class="rel-dt">' + esc(dia(l.d)) + '</span>'
    + '<span class="rel-es"><b>' + esc(mv.rotulo || l.r || l.g) + '</b>'
    + (desc ? '<i>' + esc(desc) + '</i>' : '') + '</span>'
    + (parc ? '<span class="rel-pc">' + esc(parc) + '</span>' : '')
    + '<span class="rel-vl">' + brl(x.v) + '</span></div>';
}

function corpoRelatorio(pid, escopo){
  const p = pessoa(pid), d = dadosRelatorio(pid, escopo);
  const mes = escopo === "todas" ? "Todas as faturas" : (S.rotuloAtivo || "Fatura");
  if (!d.n) return '<header class="rel-cap"><p class="rel-mes">' + esc(mes) + '</p><h1>'
    + esc(p ? p.nome : "") + '</h1></header><p class="rel-vazio">Nada alocado para essa pessoa.</p>';
  const cab = '<header class="rel-cap">'
    + '<p class="rel-mes">' + esc(mes) + '</p>'
    + '<h1>' + esc(p ? p.nome : "") + '</h1>'
    + '<p class="qt">' + d.n + (d.n === 1 ? " compra" : " compras")
    + (d.blocos.length > 1 ? " · " + d.blocos.length + " cartões" : "") + '</p>'
    + '<div class="rel-tot"><span>Total a pagar</span><b>' + brl(d.total) + '</b></div></header>';
  const corpo = d.blocos.map(b => {
    const pg = b.c && b.c.pagador ? pessoa(b.c.pagador) : null;
    return '<section class="rel-cart"><div class="rel-carth">'
      + '<b>' + esc(b.c ? b.c.nome : "Cartão")
      + (pg ? ' <em>· pago por ' + esc(pg.nome) + '</em>' : '') + '</b>'
      + '<span>' + brl(b.sub) + '</span></div>'
      + b.itens.map(linhaRel).join("") + '</section>';
  }).join("");
  const hoje = new Date();
  return cab + corpo + '<p class="rel-pe">Divisor de Fatura · gerado em '
    + fmtData(hoje) + "/" + hoje.getFullYear()
    + ' · valores já divididos entre quem participou de cada compra.</p>';
}

/* ============================================================
   v4.8 — salário líquido
   Tabelas oficiais de 2026. INSS: Portaria MPS/MF 13/2026.
   IRRF: tabela progressiva vigente desde mai/2025 + redutor da
   Lei 15.270/2025, que zera o imposto até R$ 5.000 e decresce
   até R$ 7.350. Conferem com a folha real de referência.
   ATUALIZAR TODO JANEIRO.
   ============================================================ */
const INSS_FAIXAS = [[1621.00,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]];
const IRRF_FAIXAS = [[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],
                     [4664.68,.225,675.49],[Infinity,.275,908.73]];
const IRRF_SIMPLIFICADO = 607.20;   // substitui as deduções legais quando compensa
const IRRF_REDUTOR_MAX  = 312.89;   // teto do redutor de 2026
const CEM = x => Math.round(x * 100) / 100;

function calcInss(base){
  let ant = 0, tot = 0; const faixas = [];
  for (const [lim, aliq] of INSS_FAIXAS){
    if (base <= ant) break;
    const parte = Math.min(base, lim) - ant;
    if (parte > 0.004){ tot += parte * aliq; faixas.push({ate:Math.min(base,lim), aliq, v:parte*aliq}); }
    ant = lim;
  }
  return {valor: CEM(tot), faixas};
}

function calcIrrf(tributavel, inssV){
  // a base usa o que for mais vantajoso: INSS real ou o desconto simplificado
  const abate = Math.max(inssV, IRRF_SIMPLIFICADO);
  const base = Math.max(0, tributavel - abate);
  const f = IRRF_FAIXAS.find(x => base <= x[0]);
  let imp = Math.max(0, base * f[1] - f[2]);
  let red = 0;
  if (tributavel <= 5000) red = Math.min(imp, IRRF_REDUTOR_MAX);
  else if (tributavel <= 7350) red = Math.max(0, 978.62 - 0.133145 * tributavel);
  return {valor: CEM(Math.max(0, imp - red)), base: CEM(base),
          aliq: f[1], simplificado: abate === IRRF_SIMPLIFICADO, redutor: CEM(Math.min(red, imp))};
}

function calcSalario(d){
  const horaNormal = d.bruto / 220;                 // jornada de 44h semanais
  const he = CEM(horaNormal * 1.5 * (d.he || 0));   // 50% de acréscimo, sem outros adicionais
  const vt = CEM((d.dias || 0) * (d.vtDia || 0));
  const va = CEM((d.dias || 0) * (d.vaDia || 0));
  const tributavel = CEM(d.bruto + he);             // VT e VA não entram: não são salário
  const i = calcInss(tributavel);
  const r = calcIrrf(tributavel, i.valor);
  const proventos = CEM(d.bruto + he + vt + va);
  const descontos = CEM(i.valor + r.valor + (d.vtDesc || 0) + (d.outros || 0));
  return {horaNormal:CEM(horaNormal), he, vt, va, tributavel, inss:i, irrf:r,
          proventos, descontos, liquido: CEM(proventos - descontos),
          vtTeto: CEM(d.bruto * 0.06)};
}

function tabelaSalario(d, c){
  const li = (nome, sub, pro, des, zero) =>
    `<tr><td>${nome}${sub?`<small>${sub}</small>`:""}</td>
      <td class="num${pro?"":" zero"}">${pro?brl(pro):"–"}</td>
      <td class="num${des?"":" zero"}">${des?brl(des):"–"}</td></tr>`;
  const detInss = c.inss.faixas.length
    ? c.inss.faixas.map(f => (f.aliq*100).toFixed(1).replace(".0","").replace(".",",")+"% até "+brl(f.ate)).join(" · ")
    : "";
  const alerta = (d.vtDesc > c.vt && c.vt > 0)
    ? `<p class="salnota">O desconto do VT está maior que o próprio VT (${brl(c.vt)}). Pela Lei 7.418/85 você paga o menor entre 6% do salário e o custo real do vale.</p>` : "";
  return `<table class="saltab">
    <thead><tr><th>Eventos</th><th>Proventos</th><th>Descontos</th></tr></thead>
    <tbody>
      ${li("Salário bruto", "", d.bruto, 0)}
      ${c.he ? li("Horas extras", (d.he||0).toLocaleString("pt-BR")+"h a 50% · hora normal "+brl(c.horaNormal), c.he, 0) : ""}
      ${c.vt ? li("Vale-transporte", (d.dias||0)+" dias × "+brl(d.vtDia), c.vt, 0) : ""}
      ${c.va ? li("Vale-alimentação", (d.dias||0)+" dias × "+brl(d.vaDia), c.va, 0) : ""}
      ${li("INSS", detInss, 0, c.inss.valor)}
      ${li("IRRF", c.irrf.valor ? "base "+brl(c.irrf.base) : (c.irrf.redutor ? "zerado pelo redutor de 2026" : "isento na faixa"), 0, c.irrf.valor)}
      ${d.vtDesc ? li("Desconto do VT", "6% sobre o salário bruto", 0, d.vtDesc) : ""}
      ${d.outros ? li("Outros descontos", "", 0, d.outros) : ""}
      <tr class="tot"><td>Totais</td><td class="num">${brl(c.proventos)}</td><td class="num">${brl(c.descontos)}</td></tr>
    </tbody></table>
    <div class="salliq"><span>Salário líquido</span><b class="num">${brl(c.liquido)}</b></div>
    ${alerta}
    <p class="salnota">INSS pela tabela de 2026 (teto ${brl(8475.55)}). IRRF pela tabela progressiva com desconto simplificado de ${brl(IRRF_SIMPLIFICADO)} e o redutor da Lei 15.270/2025. VT e VA não entram na base do INSS nem do IRRF. Hora extra calculada sobre 220h mensais, sem reflexo de DSR.</p>`;
}

function lerSalario(){
  const g = id => { const e = document.getElementById(id); return e ? num(e.value) : NaN; };
  const ok = v => (isFinite(v) ? v : 0);
  return {bruto:ok(g("sal_bruto")), dias:Math.max(0,Math.round(ok(g("sal_dias")))),
          vtDia:ok(g("sal_vtdia")), vaDia:ok(g("sal_vadia")), he:ok(g("sal_he")),
          vtDesc:ok(g("sal_vtdesc")), outros:ok(g("sal_outros"))};
}

/* recalcula sem re-renderizar a folha: re-render perderia o cursor a cada tecla */
function recalcSalario(alvo){
  const d = lerSalario();
  if (alvo && alvo.id === "sal_bruto"){          // o 6% acompanha o bruto
    const e = document.getElementById("sal_vtdesc");
    if (e){ d.vtDesc = CEM(d.bruto * 0.06); e.value = d.vtDesc.toFixed(2).replace(".", ","); }
  }
  const res = document.getElementById("sal_res");
  if (res) res.innerHTML = tabelaSalario(d, calcSalario(d));
  S.salario = d; salvar();
}

/* migração: garante campos novos sem perder nada do que já existe.
   Chamada no fim do arquivo, quando todos os utilitários já existem. */
function migrar(){
  let mudou = false, mudouEscopo = false;
  S.contas = S.contas || [];
  S.pagos = S.pagos || {};
  S.fatPagas = S.fatPagas || {};
  S.orcamento = S.orcamento || {base:"eu", totais:{}, limites:{}};
  if (!S.orcamento.totais){            // formato antigo: um total e tetos únicos
    S.orcamento = {base: S.orcamento.base || "eu",
                   totais: {todos: S.orcamento.total || 0},
                   limites: {todos: S.orcamento.limites || {}}};
    mudouEscopo = true;
  }
  S.acertos = S.acertos || {};
  S.acertos = S.acertos || {};
  if (!S.mesContas){ const d=new Date();
    S.mesContas = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); mudouEscopo = true; }
  S.regrasCat = S.regrasCat || {};
  S.regras = S.regras || {};
  S.marcas = S.marcas || {};
  S.receitas  = S.receitas  || [];
  S.previstas = S.previstas || [];
  S.naoprev   = S.naoprev   || [];
  S.marcados  = S.marcados  || {};   // "<id>|<AAAA-MM>" -> recebido/pago
  // itens criados antes do versionamento passam a valer desde o mês corrente
  [S.receitas, S.previstas, S.naoprev].forEach(L =>
    L.forEach(x => { if (x.desde === undefined) x.desde = S.mesContas || hojeISO().slice(0,7);
                     if (x.ate === undefined) x.ate = null; }));
  S.salario = S.salario || {bruto:1790.26, dias:0, vtDia:0, vaDia:0, he:0, vtDesc:107.42, outros:0};
  S.aloc = S.aloc || {};
  if (!S.cats || !S.cats.length) S.cats = DEFAULT_CATS.slice();
  if (!S.rotuloAtivo || !S.cartaoAtivo){
    const f0 = S.faturas.find(f=>f.id===S.ativa) || S.faturas[0];
    S.rotuloAtivo = f0 ? f0.rotulo : "";
    S.cartaoAtivo = f0 ? f0.cartaoId : (S.cartoes[0]||{}).id;
    mudouEscopo = true;
  }
  // rótulos manuais viram competência ("Julho/26" -> "2026-07")
  (S.faturas||[]).forEach(f => {
    if (!f.comp){ const c = compDeRotulo(f.rotulo); if (c){ f.comp = c; mudouEscopo = true; } }
    if (f.comp) f.rotulo = compLabel(f.comp);
  });
  // cria a fatura do mês corrente para cada cartão que tem dia de fechamento
  (S.cartoes||[]).forEach(c => {
    if (!c.fechamento) return;
    const comp = compAtual(c);
    if (!S.faturas.some(f => f.cartaoId===c.id && f.comp===comp)){
      S.faturas.push({id:uid("f"), cartaoId:c.id, comp, rotulo:compLabel(comp), lanc:[]});
      mudouEscopo = true;
    }
  });
  // taxonomia nova: recategoriza tudo, menos o que foi ajustado à mão
  if (S.catv !== 2){
    (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
      l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||""));
    }));
    S.catv = 2; mudou = true;
  }
  (S.faturas||[]).forEach(f => (f.lanc||[]).forEach(l => {
    if (!l.cat){ l.cat = S.regrasCat[l.g] || categorizar(l.g + " " + (l.r||"")); mudou = true; }
    if (!S.cats.includes(l.cat)){ S.cats.push(l.cat); mudou = true; }
  }));
  if (mudou || mudouEscopo || !DB.read()) DB.write(S);
}

/* ================= utilidades ================= */
const brl = n => (n<0?"−R$ ":"R$ ") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dia = s => /^\d{4}-/.test(s) ? s.slice(8,10)+"/"+s.slice(5,7) : s;

/* As datas chegam da importação como "DD/MM" (sem ano), então comparar como texto
   ordenava pelo dia do mês: 01/08 vinha antes de 24/07. Aqui montamos uma chave
   AAAA-MM-DD de verdade, deduzindo o ano pela competência da fatura — uma compra
   de dezembro numa fatura de janeiro pertence ao ano anterior. */
function chaveData(l){
  const s = String((l && l.d) || "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return "9999-99-99";                    // sem data reconhecível vai para o fim
  const dd = m[1].padStart(2,"0"), mm = m[2].padStart(2,"0");
  if (m[3]) return (m[3].length===2 ? "20"+m[3] : m[3]) + "-" + mm + "-" + dd;
  const comp = (l && l._f && l._f.comp) || (l && l._comp) || "";
  if (/^\d{4}-\d{2}$/.test(comp)){
    const ca = +comp.slice(0,4), cm = +comp.slice(5,7);
    return String(+mm > cm ? ca - 1 : ca) + "-" + mm + "-" + dd;
  }
  return "0000-" + mm + "-" + dd;
}
const dataLonga = l => { const k = chaveData(l);
  return /^\d{4}-\d{2}-\d{2}$/.test(k) && !k.startsWith("0000") && !k.startsWith("9999")
    ? k.slice(8,10)+"/"+k.slice(5,7)+"/"+k.slice(0,4) : dia(l && l.d); };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pessoa = id => S.pessoas.find(p=>p.id===id);
const MESES_NOME = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const diasNoMes = (a,m) => new Date(a, m, 0).getDate();
const compSoma = (comp, n) => {
  let [a,m] = comp.split("-").map(Number);
  const t = (a*12 + (m-1)) + n;
  return Math.floor(t/12) + "-" + String(t%12 + 1).padStart(2,"0");
};
const compLabel = comp => {
  const [a,m] = comp.split("-").map(Number);
  return MESES_NOME[m-1] + "/" + String(a).slice(2);
};
function compDeRotulo(r){
  const m = String(r||"").match(/^([a-zç]+)\s*\/\s*(\d{2,4})$/i);
  if (!m) return null;
  const i = MESES_NOME.findIndex(x => semAcento(x) === semAcento(m[1]));
  if (i < 0) return null;
  const a = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
  return a + "-" + String(i+1).padStart(2,"0");
}
function compAtual(c){
  const h = new Date();
  let a = h.getFullYear(), m = h.getMonth()+1;
  if (c && c.fechamento && h.getDate() > c.fechamento){ m++; if (m>12){ m=1; a++; } }
  return a + "-" + String(m).padStart(2,"0");
}
const fmtData = d => String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
function statusFatura(c, comp){
  if (!c || !c.fechamento || !comp) return null;
  const [a,m] = comp.split("-").map(Number);
  const fech = new Date(a, m-1, Math.min(c.fechamento, diasNoMes(a,m)));
  let venc = null;
  if (c.vencimento){
    let va=a, vm=m;
    if (c.vencimento <= c.fechamento){ vm++; if (vm>12){ vm=1; va++; } }
    venc = new Date(va, vm-1, Math.min(c.vencimento, diasNoMes(va,vm)));
  }
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (hoje < fech) return {e:"aberta", t:"em aberto · fecha " + fmtData(fech)};
  if (venc){
    const dias = Math.round((venc - hoje)/86400000);
    if (dias > 0) return {e:"fechada", t:"fechada · vence em " + dias + (dias===1?" dia":" dias")};
    if (dias === 0) return {e:"vence", t:"vence hoje"};
    return {e:"vencida", t:"venceu em " + fmtData(venc)};
  }
  return {e:"fechada", t:"fechada em " + fmtData(fech)};
}

/* --------- parcelas futuras --------- */
// duas linhas são a mesma parcela da mesma compra?
// estabelecimento + número da parcela + data da compra original.
// Sem data dos dois lados, cai para o valor (tolerância de 2 centavos).
function mesmaParcela(a, b){
  if (semAcento(a.g || "") !== semAcento(b.g || "")) return false;
  if (String(a.p || "") !== String(b.p || "")) return false;
  const da = String(a.d || ""), db = String(b.d || "");
  if (da && db) return da === db;
  return Math.abs((+a.v || 0) - (+b.v || 0)) < 0.02;
}

function parcelaInfo(p){
  const m = String(p||"").match(/^(\d+)\s*\/\s*(\d+)$/);
  if (!m) return null;
  const k = +m[1], n = +m[2];
  return (n > 1 && k >= 1 && k <= n) ? {k, n} : null;
}
// gera as parcelas seguintes de um lançamento nas competências futuras do mesmo cartão
function propagar(l, f){
  const pi = parcelaInfo(l.p);
  if (!pi || !f.comp || pi.k >= pi.n) return 0;
  const serie = l.serie || uid("sr");
  l.serie = serie;
  let n = 0;
  for (let i = pi.k + 1; i <= pi.n; i++){
    const comp = compSoma(f.comp, i - pi.k);
    const alvo = garantirFatura(f.cartaoId, comp);
    const rot = i+"/"+pi.n;
    const nova = {g:l.g, p:rot, d:l.d, v:l.v};
    const jaTem = S.faturas.some(x => x.cartaoId === f.cartaoId &&
      x.lanc.some(y => y.serie === serie ? y.p === rot : mesmaParcela(y, nova)));
    if (jaTem) continue;
    const id = uid("l");
    alvo.lanc.push({id, d:l.d, r:l.r, g:l.g, v:l.v, p:i+"/"+pi.n, cat:l.cat, desc:l.desc||"", serie, auto:true});
    const a = alocDe(l.id);
    if (a.length) S.aloc[id] = a.slice();
    else if (S.regras[l.g]) S.aloc[id] = S.regras[l.g].slice();
    n++;
  }
  return n;
}
function previsaoParcelas(){   // quantas seriam geradas, sem gerar
  let n = 0, v = 0;
  S.faturas.forEach(f => f.lanc.forEach(l => {
    const pi = parcelaInfo(l.p);
    if (!pi || !f.comp || l.auto) return;
    for (let i = pi.k+1; i <= pi.n; i++){
      const comp = compSoma(f.comp, i - pi.k);
      const alvo = S.faturas.find(x => x.cartaoId===f.cartaoId && x.comp===comp);
      if (alvo && alvo.lanc.some(x => x.serie && x.serie===l.serie && x.p === i+"/"+pi.n)) continue;
      n++; v += l.v;
    }
  }));
  return {n, v};
}
// remove as parcelas previstas de um cartão e as faturas que ficarem vazias
function limparAuto(cartaoId, manter){
  S.faturas.filter(f=>f.cartaoId===cartaoId).forEach(f=>{
    f.lanc.filter(l=>l.auto).forEach(l=>delete S.aloc[l.id]);
    f.lanc = f.lanc.filter(l=>!l.auto);
  });
  const c = S.cartoes.find(x=>x.id===cartaoId);
  const atual = c && c.fechamento ? compAtual(c) : null;
  S.faturas = S.faturas.filter(f =>
    f.cartaoId!==cartaoId || f.lanc.length || f.id===manter || f.comp===atual);

// compras estornadas que ainda têm parcelas previstas rodando
function estornosPendentes(){
  const res = [];
  S.faturas.forEach(f => f.lanc.forEach(l => {
    if (l.v >= 0) return;
    const chave = semAcento(l.g);
    const futuras = [];
    S.faturas.filter(x => x.cartaoId === f.cartaoId).forEach(x => x.lanc.forEach(y => {
      if (y.auto && semAcento(y.g) === chave) futuras.push({l:y, rot:x.rotulo, comp:x.comp||""});
    }));
    if (!futuras.length) return;
    const existe = res.find(r => r.chave === chave && r.cartaoId === f.cartaoId);
    if (existe){ existe.estorno += l.v; return; }
    res.push({chave, nome:l.g, cartaoId:f.cartaoId, cartao:nomeCartao(f), estorno:l.v,
              futuras: futuras.sort((a,b)=>a.comp<b.comp?-1:1)});
  }));
  res.forEach(r => r.somaFuturas = r.futuras.reduce((a,x)=>a+x.l.v, 0));

}

const chavePg = (id, m) => id + ":" + m;
const hojeISO = () => { const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };

function vencDe(c, m){
  if (c.tipo === "avulsa") return c.data || (m + "-01");
  const [a, mm] = m.split("-").map(Number);
  return m + "-" + String(Math.min(c.dia || 1, diasNoMes(a, mm))).padStart(2, "0");

function contasDoMes(m){
  return S.contas.filter(c => {
    if (c.tipo === "avulsa") return String(c.data||"").slice(0,7) === m;

  }).sort((a,b) => a.venc < b.venc ? -1 : (a.venc > b.venc ? 1 : 0));

function resumoContas(m){

function togglePessoa(ids, pid, chaveRegra){

  const f = fatura();
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === velho) l.g = novo; }));
  if (S.regras[velho]){ S.regras[novo] = S.regras[velho]; delete S.regras[velho]; }
  if (S.regrasCat[velho]){ S.regrasCat[novo] = S.regrasCat[velho]; delete S.regrasCat[velho]; }
  if (UI.aberto === velho) UI.aberto = novo;
  salvar();
}
function renomearItem(id, novo){
  novo = (novo||"").trim(); if (!novo) return;
  const f = fatura();
  const l = f.lanc.find(x=>x.id===id);
  if (!l) return;
  l.g = novo;
  if (S.regrasCat[novo]) l.cat = S.regrasCat[novo];
  salvar();
}
function mudarCategoria(grupo, cat){
  S.faturas.forEach(x => x.lanc.forEach(l => { if (l.g === grupo) l.cat = cat; }));
  S.regrasCat[grupo] = cat;
  salvar(); render();
}

const VERSAO = "5.3";
const TEMAS = [
  ["auto",   "Automático",    "linear-gradient(135deg,#F0F1F6 50%,#262624 50%)"],

const CORBARRA = {claro:"#F2F3F7", escuro:"#0E1014", quente:"#232321"};
function aplicarTema(){
  const t = (S && S.tema) || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", t);
  const sis = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const efetivo = t === "auto" ? (sis ? "quente" : "claro") : t;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", CORBARRA[efetivo] || "#F2F3F7");
}

function render(){
  aplicarTema();
  const y = window.scrollY;
  const PAGINAS = {inicio:viewResumo, receita:viewReceita, despesas:viewDespesas, lista:viewLista,
                   contas:viewContas, orcamento:viewOrcamento, config:viewConfig};

  document.getElementById("modal").innerHTML = UI.sheet ? sheets[UI.sheet]() : "";

function hstats(items){
  const l = items.filter(Boolean).slice(0,3);
  if (!l.length) return "";
  return `<div class="hstats">${l.map(s=>
    `<div><b class="num">${esc(s.b)}</b><i>${esc(s.i)}</i></div>`).join("")}</div>`;
}

function previstoFuturo(){
  const hoje = S.rotuloAtivo;
  let n = 0, v = 0;
  S.faturas.filter(f => (S.cartaoAtivo==="todos" || f.cartaoId===S.cartaoAtivo) && f.rotulo!==hoje)
    .forEach(f => f.lanc.forEach(l => { if (l.auto){ n++; v += l.v; } }));
  return {n, v};
}

function agrupar(L, chave){
  const m = {};
  L.forEach(l=>{ const k = chave(l); (m[k] = m[k] || {k, itens:[], total:0}); m[k].itens.push(l); m[k].total += l.v; });
  return Object.values(m).map(g=>{
    const set = new Set(g.itens.map(i=>JSON.stringify([...alocDe(i.id)].sort())));
    g.misto = set.size > 1;
    g.aloc = g.misto ? [] : alocDe(g.itens[0].id);
    return g;
  }).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
}

const ORDENS = [["data-desc","Mais recentes"],["data-asc","Mais antigos"],
                ["valor-desc","Maior valor"],["valor-asc","Menor valor"],
                ["nome","Nome A–Z"]];
function ordenar(L){
  const o = UI.ordem || "data-desc";
  const c = [...L];
  const cmp = (a,b) => { const x = chaveData(a), y = chaveData(b);
    return x < y ? -1 : (x > y ? 1 : 0); };
  if (o === "data-asc")   c.sort(cmp);
  else if (o === "valor-desc") c.sort((a,b)=> Math.abs(b.v)-Math.abs(a.v));
  else if (o === "valor-asc")  c.sort((a,b)=> Math.abs(a.v)-Math.abs(b.v));
  else if (o === "nome")  c.sort((a,b)=> a.g.localeCompare(b.g, "pt-BR", {sensitivity:"base"}));
  else c.sort((a,b)=> cmp(b,a));
  return c;
}

/* mesma ordem aplicada a grupos: pela data da compra mais recente (ou mais antiga) do grupo */
function ordenarGrupos(gs){
  const o = UI.ordem || "data-desc";
  const c = [...gs];
  const chaves = g => g.itens.map(chaveData).filter(k=>k<"9999");
  const maxK = g => { const k = chaves(g); return k.length ? k.reduce((a,b)=>a>b?a:b) : "0000-00-00"; };
  const minK = g => { const k = chaves(g); return k.length ? k.reduce((a,b)=>a<b?a:b) : "9999-99-99"; };
  if (o === "data-asc")   c.sort((a,b)=> minK(a)<minK(b)?-1:(minK(a)>minK(b)?1:0));
  else if (o === "data-desc") c.sort((a,b)=> maxK(a)>maxK(b)?-1:(maxK(a)<maxK(b)?1:0));
  else if (o === "valor-asc") c.sort((a,b)=> Math.abs(a.total)-Math.abs(b.total));
  else if (o === "nome")  c.sort((a,b)=> String(a.k).localeCompare(String(b.k), "pt-BR", {sensitivity:"base"}));
  else c.sort((a,b)=> Math.abs(b.total)-Math.abs(a.total));
  return c;
}

    ${AVISO_STORAGE?`<div class="warn">${esc(AVISO_STORAGE)}</div>`:""}

        e voltam prontas nas próximas faturas.</p>`:""}

  </div>` + navbar();
}

function faturasDoMes(m){
  return S.faturas.filter(f => f.comp ? f.comp === m : f.rotulo === compLabel(m));

function itensDoMes(m){
  const out = [];
  faturasDoMes(m).forEach(f => f.lanc.forEach(l => out.push({
    id:l.id, g:l.g, cat:l.cat||"Outros", v:l.v, aloc:alocDe(l.id).filter(id=>pessoa(id)),
    fonte:"cartao", fonteId:f.cartaoId, onde:nomeCartao(f), d:l.d, p:l.p, auto:l.auto
  })));
  contasDoMes(m).forEach(x => out.push({
    id:x.c.id, g:x.c.nome, cat:x.c.cat||"Boletos", v:x.valor,
    aloc:(x.c.pessoas||[]).filter(id=>pessoa(id)),
    fonte:"conta", fonteId:"contas", onde:x.pago?"conta paga":"conta em aberto", d:x.venc, p:null, pago:x.pago
  }));
  return out;
}
const chaveAcerto = (m, devedor, credor) => m + ":" + devedor + ">" + credor;
const quitacao = (m, devedor, credor) => S.acertos[chaveAcerto(m, devedor, credor)] || null;

function reduzirDev(dev, m){
  const eu = S.euId; let pago = 0, receber = 0; const linhas = [];
  Object.entries(dev).forEach(([pag, quem]) => {
    Object.entries(quem).forEach(([id, v]) => {
      if (pag !== eu && id !== eu) return;              // só o que envolve você
      const q = m ? quitacao(m, id, pag) : null;
      const quitado = !!(q && q.pago);
      const recebe = pag === eu;
      if (!quitado){ if (recebe) receber += v; else pago += v; }
      linhas.push({
        txt: recebe ? (pessoa(id)?curtoNome(pessoa(id).nome):"?") + " te deve"
                    : "você paga a " + (pessoa(pag)?curtoNome(pessoa(pag).nome):"?"),
        v, quitado, quando: q ? q.quando : null, valorPago: q ? q.valor : null,
        chave: m ? chaveAcerto(m, id, pag) : null, recebe
      });
    });
  });
  linhas.sort((a,b)=> (a.quitado?1:0)-(b.quitado?1:0) || Math.abs(b.v)-Math.abs(a.v));
  const aberto = linhas.filter(l => !l.quitado);
  return {pago, receber, liquido: pago - receber, linhas,
          nAbertos: aberto.length,
          liquidoAberto: aberto.filter(l=>!l.recebe).reduce((a,l)=>a+l.v,0)
                       - aberto.filter(l=>l.recebe).reduce((a,l)=>a+l.v,0)};
}
function acertoMes(m){
  const dev = {};
  const somar = (pag, a, v) => { if (!pag || !a.length) return;
    a.forEach(id => { if (id === pag) return;
      dev[pag] = dev[pag] || {}; dev[pag][id] = (dev[pag][id]||0) + v/a.length; }); };
  faturasDoMes(m).forEach(f => {
    const c = S.cartoes.find(x => x.id === f.cartaoId); if (!c) return;
    f.lanc.forEach(l => somar(c.pagador, alocDe(l.id).filter(id=>pessoa(id)), l.v));
  });
  contasDoMes(m).forEach(x => somar(x.c.pagador, (x.c.pessoas||[]).filter(id=>pessoa(id)), x.valor));
  return reduzirDev(dev, m);
}
function totaisMes(m){
  const t = {porPessoa:{}, total:0, cartoes:0, contas:0, pend:0, nPend:0};
  S.pessoas.forEach(p => t.porPessoa[p.id] = 0);
  itensDoMes(m).forEach(it => {
    t.total += it.v;
    t[it.fonte === "conta" ? "contas" : "cartoes"] += it.v;
    if (!it.aloc.length){ t.pend += it.v; t.nPend++; return; }
    it.aloc.forEach(id => t.porPessoa[id] += it.v / it.aloc.length);
  });
  return t;
}

function dataVenc(c, comp){
  if (!c || !c.vencimento || !comp) return null;
  const [a, m] = comp.split("-").map(Number);
  let va = a, vm = m;
  if (c.fechamento && c.vencimento <= c.fechamento){ vm++; if (vm > 12){ vm = 1; va++; } }
  return va + "-" + String(vm).padStart(2,"0") + "-" + String(Math.min(c.vencimento, diasNoMes(va, vm))).padStart(2,"0");
}
function faturasAPagar(m){
  return faturasDoMes(m).filter(f => f.lanc.length).map(f => {
    const c = S.cartoes.find(x => x.id === f.cartaoId);
    const pg = S.fatPagas[f.id];
    const venc = dataVenc(c, f.comp);
    const dias = venc ? Math.round((new Date(venc+"T00:00") - new Date(hojeISO()+"T00:00"))/86400000) : null;
    const total = f.lanc.reduce((a,l)=>a+l.v, 0);
    return {f, c, venc, dias, total, valor: pg && pg.valor != null ? pg.valor : total,
            pago: !!(pg && pg.pago), quando: pg ? pg.quando : null,
            estado: (pg && pg.pago) ? "paga" : (dias == null ? "aberta" : (dias < 0 ? "vencida" : (dias <= 7 ? "perto" : "aberta")))};
  }).sort((a,b) => String(a.venc) < String(b.venc) ? -1 : 1);
}
function resumoPagar(m){
  const rc = resumoContas(m), fs = faturasAPagar(m);
  const fTot = fs.reduce((a,x)=>a+x.valor,0);
  const fPago = fs.filter(x=>x.pago).reduce((a,x)=>a+x.valor,0);
  return {contas:rc, faturas:fs,
          total: rc.total + fTot, pago: rc.pago + fPago, aberto: (rc.total - rc.pago) + (fTot - fPago),
          nVencidas: rc.nVencidas + fs.filter(x=>x.estado==="vencida").length,
          nItens: rc.lista.length + fs.length,
          nPagos: rc.lista.filter(x=>x.pago).length + fs.filter(x=>x.pago).length};
}

/* --------- orçamento --------- */
const tetosDe = f => (S.orcamento.limites || {})[f] || {};
const totalDe  = f => ((S.orcamento.totais || {})[f]) || 0;

function gastoOrcamento(m, forcarFonte){
  const o = S.orcamento, soMeu = o.base !== "tudo";
  const fonte = forcarFonte || S.fonteOrc || "todos";
  const porCat = {}, porFonte = {}; let total = 0, semDono = 0, nSemDono = 0;
  itensDoMes(m).forEach(it => {
    if (fonte !== "todos" && it.fonteId !== fonte) return;
    let v;
    if (soMeu){
      if (!it.aloc.length){ semDono += it.v; nSemDono++; return; }
      if (!it.aloc.includes(S.euId)) return;
      v = it.v / it.aloc.length;
    } else v = it.v;
    porCat[it.cat] = (porCat[it.cat] || 0) + v;
    porFonte[it.onde] = (porFonte[it.onde] || 0) + v;
    total += v;
  });
  const limites = tetosDe(fonte);
  const monitoradas = Object.keys(limites).filter(c => limites[c] > 0)
    .map(c => { const g = porCat[c] || 0, lim = limites[c];
      return {cat:c, gasto:g, limite:lim, sobra:lim - g, pct: lim ? g/lim*100 : 0}; })
    .sort((a,b) => b.pct - a.pct);
  const fora = Object.entries(porCat).filter(([c]) => !(limites[c] > 0))
    .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
  const somaLimites = monitoradas.reduce((a,x) => a + x.limite, 0);
  const alvo = totalDe(fonte);
  return {porCat, porFonte, fonte, total, semDono, nSemDono, monitoradas, fora, somaLimites,
          alvo, temAlvo: alvo > 0,
          sobraTotal: alvo - total,
          naoDistribuido: alvo - somaLimites};
}
const nomeOrigem = f => f === "todos" ? "Tudo"
  : (f === "contas" ? "Contas" : ((S.cartoes.find(c=>c.id===f)||{}).nome || "—"));
const CORLIM = p => p >= 100 ? "var(--neg)" : (p >= 80 ? "var(--atn)" : "var(--pos)");

const sheets = {};

/* ============================================================
   v5.0 — orçamento pessoal
   Receitas, despesas fixas, gastos previstos e não previstos.
   O módulo de cartões continua intacto por baixo: "Fixas" usa
   o mesmo S.contas de antes, então nada é redigitado.
   ============================================================ */
const LISTAS = {
  receita:  {chave:"receitas",  titulo:"Receita",      rot:"Fonte da receita", verbo:"receber"},
  prevista: {chave:"previstas", titulo:"Gasto previsto",     rot:"Fonte do gasto", verbo:"pagar"},
  naoprev:  {chave:"naoprev",   titulo:"Gasto não previsto", rot:"Fonte do gasto", verbo:"pagar"}
};
const listaDe = k => S[LISTAS[k].chave] || (S[LISTAS[k].chave] = []);
const marcaChave = (id, m) => id + "|" + m;
const estaMarcado = (id, m) => !!S.marcados[marcaChave(id, m)];

/* quando: {modo:"dia"|"data"|"sem", dia:1-31, data:"AAAA-MM-DD"} */
function quandoTexto(q){
  if (!q || q.modo === "sem") return "sem data definida";
  if (q.modo === "dia") return "dia " + q.dia + " de todo mês";
  return q.data ? dia(q.data) + "/" + q.data.slice(0,4) : "sem data definida";
}
function quandoNoMes(q, m){
  if (!q) return null;
  if (q.modo === "dia"){
    const [a, mes] = m.split("-").map(Number);
    return m + "-" + String(Math.min(q.dia || 1, diasNoMes(a, mes))).padStart(2, "0");
  }
  if (q.modo === "data" && q.data) return q.data;
  return null;
}
function diasAtraso(q, m, marcado){
  if (marcado) return 0;
  const d = quandoNoMes(q, m); if (!d) return 0;
  const n = Math.round((new Date(hojeISO()+"T00:00") - new Date(d+"T00:00")) / 86400000);
  return n > 0 ? n : 0;
}
function nomeFonte(f){
  if (!f) return "";
  if (f.startsWith("rec:")){ const r = (S.receitas||[]).find(x=>x.id===f.slice(4)); return r ? r.fonte : ""; }
  if (f.startsWith("cart:")){ const c = S.cartoes.find(x=>x.id===f.slice(5)); return c ? c.nome : ""; }
  return "";
}
const fonteEhCartao = f => !!f && f.startsWith("cart:");

/* ---------- os números do Resumo ---------- */
function panorama(m){
  const rec  = doMes(S.receitas, m).reduce((s,r)=>s+(r.valor||0), 0);
  const recOk = doMes(S.receitas, m).filter(r=>estaMarcado(r.id,m)).reduce((s,r)=>s+(r.valor||0), 0);
  const cheia = arr => arr.reduce((s,x)=>s+(x.valor||0), 0);
  // o que for pago no cartão já está na fatura: entra na exibição, mas não na conta
  const fora  = arr => arr.reduce((s,x)=> s + (fonteEhCartao(x.fonteRec) ? 0 : (x.valor||0)), 0);
  const pagos = arr => arr.filter(x=>estaMarcado(x.id,m)).reduce((s,x)=>s+(x.valor||0), 0);
  const P = doMes(S.previstas, m), N = doMes(S.naoprev, m);
  const rc = resumoContas(m), fs = faturasAPagar(m);
  const faturas = fs.reduce((s,x)=>s+x.valor, 0);
  const fatPago = fs.filter(x=>x.pago).reduce((s,x)=>s+x.valor, 0);
  const t = totaisMes(m);
  const comprometido = rc.total + fora(P) + fora(N) + faturas;
  const quitado = rc.pago + pagos(P) + pagos(N) + fatPago;
  return {rec, recOk, fixas: rc.total, prev: cheia(P), nprev: cheia(N),
          faturas, cartaoMes: t.cartoes, porPessoa: t.porPessoa, total: t.total,
          comprometido, quitado,
          pctComp: rec > 0 ? comprometido / rec : (comprometido ? 1.5 : 0),
          pctQuit: comprometido > 0 ? quitado / comprometido : 0,
          hoje: rec - comprometido};
}
function corSemaforo(p){ return p <= .6 ? "var(--pos)" : p <= .9 ? "var(--atn)" : "var(--neg)"; }
function barra(rot, pct, dir, nota, cor){
  const l = Math.max(0, Math.min(1, pct));
  return `<div class="barra"><div class="h"><span>${rot}</span><b class="num" style="color:${cor}">${dir}</b></div>
    <div class="t"><i style="width:${(l*100).toFixed(1)}%;background:${cor}"></i></div>
    ${nota ? `<p class="p">${nota}</p>` : ""}</div>`;
}

function mesnav(){
  return `<div class="top"><div class="mesnav">
    <button data-act="mesResumo" data-v="-1" aria-label="Mês anterior">‹</button>
    <div class="m">${esc(compLabel(S.mesContas))}</div>
    <button data-act="mesResumo" data-v="1" aria-label="Próximo mês">›</button>
  </div></div>`;
}

/* Um item aparece no mês?
   - data única: só no mês daquela data
   - recorrente ou sem data: dentro da janela [desde, ate]
   A janela é o que faz o item valer só do mês em que foi criado pra frente,
   e é ela que preserva o passado quando você edita. */
function noMes(x, m){
  const q = x.quando;
  if (q && q.modo === "data") return String(q.data || "").slice(0, 7) === m;
  if (x.desde && m < x.desde) return false;
  if (x.ate  && m > x.ate)   return false;
  return true;
}
const recorrente = x => !x.quando || x.quando.modo !== "data";

/* Vigência: o mês que você está vendo já está fechado. Tudo que você cria,
   edita ou encerra passa a valer do mês SEGUINTE em diante — a não ser que
   você marque "já neste mês" na folha. */
const proxMes = () => mesSoma(S.mesContas, 1);
const inicioVigencia = t => (t && t.jaNoMes) ? S.mesContas : proxMes();
const doMes = (arr, m) => (arr || []).filter(x => noMes(x, m));

/* ---------- Resumo ---------- */
function viewResumo(){
  const m = S.mesContas, p = panorama(m);
  const linha = (rot, v, forte, sub) =>
    `<div class="linha${forte?" forte":""}"><span>${rot}${sub?`<small>${sub}</small>`:""}</span>
      <b class="num">${brl(v)}</b></div>`;
  const pc = corSemaforo(p.pctComp), estouro = p.comprometido - p.rec;
  return mesnav() + `

sheets.pessoaDet = () => {
  const pid = (UI.tmp||{}).p, per = pessoa(pid), m = S.mesContas;
  if (!per) return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1"><h3>Pessoa não encontrada</h3></div></div>`;
  const itens = itensDoMes(m).filter(it => it.aloc.includes(pid))
    .map(it => ({...it, parte: it.v / it.aloc.length}));
  const porCat = {};
  itens.forEach(it => porCat[it.cat] = (porCat[it.cat]||0) + it.parte);
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const tot = itens.reduce((s,it)=>s+it.parte, 0);
  const mx = cats.length ? cats[0][1] : 1;
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <h3>${esc(per.nome)}</h3>
    <div class="hero" style="margin:0 0 16px"><div class="lbl">Deve neste mês</div>
      <div class="big num">${brl(tot)}</div></div>
    <h2 style="margin-top:0">Por categoria</h2>
    <div class="linhas" style="margin:0 0 18px">
      ${cats.map(([c,v])=>`<div class="linha"><span>${esc(c)}
        <span style="display:block;height:3px;width:${Math.round(v/mx*100)}%;max-width:150px;
          background:${corCat(c)};border-radius:99px;margin-top:5px"></span></span>
        <b class="num">${brl(v)}</b></div>`).join("") || `<p class="vazio">Nada neste mês.</p>`}
    </div>
    <h2 style="margin-top:0">Lançamentos</h2>
    <div class="linhas" style="margin:0">
      ${itens.sort((a,b)=>String(a.d)<String(b.d)?-1:1).map(it=>{
        const mv = marcaVis(it.g);

    </div>
  </div></div>`;
};

/* campos da folha de receita/gasto: grava no rascunho sem redesenhar */
function campoFin(ev){
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if (!el || !UI.tmp) return;
  const q = () => (UI.tmp.quando = UI.tmp.quando || {modo:"sem", dia:1, data:""});
  switch (el.dataset.act){
    case "finF": UI.tmp.fonte = el.value; break;
    case "finV": UI.tmp.valor = isFinite(num(el.value)) ? num(el.value) : 0; break;
    case "finR": UI.tmp.fonteRec = el.value; break;
    case "finDC": UI.tmp.dataCompra = el.value; break;
    case "finO": UI.tmp.obs = el.value; break;
    case "finQD": q().modo = "dia"; q().dia = Math.min(31, Math.max(1, parseInt(el.value,10) || 1)); break;
    case "finQT": q().modo = "data"; q().data = el.value; break;
  }
}
document.addEventListener("input", campoFin);
document.addEventListener("change", campoFin);

sheets.verCat = () => {
  const t = UI.tmp || (UI.tmp = {cat:"", escopo:"atual"});
  let todos = [];
  if (t.escopo === "mes") todos = itensDoMes(S.mesContas);
  else {
    const fs = t.escopo==="todas" ? S.faturas : faturasAtivas();
    fs.forEach(f=>f.lanc.forEach(l=>todos.push(Object.assign({_f:f}, l))));
  }
  const daCat = todos.filter(l=>(l.cat||"Outros")===t.cat);
  const noMes = t.escopo === "mes";
  const totalGeral = todos.reduce((a,l)=>a+l.v,0);
  const totalCat = daCat.reduce((a,l)=>a+l.v,0);
  const pct = totalGeral ? Math.abs(totalCat)/Math.abs(totalGeral)*100 : 0;
  const porPessoa = {};
  daCat.forEach(l=>{
    const a = noMes ? (l.aloc||[]) : alocDe(l.id).filter(id=>pessoa(id));
    if (!a.length){ porPessoa["_"] = (porPessoa["_"]||0) + l.v; return; }
    a.forEach(id=>{ porPessoa[id] = (porPessoa[id]||0) + l.v/a.length; });
  });
  const porEstab = {};
  daCat.forEach(l=>{ porEstab[l.g] = (porEstab[l.g]||0) + l.v; });
  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="badge" style="--c:${corCat(t.cat)}">${esc(inicialCat(t.cat))}</div>
      <h3 style="margin:0">${esc(t.cat)}</h3></div>
    <select data-act="vcescopo" style="margin:10px 0 14px">

sheets.verPessoa = () => {
  const t = UI.tmp || {};
  const p = pessoa(t.p); if (!p) return "";
  const m = S.mesContas;
  const tot = totaisMes(m);
  const meus = itensDoMes(m).filter(it => it.aloc.includes(p.id))
    .map(it => Object.assign({}, it, {parte: it.v / it.aloc.length}));
  const soma = meus.reduce((a,x)=>a+x.parte, 0);
  const pcMes = tot.total ? Math.abs(soma)/Math.abs(tot.total)*100 : 0;
  const soDele = meus.filter(x=>x.aloc.length===1).reduce((a,x)=>a+x.parte,0);
  const dividido = soma - soDele;
  const emCartao = meus.filter(x=>x.fonte==="cartao").reduce((a,x)=>a+x.parte,0);
  const emConta = soma - emCartao;

  const porCat = {}; meus.forEach(x => porCat[x.cat] = (porCat[x.cat]||0) + x.parte);
  const cats = Object.entries(porCat).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const maxc = cats.length ? Math.abs(cats[0][1]) : 1;
  const porEst = {}; meus.forEach(x => porEst[x.g] = (porEst[x.g]||0) + x.parte);
  const ests = Object.entries(porEst).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0, t.tudoEst ? 999 : 8);

  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <div class="badge" style="--c:${CORES[p.cor%8]}">${esc(sigla(p.nome))}</div>
      <div><h3 style="margin:0">${esc(curtoNome(p.nome))}</h3>
        <div style="font-size:13px;color:var(--mute)">${esc(compLabel(m))}</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="rowtop"><div class="nm" style="font-size:15px">Parte no mês</div>
        <div class="val num">${brl(soma)}</div></div>
      <div class="pct"><span style="width:${Math.min(100,pcMes).toFixed(1)}%;background:${CORES[p.cor%8]}"></span></div>
      <div style="font-size:13.5px;color:var(--mute)">
        ${pcMes.toFixed(1).replace(".",",")}% de ${brl(tot.total)} gastos no mês · ${meus.length} itens</div>
    </div>
    <div class="stats" style="padding:2px 0 4px">
      <div class="stat"><b class="num">${brl(soDele)}</b><i>individuais</i></div>
      <div class="stat"><b class="num">${brl(dividido)}</b><i>em dividido</i></div>
      <div class="stat"><b class="num">${brl(emCartao)}</b><i>em cartões</i></div>
      <div class="stat"><b class="num">${brl(emConta)}</b><i>em contas</i></div>
    </div>
    <label class="f">Por categoria</label>
    <div class="row">${cats.length ? cats.map(([c,v]) =>
      barraCat(c, v, soma, maxc, `data-act="vercatmes" data-c="${esc(c)}"`)).join("")
      : `<div class="empty" style="padding:22px">Nada atribuído a ${esc(curtoNome(p.nome))} neste mês.</div>`}</div>
    ${ests.length ? `<label class="f">Maiores gastos</label>
    <div class="row">${ests.map(([g,v])=>`<div class="it">
      <div class="t"><b style="font-size:14.5px">${esc(g)}</b></div>
      <div class="val num" style="font-size:14.5px">${brl(v)}</div></div>`).join("")}
      ${Object.keys(porEst).length>8 && !t.tudoEst ? `<button class="lnk" data-act="tudoest" style="margin-top:10px">
        ver os ${Object.keys(porEst).length} estabelecimentos</button>` : ""}</div>` : ""}
    <button class="btn pri" data-act="filtrarpessoa" data-p="${p.id}">Ver lançamentos de ${esc(curtoNome(p.nome))}</button>
    <button class="btn" data-act="fechar">Fechar</button>
  </div></div>`;
};

        <div style="min-width:0"><div class="n">${esc(c)}</div>

    <div class="row" style="margin-top:12px">

  const t = UI.tmp || {};

  if (!alvo) return "";
  if (t.f === undefined) t.f = {g: alvo.g, valor: paraCampo(alvo.v), p: alvo.p || "",
                                desc: alvo.desc || "", cat: alvo.cat || "Outros"};
  const f = t.f;
  const pv = num(String(f.valor).replace(/[R$\s]/g, ""));
  const irmaos = alvo.serie ? S.faturas.flatMap(x=>x.lanc).filter(y=>y.serie===alvo.serie) : [alvo];

  return `<div class="sheet" data-act="fechar"><div class="sheetbox" data-stop="1">

      ${esc(fat.rotulo)} · ${esc(nomeCartao(fat))} · ${dia(alvo.d)}${alvo.p&&alvo.p!=="estorno"?" · parcela "+alvo.p:""}${alvo.auto?" · previsto":""}</p>

      ${isNaN(pv) ? "digite o valor" : brl(pv)}</div>

    <button class="catbtn" data-act="vercatlanc" style="width:100%;justify-content:flex-start;padding:14px">
