<title>Divisor de Fatura</title>
<style>
:root{
  --paper:#EBEDF1; --card:#fff; --ink:#14161C; --mute:#71757F; --line:#DDE0E6; --pend:#C4C8D1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.num{font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.hd{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 13px}
.hd select{background:#262A33;color:#fff;border:1px solid #363B46;border-radius:8px;padding:6px 8px;font-size:12px;max-width:100%}
.eyebrow{font-size:10px;letter-spacing:.09em;font-weight:700;color:#9BA1AE;text-transform:uppercase}
.big{font-size:38px;font-weight:700;line-height:1.02;letter-spacing:-.025em;margin:2px 0 0}
.sml{font-size:12px;color:#A7ACB8}
.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#3A3E48;margin-top:12px}
.bar>span{transition:width .3s cubic-bezier(.4,0,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:9px;font-size:11px;color:#A7ACB8}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.status{margin-top:8px;font-size:11px}

.body{padding:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:600;font-size:14px;letter-spacing:-.01em;overflow-wrap:anywhere}
.val{font-weight:700;font-size:15px;white-space:nowrap}
.lnk{border:0;background:none;padding:0;font-size:11px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;color:var(--mute);flex:1 1 auto;min-width:62px}
.chip[data-on="1"]{color:#fff}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:#E7E9ED;color:var(--mute);white-space:nowrap}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t i{font-style:normal;font-size:10px;color:var(--mute)}
.mini{display:flex;gap:3px;flex-shrink:0}
.mini button{width:32px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--mute);font-size:9px;font-weight:700;overflow:hidden;padding:0}
.mini button[data-on="1"]{color:#fff}

.tog{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:10px}
.tog button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mute)}
.tog button[data-on="1"]{background:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:12px}
.check input{width:16px;height:16px;margin:0}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.foot button{flex:1;border-radius:10px;padding:13px 6px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink)}
.foot button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}

h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;font-weight:700}
h2:first-child{margin-top:4px}
label.f{display:block;font-size:11px;color:var(--mute);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:130px;font-family:ui-monospace,monospace;font-size:12px}
.btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;margin-top:8px;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dgr{color:#B0234A;border-color:#F0C9D3}
.mini2{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:600;color:var(--mute)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,17,22,.55);display:flex;align-items:flex-end}
.sheetbox{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.sheetbox h3{margin:0 0 4px;font-size:17px;letter-spacing:-.02em}
.warn{background:#FFF4D6;border:1px solid #E8CE86;border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px;white-space:pre-wrap}
.pv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;display:grid;grid-template-columns:64px 1fr 84px 52px 28px;gap:5px;align-items:center}
.pv input{padding:6px;font-size:12px;border-radius:6px}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:34px 16px;line-height:1.6}
</style>
</head>

/* ---------------- armazenamento ---------------- */
let MEM = null, AVISO_STORAGE = "";
const DB = {
  read(){
    if (MEM) return MEM;
    try {
      const s = localStorage.getItem("divisor:v1");
      return s ? JSON.parse(s) : null;
    } catch(e){
      AVISO_STORAGE = "Este navegador bloqueou o armazenamento. Suas marcações valem só enquanto a tela estiver aberta — instale o app na tela inicial para que fiquem salvas.";
      return MEM;
    }
  },
  write(s){
    MEM = s;
    try { localStorage.setItem("divisor:v1", JSON.stringify(s)); } catch(e){
      AVISO_STORAGE = "Não consegui salvar no aparelho. Use Configurar › Backup para não perder o trabalho.";
    }
  }
};

/* ---------------- estado ---------------- */
const CORES = ["#6A34C9","#0A7568","#AC5F08","#B0234A","#1E5FB4","#4E7A0C","#8A3FA0","#0F6E8C"];
const CORESBG = ["#EDE5FC","#D9EFEB","#FAEAD5","#FBE3E9","#E2ECFA","#EAF2DC","#F6E6FA","#DFEEF4"];
const uid = p => p + Math.random().toString(36).slice(2,8);

function inicial(){
  const eu = {id:"p1", nome:"Eu", cor:0};
  const ele = {id:"p2", nome:"Ele", cor:1};
  const cartao = {id:"c1", nome:"Personnalité", pagador:"p2"};
  const lanc = SEED.map((x,i)=>({id:"s"+i, d:x.d, r:x.r, g:x.g, v:x.v, p:x.p||null}));
  return {
    pessoas:[eu,ele], euId:"p1", cartoes:[cartao],
    faturas:[{id:"f1", cartaoId:"c1", rotulo:"Julho/26", lanc}],
    regras:{}, aloc:{}, ativa:"f1"
  };
}
let S = DB.read() || inicial();
if (!DB.read()) DB.write(S);

let UI = {view:"lista", modo:"grupo", soPend:false, aberto:null, sheet:null, tmp:null};

/* ---------------- utilidades ---------------- */
const brl = n => (n<0?"−R$ ":"R$ ") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dia = s => /^\d{4}-/.test(s) ? s.slice(8,10)+"/"+s.slice(5,7) : s;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pessoa = id => S.pessoas.find(p=>p.id===id);
const fatura = () => S.faturas.find(f=>f.id===S.ativa) || S.faturas[0];
const cartaoDe = f => S.cartoes.find(c=>c.id===f.cartaoId) || S.cartoes[0];
const alocDe = id => S.aloc[id] || [];
const salvar = () => DB.write(S);
const curto = nome => nome.length>7 ? nome.slice(0,6)+"." : nome;

function totais(f){
  const t = {porPessoa:{}, total:0, pend:0, nPend:0, alocado:0};
  S.pessoas.forEach(p=>t.porPessoa[p.id]=0);
  (f?f.lanc:[]).forEach(l=>{
    t.total += l.v;
    const a = alocDe(l.id).filter(id=>pessoa(id));
    if (!a.length){ t.pend += l.v; t.nPend++; return; }
    t.alocado += l.v;
    a.forEach(id => t.porPessoa[id] += l.v/a.length);
  });
  return t;
}

/* ---------------- alocação ---------------- */
function togglePessoa(lancIds, pid, grupo){
  const primeiro = alocDe(lancIds[0]);
  const ligar = !primeiro.includes(pid) || lancIds.some(id=>!alocDe(id).includes(pid));
  lancIds.forEach(id=>{
    const a = new Set(alocDe(id));
    if (ligar) a.add(pid); else a.delete(pid);
    const arr = [...a];
    if (arr.length) S.aloc[id] = arr; else delete S.aloc[id];
  });
  if (grupo){
    const a = alocDe(lancIds[0]);
    if (a.length) S.regras[grupo] = a; else delete S.regras[grupo];
  }
  salvar(); render();
}

/* ---------------- render ---------------- */
function render(){
  const y = window.scrollY;
  document.getElementById("app").innerHTML = UI.view==="config" ? viewConfig() : viewLista();
  document.getElementById("modal").innerHTML = UI.sheet ? sheets[UI.sheet]() : "";
  document.body.style.overflow = UI.sheet ? "hidden" : "";
  window.scrollTo(0,y);
}

function header(){
  const f = fatura();
  if (!f) return `<div class="hd"><div class="eyebrow">Divisor de fatura</div><div class="sml" style="margin-top:8px">Nenhuma fatura cadastrada ainda.</div></div>`;
  const c = cartaoDe(f), t = totais(f);
  const pag = pessoa(c.pagador);
  const eu = pessoa(S.euId);
  let titulo, valor;
  if (pag && eu && pag.id !== eu.id){
    titulo = "Você transfere para " + pag.nome;
    valor = t.porPessoa[eu.id] || 0;
  } else {
    const outros = S.pessoas.filter(p=>p.id!==(pag?pag.id:null)).reduce((a,p)=>a+(t.porPessoa[p.id]||0),0);
    titulo = "Você tem a receber";
    valor = outros;
  }
  const larg = v => t.total ? Math.max(0, Math.abs(v)/Math.abs(t.total)*100) : 0;
  return `<div class="hd">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div class="eyebrow">${esc(c?c.nome:"")}</div>
      <select data-act="fatura">${S.faturas.map(x=>`<option value="${x.id}"${x.id===f.id?" selected":""}>${esc(x.rotulo)}</option>`).join("")}</select>
    </div>
    <div class="sml" style="margin-top:9px">${esc(titulo)}</div>
    <div class="big num">${brl(valor)}</div>
    <div class="bar">
      ${S.pessoas.map(p=>`<span style="width:${larg(t.porPessoa[p.id])}%;background:${CORES[p.cor%8]}"></span>`).join("")}
    </div>
    <div class="legend">
      ${S.pessoas.map(p=>`<span><i class="dot" style="background:${CORES[p.cor%8]}"></i>${esc(p.nome)} <b class="num">${brl(t.porPessoa[p.id]||0)}</b></span>`).join("")}
    </div>
    <div class="status" style="color:${t.nPend?"#FFC46B":"#7FE0C6"}">
      ${t.nPend ? t.nPend+" lançamento"+(t.nPend>1?"s":"")+" sem dono · fatura "+brl(t.total) : "Tudo classificado · fatura "+brl(t.total)}
    </div>
  </div>`;
}

function chipsHTML(aloc, attrs){
  return `<div class="chips">${S.pessoas.map(p=>{
    const on = aloc.includes(p.id);
    return `<button class="chip" data-on="${on?1:0}" ${attrs(p.id)}
      style="${on?`background:${CORES[p.cor%8]};border-color:${CORES[p.cor%8]}`:""}">${esc(p.nome)}</button>`;
  }).join("")}</div>`;
}

function viewLista(){
  const f = fatura();
  if (!f) return header() + `<div class="empty">Vá em <b>Configurar</b> para criar sua primeira fatura e colar os lançamentos.</div>` + footer();
  let corpo = "";
  if (UI.modo==="grupo"){
    const m = {};
    f.lanc.forEach(l=>{ (m[l.g] = m[l.g] || {g:l.g, itens:[], total:0}); m[l.g].itens.push(l); m[l.g].total += l.v; });
    let grupos = Object.values(m).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
    grupos.forEach(g=>{
      const chaves = g.itens.map(i=>JSON.stringify([...alocDe(i.id)].sort()));
      g.misto = new Set(chaves).size > 1;
      g.aloc = g.misto ? [] : alocDe(g.itens[0].id);
    });
    if (UI.soPend) grupos = grupos.filter(g=>g.misto || !g.aloc.length);
    corpo = grupos.map(g=>{
      const cor = g.aloc.length===1 ? CORES[pessoa(g.aloc[0]).cor%8] : null;
      const bg  = g.aloc.length===1 ? CORESBG[pessoa(g.aloc[0]).cor%8] : null;
      const exp = UI.aberto===g.g;
      return `<div class="row" style="${cor?`border-color:${cor};background:${bg}`:""}">
        <div class="rowtop">
          <div style="min-width:0">
            <div class="nm">${esc(g.g)}</div>
            <button class="lnk" data-act="exp" data-g="${esc(g.g)}">${g.itens.length} ${g.itens.length===1?"lançamento":"lançamentos"} ${exp?"▴":"▾"}</button>
            ${g.misto?`<span class="tag">misto</span>`:""}
            ${g.aloc.length>1?`<span class="tag">dividido ÷${g.aloc.length}</span>`:""}
          </div>
          <div class="val num">${brl(g.total)}</div>
        </div>
        ${chipsHTML(g.aloc, pid=>`data-act="tg" data-g="${esc(g.g)}" data-p="${pid}"`)}
        ${exp?`<div class="sub">${g.itens.map(itemHTML).join("")}</div>`:""}
      </div>`;
    }).join("") || `<div class="empty">Nada pendente por aqui.</div>`;
  } else {
    const itens = f.lanc.filter(l=>!UI.soPend || !alocDe(l.id).length).slice().sort((a,b)=>a.d<b.d?1:-1);
    corpo = `<div class="row">${itens.map(l=>itemHTML(l,true)).join("") || `<div class="empty">Nada pendente.</div>`}</div>`;
  }
  return header() + `<div class="body">
    ${AVISO_STORAGE?`<div class="warn">${esc(AVISO_STORAGE)}</div>`:""}
    <div class="tog">
      <button data-act="modo" data-v="grupo" data-on="${UI.modo==="grupo"?1:0}">Por estabelecimento</button>
      <button data-act="modo" data-v="item" data-on="${UI.modo==="item"?1:0}">Por lançamento</button>
    </div>
    <label class="check"><input type="checkbox" data-act="sopend" ${UI.soPend?"checked":""}> Mostrar só o que falta</label>
    ${corpo}
    <p style="font-size:11px;color:var(--mute);line-height:1.55;margin-top:14px">
      Toque num nome para atribuir, toque de novo para desfazer. Dois ou mais nomes acesos dividem o valor em partes iguais.
      Escolhas feitas no estabelecimento viram regra e voltam prontas nas próximas faturas.
    </p>
  </div>` + footer();
}

function itemHTML(l, full){
  const a = alocDe(l.id);
  return `<div class="it">
    <div class="t">
      <b>${esc(full?l.g:l.r)}</b>
      <i>${dia(l.d)}${l.p ? (l.p==="estorno" ? " · estorno" : " · parcela "+l.p) : ""}${a.length>1?" · ÷"+a.length:""}</i>

    <div class="val num" style="font-size:12px">${brl(l.v)}</div>

}

    <select data-act="xescopo"><option value="atual"${t.escopo==="atual"?" selected":""}>Só a fatura aberta</option><option value="todas"${t.escopo==="todas"?" selected":""}>Todas as faturas</option></select>
    <label class="f">Formato</label>
    <select data-act="xformato"><option value="csv"${t.formato==="csv"?" selected":""}>Planilha (.csv)</option><option value="texto"${t.formato==="texto"?" selected":""}>Texto para mandar no chat</option></select>

    <button class="btn" data-act="fechar">Cancelar</button>
  </div></div>`;
};

    <label class="f">Nome da fatura</label>

sheets.importar = () => {

      Cole o texto da fatura. Funciona com o formato do app do banco (data, estabelecimento e valor em linhas separadas)
      e também com uma linha por gasto: <b>03/07 | Padaria | 35,98 | 1/3</b></p>
    <textarea data-act="imptxt" placeholder="3 de julho&#10;Superquadra 3&#10;R$ 396,36">${esc(t.txt)}</textarea>

    <div class="pv" style="font-weight:700;font-size:10px;color:var(--mute);background:none;border:0;padding:0 8px">
      <span>DATA</span><span>ESTABELECIMENTO</span><span>VALOR</span><span>PARC.</span><span></span></div>
    ${t.prev.map((x,i)=>`<div class="pv">
      <input data-act="pv" data-k="d" data-i="${i}" value="${esc(x.d)}">
      <input data-act="pv" data-k="g" data-i="${i}" value="${esc(x.g)}">
      <input data-act="pv" data-k="v" data-i="${i}" value="${esc(x.v)}" class="num">
      <input data-act="pv" data-k="p" data-i="${i}" value="${esc(x.p||"")}">
      <button class="mini2" data-act="pvdel" data-i="${i}" style="padding:6px">✕</button>
    </div>`).join("")}
    <button class="btn pri" data-act="impconfirma">Importar ${t.prev.length} lançamentos</button>
    <button class="btn" data-act="impvoltar">Voltar e colar de novo</button>

/* ---------------- leitor de fatura colada ---------------- */
const MESES = {janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const RUIDO = /^(cart[aã]o virtual adicional|carteiras digitais adicional|adicional|image labels.*|[<>»«\\\-–—]+)$/i;
const RE_VAL = /(-|−|\\-)?\s*R\$\s*([\d.]+,\d{2})/;
const RE_PARC1 = /parcela\s+(\d+)\s+de\s+(\d+)/i;
const RE_PARC2 = /(\d{2})\s*\/\s*(\d{2})\s*$/;

function num(s){ return parseFloat(s.replace(/\./g,"").replace(",",".")); }

function lerColado(txt){
  const linhas = txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s && !RUIDO.test(s));
  // formato estruturado: separador | ou ;
  const sep = linhas.filter(l=>/[|;]/.test(l)).length > linhas.length*0.5;
  if (sep){
    return linhas.map(l=>{
      const c = l.split(/[|;]/).map(s=>s.trim());
      return {d:c[0]||"", g:c[1]||"", v:(c[2]||"").replace(/R\$\s*/,""), p:c[3]||""};
    }).filter(x=>x.g);
  }
  // formato do app do banco: nomes numa coluna, valores noutra
  let dataAtual = "";
  const nomes = [], valores = [];
  for (const l of linhas){
    let m = l.match(/^(\d{1,2})\s+de\s+([a-zç]+)/i);
    if (m && MESES[m[2].toLowerCase()]){ dataAtual = String(m[1]).padStart(2,"0")+"/"+String(MESES[m[2].toLowerCase()]).padStart(2,"0"); continue; }
    m = l.match(/^(\d{1,2})\/(\d{1,2})(\/\d{2,4})?$/);
    if (m){ dataAtual = m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"); continue; }
    const v = l.match(RE_VAL);
    const semValor = v ? l.replace(RE_VAL,"").replace(RE_PARC1,"").replace(/[>›»]/g,"").trim() : "";
    if (v && semValor.length > 2){
      // nome e valor na mesma linha
      const pm = l.match(RE_PARC1);
      nomes.push({d:dataAtual, g:limpaNome(semValor), p:pm?pm[1]+"/"+pm[2]:parcNoNome(semValor)});
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else if (v){
      const pm = l.match(RE_PARC1);
      valores.push({v:(v[1]?"-":"")+v[2], p:pm?pm[1]+"/"+pm[2]:""});
    } else {
      const pm = l.match(RE_PARC1);
      if (pm && valores.length){ valores[valores.length-1].p = pm[1]+"/"+pm[2]; continue; }
      nomes.push({d:dataAtual, g:limpaNome(l), p:parcNoNome(l)});
    }
  }
  return nomes.map((n,i)=>({d:n.d, g:n.g, v:valores[i]?valores[i].v:"", p:n.p || (valores[i]?valores[i].p:"") || ""}));
}
function parcNoNome(s){ const m = s.match(RE_PARC2); return m ? String(+m[1])+"/"+String(+m[2]) : ""; }
function limpaNome(s){
  return s.replace(RE_PARC2,"").replace(/[>›»<‹«]/g,"").replace(/\s{2,}/g," ").trim();
}

/* ---------------- exportação ---------------- */
function linhasExport(t){
  const faturas = t.escopo==="todas" ? S.faturas : [fatura()].filter(Boolean);
  const out = [];
  faturas.forEach(f=>{
    const c = cartaoDe(f);
    f.lanc.forEach(l=>{
      const a = alocDe(l.id).filter(id=>pessoa(id));
      if (!a.length){
        if (t.pend) out.push({fatura:f.rotulo, cartao:c?c.nome:"", d:dia(l.d), g:l.g, r:l.r, p:l.p||"", total:l.v, div:0, quem:"(sem dono)", valor:l.v});
        return;
      }
      a.forEach(id=>{
        if (!t.sel.includes(id)) return;
        out.push({fatura:f.rotulo, cartao:c?c.nome:"", d:dia(l.d), g:l.g, r:l.r, p:l.p||"", total:l.v, div:a.length, quem:pessoa(id).nome, valor:l.v/a.length});
      });
    });
  });
  return out;
}

function gerarCSV(t){
  const L = linhasExport(t);
  const cab = ["fatura","cartao","data","estabelecimento","descricao_original","parcela","valor_total","dividido_entre","pessoa","valor_da_pessoa"];
  const linha = o => [o.fatura,o.cartao,o.d,o.g,o.r,o.p,o.total.toFixed(2).replace(".",","),o.div||"",o.quem,o.valor.toFixed(2).replace(".",",")]
    .map(x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`).join(";");
  return "\uFEFF" + cab.join(";") + "\n" + L.map(linha).join("\n");
}

function gerarTexto(t){
  const L = linhasExport(t);
  const nomes = [...new Set(L.map(o=>o.quem))];
  const out = [];
  (t.escopo==="todas" ? "Todas as faturas" : fatura().rotulo).split("\n").forEach(x=>out.push(x));
  out.push("");
  nomes.forEach(nome=>{
    const meus = L.filter(o=>o.quem===nome);
    const porGrupo = {};
    meus.forEach(o=>{ porGrupo[o.g] = (porGrupo[o.g]||0) + o.valor; });
    out.push(nome.toUpperCase());
    Object.entries(porGrupo).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))
      .forEach(([g,v])=>out.push("  " + g + " — " + brl(v)));
    out.push("  subtotal: " + brl(meus.reduce((a,o)=>a+o.valor,0)));
    out.push("");
  });
  const f = fatura(), c = f?cartaoDe(f):null, pag = c?pessoa(c.pagador):null;
  if (pag && t.escopo==="atual"){
    const tt = totais(f);
    out.push("Fatura: " + brl(tt.total));
    S.pessoas.filter(p=>p.id!==pag.id).forEach(p=>out.push(p.nome + " transfere para " + pag.nome + ": " + brl(tt.porPessoa[p.id]||0)));
  }
  return out.join("\n");
}

function baixar(nome, conteudo, tipo){
  const b = new Blob([conteudo], {type:tipo});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 800);
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", ev => {
  const box = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-act]");
  if (!el){ return; }
  const act = el.dataset.act, i = el.dataset.i, v = el.dataset.v, pid = el.dataset.p;
  if (act === "fechar" && !box){ UI.sheet = null; UI.tmp = null; return render(); }
  if (act === "fechar"){ UI.sheet = null; UI.tmp = null; return render(); }

  switch(act){
    case "ir": UI.view = v; window.scrollTo(0,0); return render();
    case "sheet": UI.sheet = v; UI.tmp = null; return render();
    case "modo": UI.modo = v; return render();
    case "exp": UI.aberto = (UI.aberto === el.dataset.g) ? null : el.dataset.g; return render();
    case "tg": {
      const f = fatura();
      const ids = f.lanc.filter(l=>l.g===el.dataset.g).map(l=>l.id);
      return togglePessoa(ids, pid, el.dataset.g);
    }
    case "tgi": return togglePessoa([i], pid, null);

    case "addp": {
      const nome = prompt("Nome da pessoa:");
      if (!nome) return;
      S.pessoas.push({id:uid("p"), nome:nome.trim(), cor:S.pessoas.length});
      salvar(); return render();
    }
    case "delp": {
      if (!confirm("Remover essa pessoa? As atribuições dela serão desfeitas.")) return;
      S.pessoas = S.pessoas.filter(p=>p.id!==i);
      Object.keys(S.aloc).forEach(k=>{
        S.aloc[k] = S.aloc[k].filter(x=>x!==i);
        if (!S.aloc[k].length) delete S.aloc[k];
      });
      Object.keys(S.regras).forEach(k=>{
        S.regras[k] = S.regras[k].filter(x=>x!==i);
        if (!S.regras[k].length) delete S.regras[k];
      });
      S.cartoes.forEach(c=>{ if (c.pagador===i) c.pagador = S.pessoas[0].id; });
      if (S.euId===i) S.euId = S.pessoas[0].id;
      salvar(); return render();
    }
    case "soueu": S.euId = i; salvar(); return render();
    case "addc": {
      const nome = prompt("Nome do cartão:");
      if (!nome) return;
      S.cartoes.push({id:uid("c"), nome:nome.trim(), pagador:S.pessoas[0].id});
      salvar(); return render();
    }
    case "abrir": S.ativa = i; UI.view="lista"; salvar(); window.scrollTo(0,0); return render();
    case "delf": {
      if (!confirm("Apagar essa fatura e seus lançamentos?")) return;
      const f = S.faturas.find(x=>x.id===i);
      if (f) f.lanc.forEach(l=>delete S.aloc[l.id]);
      S.faturas = S.faturas.filter(x=>x.id!==i);
      if (S.ativa===i) S.ativa = S.faturas[0] ? S.faturas[0].id : null;
      salvar(); return render();
    }
    case "limparRegras":
      if (!confirm("Apagar todas as regras de estabelecimento?")) return;
      S.regras = {}; salvar(); return render();
    case "backup":
      baixar("divisor-backup-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S), "application/json");
      return;
    case "restaurar": return document.getElementById("filein").click();

    case "nfcriar": {
      const t = UI.tmp || {};
      const rot = (t.rotulo||"").trim() || "Nova fatura";
      const nova = {id:uid("f"), cartaoId:t.cartao||S.cartoes[0].id, rotulo:rot, lanc:[]};
      S.faturas.unshift(nova); S.ativa = nova.id; salvar();
      UI.sheet = "importar"; UI.tmp = null; return render();
    }
    case "impler": {
      const prev = lerColado((UI.tmp&&UI.tmp.txt)||"");
      if (!prev.length){ alert("Não consegui identificar lançamentos nesse texto."); return; }
      UI.tmp.prev = prev; return render();
    }
    case "impvoltar": UI.tmp.prev = null; return render();
    case "pvdel": UI.tmp.prev.splice(+i,1); return render();
    case "impconfirma": {
      const f = fatura();
      let n = 0;
      UI.tmp.prev.forEach(x=>{
        const val = num(String(x.v).replace(/[R$\s]/g,""));
        if (!x.g || isNaN(val)) return;
        const id = uid("l");
        f.lanc.push({id, d:x.d||"", r:x.g, g:x.g, v:val, p:(x.p||"").trim()||null});
        if (S.regras[x.g]) S.aloc[id] = S.regras[x.g].slice();
        n++;
      });
      salvar(); UI.sheet=null; UI.tmp=null; UI.view="lista"; window.scrollTo(0,0); render();
      alert(n + " lançamentos importados.");
      return;
    }
    case "xgerar": {
      const t = UI.tmp;
      if (!t.sel.length && !t.pend){ alert("Escolha pelo menos uma pessoa."); return; }
      if (t.formato==="csv"){
        baixar("gastos-"+(t.escopo==="todas"?"tudo":(fatura().rotulo.replace(/\W+/g,"-").toLowerCase()))+".csv", gerarCSV(t), "text/csv;charset=utf-8");
        UI.sheet=null; UI.tmp=null; return render();
      }
      const txt = gerarTexto(t);
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{ UI.sheet=null; UI.tmp=null; render(); alert("Resumo copiado."); },
          ()=>{ prompt("Copie o resumo:", txt); });
      } else prompt("Copie o resumo:", txt);
      return;
    }
  }
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  switch(act){
    case "fatura": S.ativa = el.value; salvar(); window.scrollTo(0,0); return render();
    case "sopend": UI.soPend = el.checked; return render();
    case "pagador": { const c = S.cartoes.find(x=>x.id===i); if (c) c.pagador = el.value; salvar(); return render(); }
    case "renome": { const p = pessoa(i); if (p && el.value.trim()) p.nome = el.value.trim(); salvar(); return render(); }
    case "renomec": { const c = S.cartoes.find(x=>x.id===i); if (c && el.value.trim()) c.nome = el.value.trim(); salvar(); return render(); }
    case "xsel": { const t = UI.tmp; t.sel = el.checked ? [...new Set([...t.sel, i])] : t.sel.filter(x=>x!==i); return; }
    case "xpend": UI.tmp.pend = el.checked; return;
    case "xescopo": UI.tmp.escopo = el.value; return;
    case "xformato": UI.tmp.formato = el.value; return render();
    case "nfcartao": UI.tmp.cartao = el.value; return;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "imptxt"){ UI.tmp = UI.tmp || {}; UI.tmp.txt = el.value; return; }
  if (el.dataset.act === "nfrotulo"){ UI.tmp = UI.tmp || {}; UI.tmp.rotulo = el.value; return; }
  if (el.dataset.act === "pv"){ UI.tmp.prev[+el.dataset.i][el.dataset.k] = el.value; return; }
});

document.addEventListener("change", ev => {
  if (ev.target.id !== "filein") return;
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.pessoas || !d.faturas) throw 0;
      S = d; salvar(); render(); alert("Backup restaurado.");
    } catch(e){ alert("Esse arquivo não é um backup válido do app."); }
  };
  r.readAsText(file);
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
